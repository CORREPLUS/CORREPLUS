<!doctype html>
<html lang="es" data-theme="light">
<head>
<script src="config.js" onerror=""></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CorrePlus CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f5f9; --panel:#ffffff; --text:#1d2433; --muted:#6b7385; --line:#e4e8ef;
  --brand:#1f5fbf; --brand-soft:#e7f0fc;
  --blue:#2f7be5; --blue-s:#e3efff; --amber:#e0a100; --amber-s:#fff5d9;
  --green:#1fa463; --green-s:#e1f6ea; --red:#e0475b; --red-s:#fde6ea;
  --teal:#13a8a8; --teal-s:#dff6f6; --orange:#ef6a3a; --orange-s:#fde9e1;
  --shadow:0 1px 2px rgba(20,30,60,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151c; --panel:#1a2029; --text:#e6e9ef; --muted:#97a0b2; --line:#2a323e;
    --brand:#6fa5ff; --brand-soft:#1d2b42;
    --blue-s:#1d2b42; --amber-s:#3a3014; --green-s:#16332a; --red-s:#3d1d24; --teal-s:#123434; --orange-s:#3d2419;
  }
}
:root[data-theme="dark"]{
  --bg:#11151c; --panel:#1a2029; --text:#e6e9ef; --muted:#97a0b2; --line:#2a323e;
  --brand:#6fa5ff; --brand-soft:#1d2b42;
  --blue-s:#1d2b42; --amber-s:#3a3014; --green-s:#16332a; --red-s:#3d1d24; --teal-s:#123434; --orange-s:#3d2419;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh;transition:grid-template-columns .2s}
aside{background:linear-gradient(180deg,var(--panel),var(--bg));border-right:1px solid var(--line);padding:12px 10px;position:sticky;top:0;height:100vh;overflow:auto}
.sidetop{display:flex;align-items:center;gap:10px;padding:2px 4px 14px}
.hamb{border:0;background:none;cursor:pointer;color:var(--muted);padding:6px;border-radius:8px;display:grid;place-items:center}
.hamb:hover{background:var(--bg)}
.logo{font-weight:800;font-size:18px;color:var(--brand);letter-spacing:.3px;line-height:1.1}
.logo small{display:block;font-weight:500;font-size:10px;color:var(--muted);letter-spacing:0}
nav button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:6px 8px;margin:2px 0;border-radius:12px;cursor:pointer;text-align:left;text-transform:uppercase;font-size:12.5px;font-weight:500;letter-spacing:.2px;color:var(--text)}
nav button:hover{background:var(--panel);box-shadow:var(--shadow)}
nav .nico{width:34px;height:34px;border-radius:10px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;flex:none;color:var(--text)}
nav .nico svg{width:18px;height:18px}
nav .nlbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav button.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
nav button.on .nico{background:var(--panel);border-color:var(--brand-soft);color:var(--brand)}
nav button.open:not(.on){font-weight:600}
nav .chev{margin-left:auto;transition:transform .2s;color:var(--muted);display:grid;place-items:center}
nav .chev svg{width:14px;height:14px}
nav button.open .chev{transform:rotate(180deg);color:var(--brand)}
nav .subnav{position:relative;margin:2px 0 6px 25px;padding-left:14px;border-left:1.5px solid var(--line)}
nav .subnav button{text-transform:none;font-size:13px;font-weight:400;padding:7px 10px;margin:1px 0;border-radius:8px;position:relative;color:var(--text)}
nav .subnav button::before{content:'';position:absolute;left:-14px;top:50%;width:10px;border-top:1.5px solid var(--line)}
nav .subnav button:hover{box-shadow:none;background:var(--panel)}
nav .subnav button.on{background:none;color:var(--brand);font-weight:600}
nav .subnav button.on::before{border-color:var(--brand)}
nav hr{border:0;border-top:1px solid var(--line);margin:10px 4px}
nav .soon{margin-left:auto;font-size:9px;color:var(--muted);text-transform:none;border:1px solid var(--line);border-radius:99px;padding:1px 6px}
/* menú encogido: solo íconos */
.app.mini{grid-template-columns:72px 1fr}
.app.mini .logo,.app.mini .nlbl,.app.mini .chev,.app.mini .soon,.app.mini .subnav{display:none}
.app.mini nav button{justify-content:center;padding:6px 0}
.app.mini .sidetop{justify-content:center}
main{padding:20px 24px;min-width:0}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.top h1{font-size:22px;margin:0;flex:1}
.yo{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}.yo:empty{display:none}.yo .btn{padding:4px 10px;font-size:12px}
.ro #actions .btn.primary,.ro #view .btn.danger,.ro #view td .btn{display:none!important}
body.bloqueado .app{visibility:hidden}
#login{position:fixed;inset:0;z-index:100;background:linear-gradient(135deg,#005A60,#00838c);display:flex;align-items:center;justify-content:center;padding:16px}
#login .lg-card{background:#fff;border-radius:16px;padding:28px;width:100%;max-width:380px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
#login .lg-logo{height:52px;display:block;margin:0 auto 10px}#login h2{text-align:center;margin:6px 0 14px;font-size:18px;color:#005A60}
#login .lg-form{display:flex;flex-direction:column;gap:12px}#login label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:#5b6573}#login input{padding:10px;border:1px solid #d5dde2;border-radius:8px;font-size:14px}
#login .btn.primary{padding:11px;font-size:14px}#login .lg-links{display:flex;justify-content:space-between;gap:8px;font-size:12px;flex-wrap:wrap}
#login .lg-msg{background:#f2f8f8;border-left:3px solid #00B9C5;padding:8px 10px;border-radius:6px;font-size:13px;margin-bottom:12px;color:#1c2430}
.nube{font-size:12px;color:var(--muted);white-space:nowrap;padding:4px 10px;border-radius:20px;background:var(--panel);border:1px solid var(--line)}.nube.ok{color:#1b7a46}.nube.run{color:#9a6a00}.nube.err{color:#b42318}.nube.off{color:var(--muted)}.nube.nuevo{color:#fff;background:var(--brand);border-color:var(--brand);cursor:pointer}
.menu-btn{display:none}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.danger{color:var(--red)}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr)}
@media (max-width:1250px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
.row2{grid-template-columns:2fr 1fr 1fr}
.row3{grid-template-columns:1fr 1fr 2fr}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 4px;font-size:15px}
.card .sub{color:var(--muted);font-size:12px;margin-bottom:8px}
.kpi{display:flex;gap:14px;align-items:center;cursor:pointer}
.ico{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;flex:none}
.ico svg{width:22px;height:22px}
.kpi .lbl{color:var(--muted);font-size:12px}
.kpi .val{font-size:26px;font-weight:700}
.tasks div{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.tasks div:last-child{border:0}
.tasks b{margin-left:auto}
.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.toolbar input,.toolbar select{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 10px}
.toolbar input{flex:1;min-width:180px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
tr:hover td{background:var(--bg)}
td.num,th.num{text-align:right}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600}
.p-blue{background:var(--blue-s);color:var(--blue)} .p-amber{background:var(--amber-s);color:var(--amber)}
.p-green{background:var(--green-s);color:var(--green)} .p-red{background:var(--red-s);color:var(--red)}
.p-gray{background:var(--bg);color:var(--muted)} .p-teal{background:var(--teal-s);color:var(--teal)}
.empty{color:var(--muted);padding:24px;text-align:center}
.link{color:var(--brand);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;padding:26px;border:2px dashed var(--line);border-radius:14px;background:var(--bg);color:var(--brand);cursor:pointer;text-align:center;transition:.15s}
.drop:hover,.drop.on{border-color:var(--accent);background:var(--accent-s)}
.drop b{color:var(--text)}
.carta{background:#fff;border:1px solid var(--line);border-radius:12px;padding:36px 44px 20px;box-shadow:var(--shadow);max-width:760px;margin:auto}
.carta-logo{height:46px;display:block;margin-bottom:22px}
.carta textarea{width:100%;border:0;resize:none;font:inherit;font-size:14.5px;line-height:1.6;color:#14262b;background:transparent;outline:none;text-transform:none;overflow:hidden;min-height:300px}
.carta textarea:focus{background:#fbfdfd}
.carta-pie{border-top:1px solid var(--line);margin-top:18px;padding-top:8px;font-size:11px;color:var(--muted)}
@media (max-width:900px){#view .grid[style*="360px"]{grid-template-columns:1fr !important}}
dialog.wide{width:min(920px,calc(100vw - 32px))}
.det2{display:grid;grid-template-columns:1fr 1fr;gap:4px 28px}
@media (max-width:760px){.det2{grid-template-columns:1fr}}
.kpis3{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0}
.kpis3>div{background:var(--bg);border-radius:10px;padding:8px 10px}
.kpis3 b{display:block;font-size:16px}
@media (max-width:760px){.kpis3{grid-template-columns:1fr 1fr}}
dialog{border:0;border-radius:14px;padding:0;width:min(640px,calc(100vw - 32px));background:var(--panel);color:var(--text);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(10,15,25,.45)}
.dlg-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.dlg-h h2{margin:0;font-size:17px;flex:1}
.dlg-b{padding:16px 20px;max-height:70vh;overflow:auto}
.dlg-f{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.form label>input:not([type=checkbox]),.form label>select,.form label>textarea{width:100%;min-width:0}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.form label.full{grid-column:1/-1}
.form .form-sec{grid-column:1/-1;font-size:12px;font-weight:700;color:var(--brand);text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--line);padding:8px 0 4px;margin-top:4px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.pcol{display:grid;gap:14px;min-width:0}
.pcol .card h3{margin-bottom:12px}
.ptabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.ptabs button{border:0;background:none;padding:9px 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.ptabs button.on{color:var(--brand);border-color:var(--brand);font-weight:600}
.ptabs button:disabled{opacity:.4;cursor:not-allowed}
.form .chk,.chk{flex-direction:row !important;align-items:center;gap:6px;color:var(--text);font-size:13px;display:inline-flex}
.form .inline{display:flex;gap:6px;align-items:center}
.form .inline .chk{border:1px solid var(--line);border-radius:8px;padding:7px 8px;background:var(--panel);white-space:nowrap;font-size:12px}
.form .inline input:not([type=checkbox]){flex:1;min-width:0}
.form input,.form select,.form textarea,.ftbl input,.ftbl select,.chips input{color:var(--text);font-weight:500}
.form input::placeholder,.form textarea::placeholder,.ftbl input::placeholder,.chips input::placeholder{color:var(--muted);opacity:.6;font-weight:400}
.form input:disabled,.form select:disabled,.ftbl input:disabled{color:var(--text);-webkit-text-fill-color:var(--text);opacity:1;background:var(--line);cursor:not-allowed}
.form .err,.err{border-color:var(--red) !important;box-shadow:0 0 0 2px var(--red-s)}
.chips{display:flex;flex-wrap:wrap;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px}
.chips input{border:0 !important;background:none !important;flex:1;min-width:160px;padding:2px 4px !important}
.chip{background:var(--brand-soft);color:var(--brand);border-radius:99px;padding:2px 4px 2px 10px;font-size:12px;display:inline-flex;align-items:center;gap:2px}
.chip button{border:0;background:none;color:inherit;cursor:pointer;font-size:14px;line-height:1}
.tog{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:2px 8px 2px 2px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:11px;color:var(--muted)}
.tog span{width:16px;height:16px;border-radius:50%;background:var(--muted);transition:.15s}
.tog.on{background:var(--green-s);border-color:var(--green);color:var(--green)}
.tog.on span{background:var(--green)}
.notifs div{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.totbox{display:flex;justify-content:space-between;gap:10px;background:var(--bg);border-radius:10px;padding:12px}
.tot{font-size:20px;font-weight:700}
.ftbl td,.ftbl th{padding:5px 6px}
.ftbl input,.ftbl select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:6px 8px}
.pbar{position:sticky;bottom:0;display:flex;justify-content:flex-end;gap:8px;padding:12px 0;margin-top:14px;background:linear-gradient(transparent,var(--bg) 30%)}
.aviso{background:var(--brand-soft);color:var(--text);border-radius:10px;padding:10px 14px;margin-bottom:14px}
.asegtbl{border:1px solid var(--line);border-radius:8px;max-height:320px;overflow:auto;margin-bottom:4px}
.asegtbl input[type=number]{width:100%}
.asegbox{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px 12px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--bg);margin-bottom:4px}
.hist{border-bottom:1px solid var(--line);padding:10px 0}
@media (max-width:1100px){.pgrid{grid-template-columns:1fr}}
.form .form-sec:first-child{margin-top:0;padding-top:0}
.form input,.form select,.form textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;font-size:14px}
.bdays li{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line)}
.bdays{list-style:none;margin:0;padding:0}
.detail h4{margin:16px 0 6px;font-size:13px;color:var(--muted);text-transform:uppercase}
.kv{display:grid;grid-template-columns:140px 1fr;gap:4px 12px}
.kv span:nth-child(odd){color:var(--muted)}
.soonbox{text-align:center;padding:60px 20px;color:var(--muted)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--panel);padding:10px 16px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.row2,.row3{grid-template-columns:1fr 1fr}.row2>.card:first-child,.row3>.card:last-child{grid-column:1/-1}}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;z-index:20;width:250px;left:-260px;transition:.2s;box-shadow:0 0 30px rgba(0,0,0,.2)}
  aside.open{left:0}
  .menu-btn{display:inline-block}
  main{padding:16px}
  .kpis,.row2,.row3{grid-template-columns:1fr}
  .form{grid-template-columns:1fr}
}

/* ===== identidad CorrePlus: verde petróleo + ámbar, menú oscuro, tarjetas suaves ===== */
:root{
  --bg:#f4f6f5; --panel:#ffffff; --text:#14262b; --muted:#66777b; --line:#e3e9e7;
  --brand:#005a60; --brand-2:#00464b; --brand-soft:#e0f3f4; --accent:#00b9c5; --accent-s:#e2f7f9;
  --blue:#2d6fd6; --blue-s:#e6effc; --amber:#c98a07; --amber-s:#fdf3dc;
  --green:#178a55; --green-s:#e0f4e9; --red:#d2405a; --red-s:#fce7eb;
  --teal:#00a3ae; --teal-s:#def6f8; --orange:#e2672f; --orange-s:#fde9df;
  --shadow:0 1px 2px rgba(16,40,38,.05),0 6px 18px rgba(16,40,38,.06);
  --side:#00474c; --side-2:#005a60; --side-text:#dcefef; --side-muted:#92c3c6;
}
body{font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;letter-spacing:-.005em}
/* menú lateral oscuro */
aside{background:linear-gradient(180deg,var(--side),var(--side-2));border-right:0;color:var(--side-text)}
.hamb{color:var(--side-muted)} .hamb:hover{background:rgba(255,255,255,.08)}
.logo{color:#fff;font-size:19px;letter-spacing:-.2px;font-weight:800;display:flex;align-items:center;gap:10px}
.logo img{height:44px;width:auto;display:block}
.app.mini .sidetop{flex-direction:column;gap:8px}
.logo-mini{display:none;height:30px;width:auto}
.app.mini .logo-mini{display:block}
.logo small{color:var(--side-muted);font-weight:500;font-size:10.5px;letter-spacing:.2px}
nav button{text-transform:none;font-size:13.5px;font-weight:500;letter-spacing:0;color:var(--side-text);border-radius:10px;padding:5px 8px}
nav button:hover{background:rgba(255,255,255,.07);box-shadow:none}
nav .nico{background:rgba(255,255,255,.06);border:0;color:var(--side-text);width:32px;height:32px;border-radius:9px}
nav button.on,nav button.open{background:rgba(255,255,255,.1);color:#fff;font-weight:600}
nav button.on .nico{background:var(--accent);color:#fff}
nav button.open .nico{background:rgba(255,255,255,.14);color:#fff}
nav .chev,nav button.open .chev{color:var(--side-muted)}
nav .subnav{border-left-color:rgba(255,255,255,.14)}
nav .subnav button{color:var(--side-muted)}
nav .subnav button::before{border-top-color:rgba(255,255,255,.14)}
nav .subnav button:hover{background:rgba(255,255,255,.06)}
nav .subnav button.on{color:#fff;background:none}
nav .subnav button.on::before{border-color:var(--accent)}
nav hr{border-top-color:rgba(255,255,255,.1)}
nav .soon{color:var(--side-muted);border-color:rgba(255,255,255,.16)}
.app.mini .logo{display:none}
/* cabecera */
main{padding:0 28px 28px}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);margin:0 -28px 18px;padding:16px 28px;border-bottom:1px solid var(--line)}
.top h1{font-size:21px;font-weight:800;letter-spacing:-.4px}
/* botones */
.btn{border-radius:10px;font-weight:600;padding:7px 13px;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-2);border-color:var(--brand-2);color:#fff}
.btn.danger:hover{border-color:var(--red);color:var(--red)}
.btn.sm{border-radius:8px}
/* tarjetas y KPI */
.card{border:0;border-radius:16px;box-shadow:var(--shadow)}
.card h3{font-weight:700;letter-spacing:-.2px}
.kpi{position:relative;overflow:hidden;transition:transform .15s}
.kpi:hover{transform:translateY(-2px)}
.kpi .val{font-weight:800;letter-spacing:-.5px;font-size:clamp(17px,1.35vw,24px);white-space:nowrap}
.kpi{padding:14px;gap:12px}
.ico{border-radius:12px}
.kpis3>div{border-radius:12px;background:var(--bg);border-left:3px solid var(--line)}
.kpis3>div:nth-child(1){border-left-color:var(--brand)} .kpis3>div:nth-child(2){border-left-color:var(--green)}
.kpis3>div:nth-child(3){border-left-color:var(--amber)} .kpis3>div:nth-child(4){border-left-color:var(--accent)}
/* tablas */
.toolbar input,.toolbar select{border-radius:10px;background:var(--bg);border-color:transparent}
.toolbar input:focus,.toolbar select:focus,.form input:focus,.form select:focus,.form textarea:focus{outline:2px solid var(--brand-soft);border-color:var(--brand)}
th{background:var(--bg);text-transform:none;font-size:12px;letter-spacing:0;color:var(--muted);font-weight:700;border-bottom:0}
th:first-child{border-radius:10px 0 0 10px} th:last-child{border-radius:0 10px 10px 0}
tr:hover td{background:#f8fbfa}
.pill{border-radius:7px;font-weight:700;font-size:11.5px;padding:3px 8px}
.link{color:var(--brand);font-weight:600}
/* formularios, pestañas y ventanas */
.form input,.form select,.form textarea{border-radius:10px}
.ptabs{border-bottom:0;gap:6px;background:var(--panel);padding:5px;border-radius:12px;box-shadow:var(--shadow);width:max-content;max-width:100%}
.ptabs button{border:0;border-radius:9px;padding:8px 14px;font-weight:600}
.ptabs button.on{background:var(--brand);color:#fff;border:0}
dialog{border-radius:18px}
.dlg-h{border-bottom:0;padding-bottom:6px}
.dlg-f{border-top:0;background:var(--bg);border-radius:0 0 18px 18px}
.aviso{background:var(--accent-s);border-left:3px solid var(--accent)}
.toast{background:var(--side);color:#fff;border-radius:10px}
</style>
</head>

);if(!d||d.v!==2)return;\n    if(d.fields){FIELD_IDS.forEach(function(id){if(d.fields[id]!==undefined&&g(id))g(id).value=d.fields[id];});if(g(\"firmas\"))g(\"firmas\").checked=!!d.fields.firmas;}\n    if(Array.isArray(d.insurers)&&d.insurers.length){for(var i=0;i<5;i++){if(d.insurers[i])insurers[i]=normIns(d.insurers[i]);}}\n    if(d.insCount>=2&&d.insCount<=5)insCount=d.insCount;\n    if(Array.isArray(d.terceros))d.terceros.forEach(function(v,i){if(terceros[i]&&v!==undefined)terceros[i].value=v;});\n    if(Array.isArray(d.propios))d.propios.forEach(function(v,i){if(propios[i]&&v!==undefined)propios[i].value=v;});\n    if(Array.isArray(d.services))d.services.forEach(function(v,i){if(services[i]&&v!==undefined)services[i].value=v;});\n  }catch(e){}\n}\nfunction nuevaCotizacion(){\n  if(!confirm(\"¿Empezar una cotización nueva? Se borran cliente, vehículo, primas y ajustes por aseguradora. Se conservan las aseguradoras elegidas.\"))return;\n  g(\"cliente\").value=\"\";g(\"vehiculo\").value=\"\";g(\"valorV\").value=\"\";\n  insurers.forEach(function(ins){ins.prima=\"\";ins.rec=false;ins.ded=\"\";ins.terc={};ins.ov={};});\n  buildAll();render();showTab(\"form\");\n}\n\n/* ===== Lista de aseguradoras (editable, guardada en el navegador) ===== */\nvar DEFAULT_ASEG=['LA COLONIAL','HUMANO','SURA','UNIVERSAL','RESERVAS','MAPFRE','ATLANTICA','UNIT','LA INTERNACIONAL','LA MONUMENTAL','DOMINICANA','ONE ALLIANCE','MULTISEGUROS','PATRIA','MIDAS','APS'];\nvar asegList=DEFAULT_ASEG.slice();\ntry{var _s=localStorage.getItem('correbon_full_aseguradoras');if(_s){var _p=JSON.parse(_s);if(Array.isArray(_p)&&_p.length)asegList=_p;}}catch(e){}\nfunction saveAsegList(){try{localStorage.setItem('correbon_full_aseguradoras',JSON.stringify(asegList));}catch(e){}}\nfunction openInsModal(){renderAsegList();document.getElementById('ins-modal').classList.add('open');}\nfunction closeInsModal(){document.getElementById('ins-modal').classList.remove('open');buildInsurers();render();}\nfunction renderAsegList(){\n  var d=document.getElementById('aseg-list');d.innerHTML='';\n  if(!asegList.length){d.innerHTML='<div class=\"aseg-empty\">No hay aseguradoras en la lista. Agrega una arriba.<\/div>';return;}\n  var h='';\n  asegList.forEach(function(n,i){\n    h+='<div class=\"aseg-row\"><span>'+esc(n)+'<\/span><button onclick=\"delAseg('+i+')\" title=\"Quitar de la lista\">&#10007; Quitar<\/button><\/div>';\n  });\n  d.innerHTML=h;\n}\nfunction addAseg(){\n  var inp=document.getElementById('new-aseg');\n  var v=(inp.value||'').trim().toUpperCase();\n  if(!v)return;\n  if(asegList.indexOf(v)>=0){alert('Esa aseguradora ya está en la lista.');return;}\n  asegList.push(v);saveAsegList();inp.value='';renderAsegList();\n}\nfunction delAseg(i){\n  if(!confirm('¿Quitar \"'+asegList[i]+'\" de la lista desplegable?'))return;\n  asegList.splice(i,1);saveAsegList();renderAsegList();\n}\n\n/* ===== Visibilidad de coberturas (guardada en el navegador) ===== */\nvar covVis={};\ntry{var _v=localStorage.getItem('correbon_full_covvis');if(_v)covVis=JSON.parse(_v)||{};}catch(e){}\nfunction isVis(label){return covVis[label]!==false;}\nvar visLabels=[];\nfunction toggleVis(idx,checked){\n  covVis[visLabels[idx]]=checked;\n  try{localStorage.setItem('correbon_full_covvis',JSON.stringify(covVis));}catch(e){}\n  buildVisForm();render();\n}\nfunction buildVisForm(){\n  var d=document.getElementById('vis-form');if(!d)return;\n  var groups=[\n    {title:'Coberturas a Terceros',items:terceros.map(function(c){return c.label;})},\n    {title:'Daños Propios',items:propios.map(function(c){return c.label;}).concat(propiosBools.map(function(f){return f.label;}))},\n    {title:'Servicios Adicionales',items:services.map(function(c){return c.label;}).concat(svcBools.map(function(f){return f.label;}))}\n  ];\n  visLabels=[];var h='';\n  groups.forEach(function(gp){\n    h+='<div class=\"vis-group\"><div class=\"vis-title\">'+gp.title+'<\/div><div class=\"vis-grid\">';\n    gp.items.forEach(function(lb){\n      var idx=visLabels.length;visLabels.push(lb);\n      h+='<label class=\"vis-row'+(isVis(lb)?'':' off')+'\"><input type=\"checkbox\" '+(isVis(lb)?'checked':'')+' onchange=\"toggleVis('+idx+',this.checked)\"><span>'+lb+'<\/span><\/label>';\n    });\n    h+='<\/div><\/div>';\n  });\n  d.innerHTML=h;\n}\n\n/* ===== utilidades ===== */\nfunction g(id){return document.getElementById(id);}\nfunction esc(s){return String(s==null?\"\":s).replace(/&/g,\"&amp;\").replace(/<\/g,\"&lt;\").replace(/>/g,\"&gt;\").replace(/\"/g,\"&quot;\").replace(/'/g,\"&#39;\");}\nfunction num(v){var n=parseFloat(String(v==null?\"\":v).replace(/,/g,\"\"));return isNaN(n)?NaN:n;}\nfunction fmtI(v){var n=num(v);if(isNaN(n))return esc(v);return n.toLocaleString(\"es-DO\",{minimumFractionDigits:0,maximumFractionDigits:0});}\nfunction fmtD(v){var n=num(v);if(isNaN(n))return esc(v);return n.toLocaleString(\"es-DO\",{minimumFractionDigits:2,maximumFractionDigits:2});}\nfunction isNum(v){var c=String(v).replace(/,/g,\"\").replace(/[.]/g,\"\").trim();return !isNaN(parseFloat(c))&&c!==\"\";}\nfunction isNI(v){return !v||String(v).toLowerCase().indexOf(\"no incluid\")>=0||v===\"-\";}\nfunction today(){return new Date().toLocaleDateString(\"es-DO\",{day:\"2-digit\",month:\"long\",year:\"numeric\"});}\nfunction chk(v){return v===\"Si\"?'<td class=\"inc\" style=\"font-size:16px;color:#1a9a6a;\">&#10004;<\/td>':'<td class=\"ni\" style=\"font-size:16px;color:#e05050;\">&#10007;<\/td>';}\nfunction sel(cur,val,lbl){return '<option value=\"'+esc(val)+'\"'+(cur===val?' selected':'')+'>'+lbl+'<\/option>';}\nfunction curMoneda(){return g(\"moneda\").value;}\nfunction primaOk(ins){var n=num(ins.prima);return !isNaN(n)&&n>0;}\n\n/* valor de una cobertura para una aseguradora: su ajuste propio o el general */\nfunction tercVal(ins,cov){var o=ins.terc[cov.label];return (o!==undefined&&String(o).trim()!==\"\")?o:cov.value;}\nfunction ovVal(ins,cov){var o=ins.ov[cov.label];return (o===\"Incluido\"||o===\"No Incluido\")?o:cov.value;}\nfunction dedFor(ins,valorV,globalPct,minDed){\n  var pct=(ins.ded===\"\"||ins.ded==null)?globalPct:parseFloat(ins.ded);\n  if(isNaN(pct))pct=globalPct;\n  var raw=valorV*pct/100;\n  var calc=pct>0?Math.max(raw,minDed):0;\n  return {pct:pct,calc:calc,isMin:pct>0&&raw<minDed};\n}\n\n/* acciones de las tarjetas */\nfunction setTerc(i,ci,v){insurers[i].terc[terceros[ci].label]=v;render();}\nfunction setOv(i,grp,ci,v){var arr=grp===\"p\"?propios:services;var lb=arr[ci].label;if(v===\"\")delete insurers[i].ov[lb];else insurers[i].ov[lb]=v;render();}\nfunction setRec(i,checked){insurers.forEach(function(ins,k){ins.rec=(k===i)?checked:false;});buildInsurers();render();}\nfunction countAdj(ins){\n  var n=0;terceros.forEach(function(c){var o=ins.terc[c.label];if(o!==undefined&&String(o).trim()!==\"\")n++;});\n  n+=Object.keys(ins.ov).length;if(ins.ded!==\"\")n++;return n;\n}\n\nfunction applyCobertura(val){\n  var p=PRL[val];if(!p)return;\n  terceros.forEach(function(c){if(p[c.label]!==undefined)c.value=p[c.label];});\n  buildCovForm(\"terc-form\",terceros,\"terceros\");buildInsurers();render();\n}\nfunction buildInsurers(){\n  var d=g(\"ins-form\");d.className=\"ins-grid ig\"+insCount;\n  var mon=curMoneda();var gp=g(\"dedPct\").value;\n  var h='';\n  insurers.slice(0,insCount).forEach(function(ins,i){\n    var bools=\"\";\n    propiosBools.forEach(function(f){\n      bools+='<div class=\"bool-row\"><label>'+f.label+'<\/label>'+\n        '<select onchange=\"insurers['+i+'].pi.'+f.key+'=this.value;render()\">'+sel(ins.pi[f.key],\"Si\",\"&#10004; Sí\")+sel(ins.pi[f.key],\"No\",\"&#10007; No\")+'<\/select><\/div>';\n    });\n    svcBools.forEach(function(f){\n      if(f.type===\"renta\"){\n        bools+='<div class=\"bool-row\"><label>Renta (días)<\/label><input type=\"number\" value=\"'+esc(ins.pi.renta)+'\" min=\"0\" oninput=\"insurers['+i+'].pi.renta=this.value;render()\"><\/div>';\n      } else {\n        bools+='<div class=\"bool-row\"><label>'+f.label+' label>Aseguradora<\/label><select onchange=\"insurers['+i+'].name=this.value;render()\">'+asegOpts+'<\/select><\/div>'+\n      '<div class=\"field\"><label>Prima Anual<\/label><input type=\"number\" value=\"'+esc(ins.prima)+'\" step=\"0.01\" placeholder=\"Vacío = No cotizó\" oninput=\"insurers['+i+'].prima=this.value;render()\"><\/div>'+\n      '<div class=\"field\"><label>Autoexceso<\/label><select onchange=\"insurers['+i+'].autoexceso=this.value;render()\">'+\n        aeOpts.map(function(v){return '<option value=\"'+esc(v)+'\"'+(String(ins.autoexceso)===v?' selected':'')+'>'+mon+' '+fmtI(v)+'<\/option>';}).join('')+\n        '<\/select><\/div>'+\n      '<div class=\"field\"><label>Deducible<\/label><select onchange=\"insurers['+i+'].ded=this.value;buildInsurers();render()\">'+\n        sel(String(ins.ded),\"\",\"General (\"+gp+\"%)\")+['0','0.5','1','2','3','4','5'].map(function(v){return sel(String(ins.ded),v,v+'%');}).join('')+\n        '<\/select><\/div>'+\n      '<label class=\"rec-check\"><input type=\"checkbox\" '+(ins.rec?'checked':'')+' onchange=\"setRec('+i+',this.checked)\"> Marcar como recomendada<\/label>'+\n      '<div class=\"bool-sec\"><div class=\"bool-sec-title\">Coberturas individuales<\/div>'+bools+'<\/div>'+\n      '<details class=\"adj\"'+(nAdj?' open':'')+'><summary>Coberturas distintas a la general'+(nAdj?' <b>('+nAdj+')<\/b>':'')+'<\/summary>'+\n        '<p class=\"adj-hint\">Déjalo vacío para usar el valor general.<\/p>'+adj+'<\/details>'+\n      '<\/div><\/div>';\n  });\n  d.innerHTML=h;\n}\nfunction buildCovForm(divId,arr,arrName){\n  var d=g(divId);if(!d)return;var h=\"\";\n  arr.forEach(function(cov,ci){\n    h+='<div class=\"cov-label\">'+cov.label+'<\/div>';\n    if(cov.useValor){\n      h+='<input type=\"text\" readonly value=\"= Valor vehículo\">';\n    } else if(cov.dropdown){\n      h+='<select onchange=\"'+arrName+'['+ci+'].value=this.value;buildInsurers();render()\">'+sel(cov.value,\"Incluido\",\"Incluido\")+sel(cov.value,\"No  value=\"Volkswagen Jetta 1999\">\n<\/div>\n\n<div class=\"field\">\n<label>Cobertura<\/label>\n<select id=\"cobertura\" onchange=\"applyCoverageConfig(this.value)\">\n<option value=\"LEY 100/100/200\">LEY 100/100/200<\/option>\n<option value=\"LEY 200/200/400\">LEY 200/200/400<\/option>\n<option value=\"LEY 500/500/1000\">LEY 500/500/1000<\/option>\n<option value=\"LEY 1000/1000/2000\">LEY 1000/1000/2000<\/option>\n<\/select>\n<\/div>\n\n<div class=\"field\">\n<label>Moneda<\/label>\n<select id=\"moneda\">\n<option>RD$<\/option>\n<option>US$<\/option>\n<\/select>\n<\/div>\n\n<\/div>\n\n<\/div>\n\n<\/div>\n\n\n<\u0021-- SERVICIOS GENERALES -->\n\n<div class=\"card\">\n\n<div class=\"card-head\">\nSERVICIOS ADICIONALES\n<\/div>\n\n<div class=\"card-body\">\n\n<div class=\"grid g4\">\n\n<div class=\"field\">\n<label>Asistencia Vial y Grúa<\/label>\n<select id=\"asistenciaGeneral\">\n<option value=\"No Incluido\">No Incluido<\/option>\n<option value=\"Incluido\">Incluido<\/option>\n<\/select>\n<\/div>\n\n<div class=\"field\">\n<label>Casa del Conductor o Automovilista<\/label>\n<select id=\"casaGeneral\">\n<option value=\"No Incluido\">No Incluido<\/option>\n<option value=\"Incluido\">Incluido<\/option>\n<\/select>\n<\/div>\n\n<\/div>\n\n<\/div>\n\n<\/div>\n\n<\u0021-- ASEGURADORAS -->\n\n\n<div class=\"card\">\n\n<div class=\"card-head\">\nASEGURADORAS (2 A 5)\n<\/div>\n\n<div class=\"card-body\">\n\n<div class=\"counts\">\n\n<button class=\"count-btn active\" onclick=\"setCount(2,this)\">2<\/button>\n<button class=\"count-btn\" onclick=\"setCount(3,this)\">3<\/button>\n<button class=\"count-btn\" onclick=\"setCount(4,this)\">4<\/button>\n<button class=\"count-btn\" onclick=\"setCount(5,this)\">5<\/button>\n\n<\/div>\n\n<div class=\"ins-grid\" id=\"insurers\"><\/div>\n\n<\/div>\n\n<\/div>\n\n<\/div>\n\n<\/div>\n\n<\u0021-- PREVIEW -->\n\n<div id=\"previewPage\" class=\"page\">\n\n<div class=\"preview-page\">\n\n<div class=\"pdf\">\n\n<div class=\"pdf-header\">\n\n<img src=\"data:image/png;base64,@@IMG0@@\" class=\"logo\">\n\n<div class=\"header-right\">\n\n<strong>RNC: 133-421003<\/strong><br>\n\nAve. de las Hortensias No. 24, Bonao<br>\n\n(809) 296-6500 | (829) 342-0055<br>\n\ninfo@correplus.com.do\n\n<\/div>\n\n<\/div>\n\n<div class=\"band\">\n\n<div>\nCOMPARADOR DE SEGUROS\n<\/div>\n\n<div>\nAsesor: JOELY GARCIA\n<\/div>\n\n<\/div>\n\n<div class=\"client-bar\">\n\n<div class=\"client-item\">\n<div class=\"lbl\">Cliente<\/div>\n<div class=\"val\" id=\"pvCliente\">PROSPECTO<\/div>\n<\/div>\n\n<div class=\"client-item\">\n<div class=\"lbl\">Coberturas<\/div>\n<div class=\"val\" id=\"pvCobertura\">Ley Ultra<\/div>\n<\/div>\n\n<div class=\"client-item\">\n<div class=\"lbl\">Vehículo<\/div>\n<div class=\"val\" id=\"pvVehiculo\">Volkswagen Jetta 1999<\/div>\n<\/div>\n\n<div class=\"client-item\">\n<div class=\"lbl\">Moneda<\/div>\n<div class=\"val\" id=\"pvMoneda\">RD$<\/div>\n<\/div>\n\n<\/div>\n\n<table>\n\n<thead>\n\n<tr id=\"headers\">\n\n<th>ASEGURADORAS<\/th>\n\n<\/tr>\n\n<\/thead>\n\n<tbody id=\"tbody\"><\/tbody>\n\n<\/table>\n\n<div class=\"footer\">\n\n<div>\n\n📅 Fecha: <span id=\"fechaCotizacion\">24 de mayo de 2026<\/span><br>\n\n<strong>\nCotización válida por 30 días a partir de la fecha de cotización.\n<\/strong>\n\n<\/div>\n\n<div class=\"footer-right\">\n\n<strong>JOELY GARCIA<\/strong><br>\n\nAsesor de Seguros - CORREPLUS<br>\n\n(829) 342-0055 | jgarcia@correplus.com.do\n\n<\/div>\n\n<\/div>\n\n<\/div>\n\n<\/div>\n\n<\/div>\n\n<script>\n\nfunction showTab(id,btn){\n\ndocument.querySelectorAll('.page')\n.forEach(p=>p.classList.remove('active'));\n\ndocument.getElementById(id)\n.classList.add('active');\n\ndocument.querySelectorAll('.tab-btn')\n.forEach(b=>b.classList.remove('active'));\n\nbtn.classList.add('active');\n\n}\n\n\nconst insurerOptions = [\n\"LA COLONIAL\",\n\"HUMANO\",\n\"SURA\",\n\"UNIVERSAL\",\n\"MAPFRE\",\n\"UNIT\",\n\"RESERVAS\",\n\"ATLANTICA\",\n\"LA MONUMENTAL\",\n\"LA INTERNACIONAL\",\n\"DOMINICANA\",\n\"ONE ALLIANCE\",\n\"PATRIA\",\n\"MULTISEGUROS\",\n\"MIDAS\",\n\"APS\"\n];\n\nlet insurersCount = 5;\n\nconst insurers = [\n\n{name:\"LA COLONIAL\",price:\"47,508.36\",autoExceso:\"No Incluido\",riesgo:\"50,000\",asistencia:\"Incluido\",casa:\"Incluido\"},\n{name:\"HUMANO\",price:\"38,280.00\",autoExceso:\"3,000,000\",riesgo:\"50,000\",asistencia:\"Incluido\",casa:\"No Incluido\"},\n{name:\"ATLANTICA\",price:\"61,863.24\",autoExceso:\"5,000,000\",riesgo:\"100,000\",asistencia:\"Incluido\",casa:\"Incluido\"},\n{name:\"MONUMENTAL\",price:\"43,987.20\",autoExceso:\"10,000,000\",riesgo:\"150,000\",asistencia:\"No Incluido\",casa:\"No Incluido\"},\n{name:\"ASEGURADORA 5\",price:\"0.00\",autoExceso:\"0\",riesgo:\"15,000\",asistencia:\"No Incluido\",casa:\"No Incluido\"}\n\n];\n\nfunction setCount(num,btn){\n\ndocument\n.querySelectorAll('.count-btn')\n.forEach(b=>b.classList.remove('active'));\n\nbtn.classList.add('active');\n\ninsurersCount = num;\n\nrender();\n\n}\n\n\nconst coverageConfigs = {\n\n\"LEY 100/100/200\":{\ndpa:\"RD$ 100,000\",\nlm1:\"RD$ 100,000\",\nlm2:\"RD$ 200,000\",\nrc1:\"RD$ 100,000\",\nrc2:\"RD$ 200,000\",\nfianza:\"RD$ 300,000\"\n},\n\n\"LEY 200/200/400\":{\ndpa:\"RD$ 200,000\",\nlm1:\"RD$ 200,000\",\nlm2:\"RD$ 400,000\",\nrc1:\"RD$ 200,000\",\nrc2:\"RD$ 400,000\",\nfianza:\"RD$ 500,000\"\n},\n\n\"LEY 500/500/1000\":{\ndpa:\"RD$ 500,000\",\nlm1:\"RD$ 500,000\",\nlm2:\"RD$ 1,000,000\",\nrc1:\"RD$ 500,000\",\nrc2:\"RD$ 1,000,000\",\nfianza:\"RD$ 1,000,000\"\n},\n\n\"LEY 1000/1000/2000\":{\ndpa:\"RD$ 1,000,000\",\nlm1:\"RD$ 1,000,000\",\nlm2:\"RD$ 2,000,000\",\nrc1:\"RD$ 1,000,000\",\nrc2:\"RD$ 2,000,000\",\nfianza:\"RD$ 1,000,000\"\n}\n\n};\n\nlet currentCoverage =\ncoverageConfigs[\"LEY 100/100/200\"];\n\nfunction applyCoverageConfig(type){\n\ncurrentCoverage =\ncoverageConfigs[type];\n\nrender();\n\n}\n\n\nfunction render(){\n\nconst insDiv =\ndocument.getElementById('insurers');\n\ninsDiv.innerHTML='';\n\nfor(let i=0;i<insurersCount;i++){\n\ninsDiv.innerHTML += `\n\n<div class=\"ins-card\">\n\n<div class=\"ins-head\">\nPROPUESTA ${i+1}\n<\/div>\n\n<div class=\"ins-body\">\n\n<div class=\"field\">\n\n<label>Aseguradora<\/label>\n\n<select onchange=\"updateName(${i},this.value)\">\n\n${insurerOptions.map(name => `\n<option value=\"${name}\" ${insurers[i].name===name ? \"selected\" : \"\"}>\n${name}\n<\/option>\n`).join('')}\n\n<\/select>\n\n<\/div>\n\n<div class=\"field\">\n\n<label>Prima Anual<\/label>\n\n<input value=\"${insurers[i].price}\"\noninput=\"updatePrice(${i},this.value)\">\n\n<\/div>\n\n<div class=\"field\">\n\n<label>Auto Exceso<\/label>\n\n<select onchange=\"updateAutoExceso(${i},this.value)\">\n\n<option value=\"No Incluido\" ${insurers[i].autoExceso===\"No Incluido\"?\"selected\":\"\"}>No Incluido<\/option>\n<option value=\"0\" ${insurers[i].autoExceso===\"0\"?\"selected\":\"\"}>0<\/option>\n<option value=\"3,000,000\" ${insurers[i].autoExceso===\"3,000,000\"?\"selected\":\"\"}>3,000,000<\/option>\n<option value=\"5,000,000\" ${insurers[i].autoExceso===\"5,000,000\"?\"selected\":\"\"}>5,000,000<\/option>\n<option value=\"10,000,000\" ${insurers[i].autoExceso===\"10,000,000\"?\"selected\":\"\"}>10,000,000<\/option>\n\n<\/select>\n\n<\/div>\n\n<div class=\"field\">\n\n<label>Riesgo Conductor<\/label>\n\n<select onchange=\"updateRiesgo(${i},this.value)\">\n\n<option value=\"15,000\" ${insurers[i].riesgo===\"15,000\"?\"selected\":\"\"}>15,000<\/option>\n<option value=\"50,000\" ${insurers[i].riesgo===\"50,000\"?\"selected\":\"\"}>50,000<\/option>\n<option value=\"100,000\" ${insurers[i].riesgo===\"100,000\"?\"selected\":\"\"}>100,000<\/option>\n<option value=\"150,000\" ${insurers[i].riesgo===\"150,000\"?\"selected\":\"\"}>150,000<\/option>\n\n<\/select>\n\n<\/div>\n\n<\/div>\n\n<\/div>\n\n`;\n\n}\n\nconst headers =\ndocument.getElementById('headers');\n\nheaders.innerHTML = `\n<th><div class=\"insurer-name\">ASEGURADORAS<\/div><div class=\"header-price-label\">PRIMA ANUAL<\/div><\/th>\n`;\n\nfor(let i=0;i<insurersCount;i++){\n\nheaders.innerHTML += `\n\n<th>\n\n<div class=\"insurer-name\">${insurers[i].name}<\/div>\n\n<div class=\"header-price proposal-price\">RD$ ${insurers[i].price}<\/div>\n\n<\/th>\n\n`;\n\n}\n\nconst tbody =\ndocument.getElementById('tbody');\n\ntbody.innerHTML='';\n\n/* COBERTURAS */\n\ntbody.innerHTML += `\n\n<tr class=\"sec\">\n\n<td colspan=\"${insurersCount+1}\">\nCOBERTURAS A TERCEROS\n<\/td>\n\n<\/tr>\n\n`;\n\nconst coverages = [\n\n[\"Daños a la Propiedad Ajena\",currentCoverage.dpa],\n[\"Lesiones o Muerte a Una Persona\",currentCoverage.lm1],\n[\"Lesiones o Muerte a Más de Una Persona\",currentCoverage.lm2],\n[\"Resp. Civil Un Pasajero\",currentCoverage.rc1],\n[\"Resp. Civil Más de Un Pasajero\",currentCoverage.rc2],\n[\"Fianza Judicial al Conductor\",currentCoverage.fianza]\n\n];\n\ncoverages.forEach(r=>{\n\ntbody.innerHTML += `\n\n<tr>\n\n<td class=\"rl\">\n${r[0]}\n<\/td>\n\n${Array.from({length:insurersCount})\n.map(()=>`\n\n<td>\n${r[1]}\n<\/td>\n\n`).join('')}\n\n<\/tr>\n\n`;\n\n});\n\n/* RIESGO */\n\ntbody.innerHTML += `\n\n<tr>\n\n<td class=\"rl\">\nRiesgo Conductor\n<\/td>\n\n${Array.from({length:insurersCount})\n.map((_,i)=>`\n\n<td>\n${insurers[i].riesgo}\n<\/td>\n\n`).join('')}\n\n<\/tr>\n\n`;\n\n/* AUTO EXCESO */\n\ntbody.innerHTML += `\n\n<tr>\n\n<td class=\"rl\">\nAuto Exceso\n<\/td>\n\n${Array.from({length:insurersCount})\n.map((_,i)=>`\n\n<td>\n${insurers[i].autoExceso}\n<\/td>\n\n`).join('')}\n\n<\/tr>\n\n`;\n\n/* ADICIONALES */\n\ntbody.innerHTML += `\n\n<tr class=\"sec\">\n\n<td colspan=\"${insurersCount+1}\">\nSERVICIOS ADICIONALES\n<\/td>\n\n<\/tr>\n\n`;\n\ntbody.innerHTML += `\n\n<tr>\n\n<td class=\"rl\">\nAsistencia Vial y Grúa\n<\/td>\n\n${Array.from({length:insurersCount})\n.map(()=>`\n\n<td>\n${document.getElementById('asistenciaGeneral').value}\n<\/td>\n\n`).join('')}\n\n<\/tr>\n\n`;\n\ntbody.innerHTML += `\n\n<tr>\n\n<td class=\"rl\">\nCasa del Conductor o Automovilista\n<\/td>\n\n${Array.from({length:insurersCount})\n.map(()=>`\n\n<td>\n${document.getElementById('casaGeneral').value}\n<\/td>\n\n`).join('')}\n\n<\/tr>\n\n`;\n\n}\n\nfunction updateName(i,v){\n\ninsurers[i].name=v;\n\nrender();\n\n}\n\n\nfunction savePrice(i,input){\n\nlet raw = input.value\n.replace(/,/g,'')\n.replace(/[^0-9.]/g,'');\n\nif(raw === ''){\nraw = '0';\n}\n\nlet number = parseFloat(raw);\n\nif(isNaN(number)){\nnumber = 0;\n}\n\nlet formatted = number.toLocaleString('en-US',{\nminimumFractionDigits:2,\nmaximumFractionDigits:2\n});\n\n/* actualizar solo el input */\ninput.value = formatted;\n\n/* guardar sin perder foco mientras escribe */\ninsurers[i].price = formatted;\n\n/* actualizar pdf/tabla */\nrender();\n\n}\n\n\n\n\nfunction formatCurrencyWhileTyping(value){\n\nvalue = String(value || '');\n\nvalue = value.replace(/,/g,'');\n\nif(value === '') return '';\n\nif(!value.includes('.')){\n\nlet clean = value.replace(/\\D/g,'');\n\nif(clean === '') return '';\n\nreturn Number(clean).toLocaleString('en-US');\n\n}\n\nlet parts = value.split('.');\n\nlet integerPart = parts[0].replace(/\\D/g,'');\nlet decimalPart = (parts[1] || '').replace(/\\D/g,'');\n\nintegerPart = integerPart === '' ? '0' : Number(integerPart).toLocaleString('en-US');\n\ndecimalPart = decimalPart.substring(0,2);\n\nreturn integerPart + '.' + decimalPart;\n\n}\n\nfunction updatePrice(i,v){\n\nconst input = document.activeElement;\n\nlet rawCursor = input.selectionStart || 0;\n\nlet oldValue = input.value;\n\nlet formatted = formatCurrencyWhileTyping(v);\n\ninsurers[i].price = formatted;\n\ninput.value = formatted;\n\nlet diff = formatted.length - oldValue.length;\n\nlet newCursor = rawCursor + diff;\n\nif(newCursor < 0){\nnewCursor = 0;\n}\n\nif(newCursor > formatted.length){\nnewCursor = formatted.length;\n}\n\nrequestAnimationFrame(()=>{\ninput.setSelectionRange(newCursor,newCursor);\n});\n\nrenderPreviewOnly();\n\n}\n\nfunction finalizePrice(input,i){\n\nlet value = input.value.replace(/,/g,'');\n\nif(value === ''){\ninput.value = '';\ninsurers[i].price = '';\nrenderPreviewOnly();\nreturn;\n}\n\nif(!value.includes('.')){\nvalue += '.00';\n}else{\n\nlet parts = value.split('.');\n\nlet integerPart = parts[0];\nlet decimalPart = parts[1] || '';\n\ndecimalPart = decimalPart.substring(0,2);\n\nif(decimalPart.length === 0){\ndecimalPart = '00';\n}\n\nif(decimalPart.length === 1){\ndecimalPart += '0';\n}\n\nvalue = integerPart + '.' + decimalPart;\n}\n\nlet parts = value.split('.');\n\nparts[0] = Number(parts[0]).toLocaleString('en-US');\n\ninput.value = parts[0] + '.' + parts[1];\n\ninsurers[i].price = input.value;\n\nrenderPreviewOnly();\n\n}\n\n\nfunction renderPreviewOnly(){\n\ndocument.getElementById('pvCliente').innerText =\ndocument.getElementById('cliente').value;\n\ndocument.getElementById('pvVehiculo').innerText =\ndocument.getElementById('vehiculo').value;\n\ndocument.getElementById('pvCobertura').innerText =\ndocument.getElementById('cobertura').value;\n\ndocument.getElementById('pvMoneda').innerText =\ndocument.getElementById('moneda').value;\n\nconst prices = document.querySelectorAll('.proposal-price');\n\nprices.forEach((el,index)=>{\n\nif(insurers[index]){\n\nlet moneda =\ndocument.getElementById('moneda').value || 'RD$';\n\nlet precio = insurers[index].price || '0';\n\nif(!precio.includes('.')){\nprecio += '.00';\n}else{\n\nlet parts = precio.split('.');\n\nlet decimal = parts[1] || '';\n\nif(decimal.length === 0){\ndecimal = '00';\n}\n\nif(decimal.length === 1){\ndecimal += '0';\n}\n\nprecio = parts[0] + '.' + decimal;\n\n}\n\nel.innerText = moneda + precio;\n\n}\n\n});\n\n}\n\nfunction updateAutoExceso(i,v){\n\ninsurers[i].autoExceso=v;\n\nrender();\n\n}\n\nfunction updateRiesgo(i,v){\n\ninsurers[i].riesgo=v;\n\nrender();\n\n}\n\ndocument.querySelectorAll('input,select')\n.forEach(el=>{\n\nel.addEventListener('input',()=>{\n\ndocument.getElementById('pvCliente').innerText =\ndocument.getElementById('cliente').value;\n\ndocument.getElementById('pvVehicul ont-weight: 700 !important; color: #000 !important; display: block !important; margin-bottom: 2px !important; }\n\n    .qr-bloque { display: flex !important; flex-direction: column !important; align-items: center !important; gap: 4px !important; }\n  }\n  @media (max-width: 600px) {\n    .form-grid, .form-grid.three, .form-grid.four { grid-template-columns: 1fr; }\n    .carta { padding: 24px 18px; }\n    .carta-header { flex-direction: column; gap: 12px; }\n    .carta-fecha-lugar { text-align: left; }\n    .carta-firma-row { flex-direction: column; gap: 20px; }\n    .contactos-bloque { text-align: left; }\n    .check-grid { grid-template-columns: 1fr; }\n  }\n<\/style>\n<\/head>\n<body>\n\n<\u0021-- TOP BAR -->\n<div class=\"topbar\">\n  <div class=\"topbar-logo\">\n    <img src=\"data:image/png;base64,@@IMG0@@\" alt=\"CORREPLUS\">\n  <\/div>\n  <button class=\"btn-config\" onclick=\"abrirConfig()\">\n    <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z\"/><\/svg>\n    Configurar Listas\n  <\/button>\n<\/div>\n\n<\u0021-- MODAL CONFIG -->\n<div class=\"modal-overlay\" id=\"modalConfig\">\n  <div class=\"modal\">\n    <div class=\"modal-header\">\n      <span class=\"modal-title\">⚙️ Configurar Listas<\/span>\n      <button class=\"modal-close\" onclick=\"cerrarConfig()\">✕<\/button>\n    <\/div>\n    <div class=\"cfg-tabs\">\n      <button class=\"cfg-tab active\" onclick=\"switchCfgTab('aseg',this)\">🏢 Aseguradoras<\/button>\n      <button class=\"cfg-tab\" onclick=\"switchCfgTab('ramo',this)\">📄 Tipos de Seguro<\/button>\n      <button class=\"cfg-tab\" onclick=\"switchCfgTab('cob',this)\">🛡️ Coberturas<\/button>\n    <\/div>\n\n    <div class=\"cfg-panel active\" id=\"cfgp-aseg\">\n      <div class=\"cfg-list\" id=\"cfg-aseg-list\"><\/div>\n      <div class=\"cfg-add-row\">\n        <input type=\"text\" id=\"cfg-aseg-input\" placeholder=\"Nueva aseguradora...\" onkeydown=\"if(event.key==='Enter')addItem('aseg')\">\n        <button class=\"btn-sm\" onclick=\"addItem('aseg')\">+ Agregar<\/button>\n      <\/div>\n    <\/div>\n\n    <div class=\"cfg-panel\" id=\"cfgp-ramo\">\n      <div class=\"cfg-list\" id=\"cfg-ramo-list\"><\/div>\n      <div class=\"cfg-add-row\">\n        <input type=\"text\" id=\"cfg-ramo-input\" placeholder=\"Nuevo tipo de seguro...\" onkeydown=\"if(event.key==='Enter')addItem('ramo')\">\n        <button class=\"btn-sm\" onclick=\"addItem('ramo')\">+ Agregar<\/button>\n      <\/div>\n    <\/div>\n\n    <div class=\"cfg-panel\" id=\"cfgp-cob\">\n      <div class=\"cfg-list\" id=\"cfg-cob-list\"><\/div>\n      <div class=\"cfg-add-row\">\n        <input type=\"text\" id=\"cfg-cob-input\" placeholder=\"Nueva cobertura...\" onkeydown=\"if(event.key==='Enter')addItem('cob')\">\n        <button class=\"btn-sm\" onclick=\"addItem('cob')\">+ Agregar<\/button>\n      <\/div>\n    <\/div>\n\n    <div style=\"display:flex;justify-content:flex-end;margin-top:24px;\">\n      <button class=\"btn-primary\" onclick=\"cerrarConfig()\">✓ Guardar y Cerrar<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<\u0021-- TABS -->\n<div class=\"tabs-wrap\">\n  <div class=\"tabs\">\n    <button class=\"tab-btn active\" id=\"btn-datos\" onclick=\"switchTab('datos')\">\n      <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7\"/><path d=\"M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z\"/><\/svg>\n      Datos\n    <\/button>\n    <button class=\"tab-btn\" id=\"btn-vista\" onclick=\"switchTab('vista')\">\n      <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><\/svg>\n      Vista Previa\n    <\/button>\n  <\/div>\n\n  <\u0021-- PANEL DATOS -->\n  <div class=\"panel active\" id=\"panel-datos\">\n    <div class=\"form-card\">\n\n      <div class=\"section-label\">👤 Datos del Cliente<\/div>\n      <div class=\"form-grid\">\n        <div class=\"field\"><label>Nombre Completo<\/label><input type=\"text\" id=\"nombre\" placeholder=\"NOMBRE DEL ASEGURADO\" value=\"MARIA ELENA REYES HICIANO\"><\/div>\n        <div class=\"field\"><label>Cédula / RNC<\/label><input type=\"text\" id=\"cedula\" placeholder=\"000-0000000-0\" value=\"048-0059435-2\"><\/div>\n      <\/div>\n\n      <div class=\"section-label\">📋 Datos de la Póliza<\/div>\n      <div class=\"form-grid three\">\n        <div class=\"field\"><label>Aseguradora<\/label><select id=\"aseguradora\"><\/select><\/div>\n        <div class=\"field\"><label>Número de Póliza<\/label><input type=\"text\" id=\"poliza\" placeholder=\"0-000-000000\" value=\"1-600-553937\"><\/div>\n        <div class=\"field\"><label>Tipo de Seguro (Ramo)<\/label><select id=\"ramo\" onchange=\"onRamoChange()\"><\/select><\/div>\n      <\/div>\n      <div class=\"form-grid three\">\n        <div class=\"field\"><label>Prima Total (RD$)<\/label><input type=\"text\" id=\"prima\" placeholder=\"0.00\" value=\"359.99\"><\/div>\n        <div class=\"field\"><label>Vigencia Desde<\/label><input type=\"date\" id=\"vigDesde\" value=\"2026-06-25\"><\/div>\n        <div class=\"field\"><label>Vigencia Hasta<\/label><input type=\"date\" id=\"vigHasta\" value=\"2027-06-25\"><\/div>\n      <\/div>\n\n      <\u0021-- COBERTURAS -->\n      <div class=\"section-label\">🛡️ Coberturas<\/div>\n      <div style=\"margin-bottom:24px;\">\n        <div class=\"check-grid\" id=\"coberturas-check\"><\/div>\n        <div style=\"font-size:.74rem;color:var(--gray-3);margin-top:6px;\">Marca las coberturas que aplican. Puedes agregar más en \"Configurar Listas\".<\/div>\n      <\/div>\n\n      <\u0021-- VEHÍCULO -->\n      <div class=\"section-label\" id=\"lbl-riesgo\">🚗 Datos del Vehículo / Riesgo<\/div>\n\n      <\u0021-- Bloque auto -->\n      <div id=\"bloque-auto\">\n        <div class=\"form-grid four\">\n          <div class=\"field\"><label>Marca y Modelo<\/label><input type=\"text\" id=\"marca\" placeholder=\"LONCIN LX125T\" value=\"LONCIN LX125T\"><\/div>\n          <div class=\"field\"><label>Año<\/label><input type=\"text\" id=\"anio\" placeholder=\"2021\" value=\"2021\"><\/div>\n          <div class=\"field\"><label>Color<\/label><input type=\"text\" id=\"color\" placeholder=\"PLATEADO\" value=\"PLATEADO\"><\/div>\n          <div class=\"field\"><label>Placa<\/label><input type=\"text\" id=\"placa\" placeholder=\"K0000000\" value=\"K2124689\"><\/div>\n        <\/div>\n        <div class=\"form-grid\">\n          <div class=\"field\"><label>No. de Chasis<\/label><input type=\"text\" id=\"chasis\" placeholder=\"XXXXXXXXXXXXXXXXX\" value=\"LLCLT1S0XMCK01232\"><\/div>\n          <div class=\"field\"><label>No. de Motor<\/label><input type=\"text\" id=\"motor\" placeholder=\"opcional\"><\/div>\n        <\/div>\n      <\/div>\n\n      <\u0021-- Bloque riesgo genérico -->\n      <div id=\"bloque-otro\" style=\"display:none; margin-bottom:24px;\">\n        <div class=\"field\">\n          <label>Descripción del Riesgo Asegurado<\/label>\n          <textarea id=\"riesgoLibre\" rows=\"3\" placeholder=\"Ej: Residencia ubicada en Calle X no. 5, Bonao. Valor asegurado: RD$2,500,000...\"><\/textarea>\n        <\/div>\n      <\/div>\n\n      <div class=\"section-label\">📅 Fecha de Emisión<\/div>\n      <div class=\"form-grid\">\n        <div class=\"field\"><label>Fecha de la Carta<\/label><input type=\"date\" id=\"fechaEmision\"><\/div>\n      <\/div>\n\n      <div class=\"btn-row\">\n        <button class=\"btn-primary\" onclick=\"switchTab('vista')\">\n          <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><\/svg>\n          Ver Vista Previa\n        <\/button>\n        <button class=\"btn-outline\" onclick=\"limpiarFormulario()\">Limpiar<\/button>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <\u0021-- PANEL VISTA PREVIA -->\n  <div class=\"panel\" id=\"panel-vista\">\n    <div class=\"preview-wrap\">\n      <div class=\"preview-actions\">\n        <button class=\"btn-outline\" onclick=\"switchTab('datos')\">\n          <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7\"/><path d=\"M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z\"/><\/svg>\n          Editar\n        <\/button>\n        <button class=\"btn-primary\" onclick=\"window.print()\">\n          <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"6 9 6 2 18 2 18 9\"/><path d=\"M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2\"/><rect x=\"6\" y=\"14\" width=\"12\" height=\"8\"/><\/svg>\n          Imprimir / PDF\n        <\/button>\n      <\/div>\n      <div id=\"carta-render\"><\/div>\n    <\/div>\n  <\/div>\n<\/div><\u0021-- /tabs-wrap -->\n\n<script>\n// ── LOGO BASE64 ──\nconst LOGO_SRC = \"data:image/png;base64,@@IMG0@@\";\n\n// ── RAMOS QUE SON VEHÍCULO ──\nconst RAMOS_AUTO = ['LEY 50/50/100','LEY 150/300/100','SEMIFULL','FULL','SEMIFULL PLUS','FULL PLUS','SOLO ROBO','RESPONSABILIDAD CIVIL VEHICULO'];\n\n// ── DEFAULTS ──\nconst DEF_ASEG = ['DOMINICANA','MAPFRE BHD','SEGUROS RESERVAS','HUMANO','ALTAS CUMBRES','ATLÁNTICA','FEDECREDITO','SCOTIABANK SEGUROS','UNIVERSAL','PREMIER','LA COLONIAL'];\nconst DEF_RAMO = ['LEY 50/50/100','LEY 150/300/100','SEMIFULL','FULL','VIDA','SALUD','HOGAR','COMERCIAL'];\nconst DEF_COB  = ['Daños a Terceros – Personas','Daños a Terceros – Propiedad','Daños a Terceros – Muerte','Robo Total','Pérdida Total por Colisión','Daños Propios','Asistencia en Carretera','Cristales','Responsabilidad Civil','Asistencia Médica'];\n\nlet lists = { aseg:[], ramo:[], cob:[] };\n\nfunction loadLists() {\n  lists.aseg = JSON.parse(localStorage.getItem('cb_aseg') || 'null') || [...DEF_ASEG];\n  lists.ramo = JSON.parse(localStorage.getItem('cb_ramo') || 'null') || [...DEF_RAMO];\n  lists.cob  = JSON.parse(localStorage.getItem('cb_cob')  || 'null') || [...DEF_COB];\n}\nfunction saveLists() {\n  localStorage.setItem('cb_aseg', JSON.stringify(lists.aseg));\n  localStorage.setItem('cb_ramo', JSON.stringify(lists.ramo));\n  localStorage.setItem('cb_cob',  JSON.stringify(lists.cob));\n}\n\n// ── POPULATE ──\nfunction populateSelect(id, arr, preserve) {\n  const sel = document.getElementById(id);\n  const prev = preserve ? sel.value : null;\n  sel.innerHTML = arr.map(v => `<option value=\"${v}\">${v}<\/option>`).join('');\n  if(prev && arr.includes(prev)) sel.value = prev;\n}\n\nfunction populateCoberturas() {\n  const checked = getCheckedCoberturas();\n  const container = document.getElementById('coberturas-check');\n  if(lists.cob.length === 0) { container.innerHTML = '<div style=\"font-size:.82rem;color:var(--gray-3)\">Sin coberturas. Agrégalas en Configurar Listas.<\/div>'; return; }\n  container.innerHTML = lists.cob.map(c => `\n    <label class=\"check-item\">\n      <input type=\"checkbox\" name=\"cobertura\" value=\"${c}\" ${checked.includes(c)?'checked':''}>\n      ${c}\n    <\/label>`).join('');\n}\n\nfunction getCheckedCoberturas() {\n  return [...document.querySelectorAll('input[name=\"cobertura\"]:checked')].map(el => el.value);\n}\n\n// ── RAMO CHANGE – toggle vehículo vs riesgo libre ──\nfunction onRamoChange() {\n  const ramo = document.getElementById('ramo').value;\n  const esAuto = RAMOS_AUTO.some(r => ramo.toUpperCase().includes(r.split(' ')[0])) ||\n                 ramo.toUpperCase().includes('LEY') ||\n                 ramo.toUpperCase().includes('FULL') ||\n                 ramo.toUpperCase().includes('SEMI') ||\n                 ramo.toUpperCase().includes('MOTO') ||\n                 ramo.toUpperCase().includes('MOTOCICLETA') ||\n                 ramo.toUpperCase().includes('AUTO') ||\n                 ramo.toUpperCase().includes('VEHICULO') ||\n                 ramo.toUpperCase().includes('VEHÍCULO');\n  document.getElementById('bloque-auto').style.display  = esAuto ? 'block' : 'none';\n  document.getElementById('bloque-otro').style.display  = esAuto ? 'none'  : 'block';\n  const lbl = document.getElementById('lbl-riesgo');\n  lbl.textContent = esAuto ? '🚗 Datos del Vehículo / Riesgo' : '📦 Riesgo Asegurado';\n}\n\n// ── CONFIG MODAL ──\nfunction switchCfgTab(key, btn) {\n  document.querySelectorAll('.cfg-tab').forEach(t => t.classList.remove('active'));\n  document.querySelectorAll('.cfg-panel').forEach(p => p.classList.remove('active'));\n  btn.classList.add('active');\n  document.getElementById('cfgp-'+key).classList.add('active');\n}\n\nfunction renderCfgList(key) {\n  const el = document.getElementById(`cfg-${key}-list`);\n  if(!lists[key].length) { el.innerHTML = '<div class=\"cfg-empty\">Sin elementos. Agrega uno abajo.<\/div>'; return; }\n  el.innerHTML = lists[key].map((v,i) => `\n    <div class=\"cfg-item\">\n      <span>${v}<\/span>\n      <button class=\"btn-danger\" onclick=\"removeItem('${key}',${i})\">\n        <svg width=\"11\" height=\"11\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.8\" stroke-linecap=\"round\"><line x1=\"18\" y1=\"6\" x2=\"6\" y2=\"18\"/><line x1=\"6\" y1=\"6\" x2=\"18\" y2=\"18\"/><\/svg>\n        Quitar\n      <\/button>\n    <\/div>`).join('');\n}\n\nfunction addItem(key) {\n  const input = document.getElementById(`cfg-${key}-input`);\n  const val = input.value.trim().toUpperCase();\n  if(!val || lists[key].includes(val)) { input.value=''; return; }\n  lists[key].push(val);\n  saveLists();\n  renderCfgList(key);\n  populateSelect('aseguradora', lists.aseg, true);\n  populateSelect('ramo', lists.ramo, true);\n  populateCoberturas();\n  input.value=''; input.focus();\n}\n\nfunction removeItem(key, idx) {\n  lists[key].splice(idx,1);\n  saveLists();\n  renderCfgList(key);\n  populateSelect('aseguradora', lists.aseg, true);\n  populateSelect('ramo', lists.ramo, true);\n  populateCoberturas();\n}\n\nfunction abrirConfig() {\n  renderCfgList('aseg'); renderCfgList('ramo'); renderCfgList('cob');\n  document.getElementById('modalConfig').classList.add('open');\n}\nfunction cerrarConfig() { document.getElementById('modalConfig').classList.remove('open'); }\ndocument.getElementById('modalConfig').addEventListener('click', function(e){ if(e.target===this) cerrarConfig(); });\n\n// ── TABS ──\nfunction switchTab(tab) {\n  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));\n  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));\n  document.getElementById('btn-'+tab).classList.add('active');\n  document.getElementById(tab==='datos'?'panel-datos':'panel-vista').classList.add('active');\n  if(tab==='vista') generarVista();\n}\n\n// ── HELPERS ──\nconst pad = n => String(n).padStart(2,'0');\nconst hoy = new Date();\nconst fechaHoy = `${hoy.getFullYear()}-${pad(hoy.getMonth()+1)}-${pad(hoy.getDate())}`;\n\nfunction formatVigilancia(desde, hasta) {\n  if(!desde||!hasta) return '–';\n  const [dy,dm,dd]=desde.split('-'), [hy,hm,hd]=hasta.split('-');\n  return `${dd}/${dm}/${dy} AL ${hd}/${hm}/${hy}`;\n}\nfunction formatPrima(val) {\n  const n=parseFloat(val); return isNaN(n)?'RD$0.00':'RD$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});\n}\nfunction g(id){ return document.getElementById(id).value.trim(); }\n\n// ── GENERAR CARTA ──\nfunction generarVista() {\n  const fecha    = g('fechaEmision')||fechaHoy;\n  const [dy,dm,dd]=fecha.split('-');\n  const meses=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];\n  const fechaCorta=`${parseInt(dd)} ${meses[parseInt(dm)-1]} ${dy}`;\n  const nombre   = g('nombre')||'–';\n  const cedula   = g('cedula')||'–';\n  const aseg     = g('aseguradora')||'–';\n  const poliza   = g('poliza')||'–';\n  const ramo     = g('ramo')||'–';\n  const prima    = formatPrima(g('prima'));\n  const vigStr   = formatVigilancia(g('vigDesde'),g('vigHasta'));\n  const cobSel   = getCheckedCoberturas();\n\n  // Riesgo: auto o libre\n  const esAuto   = document.getElementById('bloque-auto').style.display !== 'none';\n  let riesgo;\n  if(esAuto) {\n    riesgo = [g('marca'),g('anio'),g('color'),g('chasis'),g('placa')].filter(Boolean).join(' ')||'–';\n  } else {\n    riesgo = g('riesgoLibre')||'–';\n  }\n\n  const cobHTML = cobSel.length ? `\n    <div class=\"coberturas-title\">Coberturas Incluidas<\/div>\n    <ul class=\"coberturas-list\">${cobSel.map(c=>`<li>${c}<\/li>`).join('')}<\/ul>` : '';\n\n  document.getElementById('carta-render').innerHTML = `\n  <div class=\"carta\">\n\n    <\u0021-- HEADER: logo + fecha -->\n    <div class=\"carta-header\">\n      <div class=\ lex;\n    gap:20px;\n    border-bottom:2px solid var(--line);\n    margin-bottom:20px;\n  }\n  .tab-btn{\n    background:none;\n    border:none;\n    padding:10px 2px;\n    font-family:'Barlow',Arial,sans-serif;\n    font-size:14px;\n    font-weight:600;\n    color:var(--ink-soft);\n    cursor:pointer;\n    border-bottom:3px solid transparent;\n    margin-bottom:-2px;\n  }\n  .tab-btn.active{\n    color:var(--teal-dark);\n    border-bottom-color:var(--teal-dark);\n  }\n  .tab-panel{display:none;}\n  .tab-panel.active{display:block;}\n\n  .tag-list{\n    display:flex;\n    flex-wrap:wrap;\n    gap:8px;\n    margin-bottom:14px;\n  }\n  .tag-item{\n    display:flex;\n    align-items:center;\n    gap:4px;\n    background:var(--teal-pale);\n    color:var(--teal-dark);\n    border-radius:20px;\n    padding:6px 6px 6px 14px;\n    font-size:13px;\n    font-weight:600;\n  }\n  .tag-remove{\n    background:none;\n    border:none;\n    color:var(--teal-dark);\n    font-size:16px;\n    line-height:1;\n    cursor:pointer;\n    padding:3px 6px;\n    border-radius:50%;\n  }\n  .tag-remove:hover{background:var(--danger-pale);color:var(--danger);}\n  .tag-empty{color:#9AA9AA;font-style:italic;font-size:13px;}\n\n  .field-inline-add{display:flex;gap:8px;}\n  .field-inline-add input{\n    flex:1;\n    padding:8px 10px;\n    border:1px solid var(--line);\n    border-radius:6px;\n    font-family:'Barlow',Arial,sans-serif;\n    font-size:14px;\n  }\n  .field-inline-add .btn{white-space:nowrap;}\n\n  .panel{\n    background:var(--paper);\n    border:1px solid var(--line);\n    border-radius:10px;\n    padding:20px 22px;\n    margin-bottom:18px;\n  }\n  .panel h2{\n    font-size:15px;\n    font-weight:600;\n    color:var(--teal-dark);\n    margin:0 0 14px 0;\n    padding-bottom:10px;\n    border-bottom:2px solid var(--teal-pale);\n  }\n\n  .field{margin-bottom:12px;}\n  .field label{\n    display:block;\n    font-size:12.5px;\n    font-weight:600;\n    color:var(--ink-soft);\n    margin-bottom:4px;\n  }\n  .field input[type=text],\n  .field input[type=number],\n  .field input[type=date],\n  .field input[type=email],\n  .field select,\n  .field textarea{\n    width:100%;\n    padding:8px 10px;\n    border:1px solid var(--line);\n    border-radius:6px;\n    font-family:'Barlow',Arial,sans-serif;\n    font-size:14px;\n    color:var(--ink);\n    background:#fff;\n  }\n  .field input:focus,\n  .field select:focus,\n  .field textarea:focus{\n    outline:none;\n    border-color:var(--teal-light);\n    box-shadow:0 0 0 3px rgba(55,184,194,.18);\n  }\n  .field textarea{resize:vertical;min-height:56px;}\n\n  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}\n  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}\n\n  .choice-group{display:flex;gap:8px;flex-wrap:wrap;}\n  .choice{\n    flex:1;\n    min-width:120px;\n    position:relative;\n  }\n  .choice input{position:absolute;opacity:0;width:0;height:0;}\n  .choice label{\n    display:block;\n    text-align:center;\n    padding:9px 8px;\n    border:1.5px solid var(--line);\n    border-radius:7px;\n    font-size:13px;\n    font-weight:600;\n    color:var(--ink-soft);\n    cursor:pointer;\n    margin:0;\n    transition:all .12s;\n  }\n  .choice input:checked + label{\n    border-color:var(--teal-dark);\n    background:var(--teal-pale);\n    color:var(--teal-dark);\n  }\n\n  .subblock{\n    margin-top:12px;\n    padding:12px 14px;\n    background:var(--teal-pale);\n    border-radius:8px;\n    display:none;\n  }\n  .subblock.show{display:block;}\n\n  .poliza-card{\n    border:1px solid var(--line);\n    border-radius:8px;\n    padding:14px 16px 4px 16px;\n    margin-bottom:14px;\n    background:#FCFDFD;\n  }\n  .poliza-card-header{\n    display:flex;\n    justify-content:space-between;\n    align-items:center;\n    margin-bottom:10px;\n  }\n  .poliza-card-header span{\n    font-size:12.5px;\n    font-weight:700;\n    color:var(--teal-dark);\n    text-transform:uppercase;\n    letter-spacing:.4px;\n  }\n  .poliza-card .field input{font-size:14px;}\n  .poliza-card .field-monto input{\n    font-size:16px;\n    font-weight:600;\n    text-align:right;\n  }\n  .row-remove{\n    background:none;\n    border:none;\n    color:var(--danger);\n    font-size:20px;\n    line-height:1;\n    cursor:pointer;\n    padding:2px 6px;\n  }\n  .row-remove:hover{background:var(--danger-pale);border-radius:5px;}\n\n  .btn{\n    display:inline-flex;\n    align-items:center;\n    gap:6px;\n    padding:9px 16px;\n    border-radius:7px;\n    border:1.5px solid var(--teal-dark);\n    background:#fff;\n    color:var(--teal-dark);\n    font-family:'Barlow',Arial,sans-serif;\n    font-size:13.5px;\n    font-weight:600;\n    cursor:pointer;\n  }\n  .btn:hover{background:var(--teal-pale);}\n  .btn-primary{\n    background:var(--teal-dark);\n    color:#fff;\n  }\n  .btn-primary:hover{background:#0a5257;}\n  .btn-ghost{\n    border-color:var(--line);\n    color:var(--ink-soft);\n  }\n  .btn-sm{padding:6px 12px;font-size:12.5px;}\n\n  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}\n  .actions-sticky{\n    position:sticky;\n    bottom:0;\n    background:linear-gradient(180deg,rgba(241,245,245,0) 0%,var(--bg) 30%);\n    padding:14px 0 4px 0;\n  }\n\n  /* ===== PREVIEW / DOCUMENTO ===== */\n  .preview-wrap{\n    background:var(--paper);\n    border:1px solid var(--line);\n    border-radius:10px;\n    padding:0;\n    overflow:hidden;\n  }\n  .preview-toolbar{\n    display:flex;\n    justify-content:space-between;\n    align-items:center;\n    padding:14px 22px;\n    border-bottom:1px solid var(--line);\n    background:#FAFCFC;\n  }\n  .preview-toolbar span{\n    font-size:12.5px;\n    color:var(--ink-soft);\n    font-weight:600;\n  }\n\n  #documento{\n    padding:36px 40px;\n    font-family:'Barlow',Arial,sans-serif;\n    color:var(--ink);\n  }\n\n  .doc-header{\n    display:flex;\n    justify-content:space-between;\n    align-items:flex-start;\n    border-bottom:3px solid var(--teal-dark);\n    padding-bottom:16px;\n    margin-bottom:18px;\n  }\n  .doc-brand{display:flex;flex-direction:column;align-items:flex-start;gap:8px;}\n  .doc-logo{\n    height:64px;\n    width:auto;\n    display:block;\n  }\n  .doc-meta-right{text-align:right;font-size:12px;color:var(--ink-soft);line-height:1.6;}\n  .doc-meta-right .doc-meta-fecha{margin-top:8px;font-size:13px;color:var(--ink);}\n  .doc-meta-right .doc-meta-fecha b{color:var(--teal-dark);}\n\n  .doc-title{\n    text-align:center;\n    font-family:'Barlow Condensed',sans-serif;\n    font-size:19px;\n    font-weight:700;\n    letter-spacing:1px;\n    color:var(--teal-dark);\n    margin:6px 0 18px 0;\n  }\n\n  .doc-clientbox{\n    display:grid;\n    grid-template-columns:1fr 1fr;\n    gap:0 24px;\n    border:1px solid var(--line);\n    border-radius:8px;\n    padding:14px 18px;\n    margin-bottom:16px;\n    font-size:13px;\n  }\n  .doc-clientbox .kv{display:flex;padding:3px 0;}\n  .doc-clientbox .kv .k{width:90px;flex-shrink:0;color:var(--ink-soft);font-weight:600;}\n  .doc-clientbox .kv .v{font-weight:500;}\n  .doc-clientbox .kv .v.client-name{font-weight:700;font-size:14.5px;color:var(--ink);}\n\n  .doc-options{\n    display:flex;gap:20px;\n    margin-bottom:16px;\n    font-size:12.5px;\n  }\n  .doc-options .opt{\n    border:1px solid var(--line);\n    border-radius:7px;\n    padding:8px 14px;\n    color:var(--ink-soft);\n  }\n  .doc-options .opt b{color:var(--ink);}\n\n  table.doc-table{\n    width:100%;\n    border-collapse:collapse;\n    margin-bottom:18px;\n    font-size:12.5px;\n  }\n  table.doc-table th{\n    background:var(--teal-dark);\n    color:#fff;\n    text-align:left;\n    padding:8px 10px;\n    font-weight:600;\n    font-size:11.5px;\n    text-transform:uppercase;\n    letter-spacing:.3px;\n  }\n  table.doc-table td{\n    padding:8px 10px;\n    border-bottom:1px solid var(--line);\n  }\n  table.doc-table tfoot td{\n    font-weight:700;\n    border-top:2px solid var(--teal-dark);\n    border-bottom:none;\n  }\n  .num{text-align:right;}\n\n  .doc-dist-title{\n    background:var(--teal-pale);\n    color:var(--teal-dark);\n    font-weight:700;\n    font-size:13px;\n    padding:8px 14px;\n    border-radius:6px 6px 0 0;\n  }\n  table.doc-dist{\n    width:100%;\n    border-collapse:collapse;\n    border:1px solid var(--line);\n    border-top:none;\n    margin-bottom:6px;\n    font-size:14px;\n  }\n  table.doc-dist th{\n    background:#F5FAFA;\n    padding:8px 10px;\n    text-align:left;\n    font-size:11.5px;\n    color:var(--ink-soft);\n    border-bottom:1px solid var(--line);\n  }\n  table.doc-dist th.dist-center{text-align:center;}\n  table.doc-dist td{\n    padding:10px 10px;\n    border-bottom:1px solid var(--line);\n  }\n  table.doc-dist td.dist-center{text-align:center;}\n  table.doc-dist td.dist-monto{\n    text-align:center;\n    font-size:15px;\n    font-weight:700;\n    color:var(--teal-dark);\n  }\n  table.doc-dist tfoot td{\n    font-weight:700;\n    background:#F5FAFA;\n    border-bottom:none;\n  }\n  table.doc-dist tfoot td.dist-monto{font-size:16px;}\n  .doc-legal{\n    font-size:10.5px;\n    color:var(--ink-soft);\n    margin:4px 0 18px 0;\n    line-height:1.5;\n  }\n\n  .doc-obs{\n    border:1px solid var(--line);\n    border-radius:7px;\n    padding:10px 14px;\n    font-size:12.5px;\n    margin-bottom:14px;\n    min-height:20px;\n  }\n  .doc-obs .lbl{font-weight:700;color:var(--teal-dark);font-size:11px;text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:4px;}\n\n  .doc-notas{\n    font-size:11px;\n    color:var(--ink-soft);\n    line-height:1.6;\n    margin-bottom:20px;\n    white-space:pre-line;\n  }\n  .doc-notas b{color:var(--ink);}\n\n  .doc-signatures{\n    display:grid;\n    grid-template-columns:1fr 1fr;\n    gap:40px;\n    margin-top:80px;\n  }\n  .sig-line{\n    border-top:1px solid var(--ink);\n    padding-top:6px;\n    text-align:center;\n    font-size:12px;\n    font-weight:600;\n    color:var(--ink-soft);\n  }\n\n  .empty-hint{\n    color:#9AA9AA;\n    font-style:italic;\n  }\n\n  @media print{\n    * { -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; color-adjust:exact !important; }\n    body{background:#fff;padding:0;}\n    .app{display:block;max-width:none;}\n    .form-col{display:none !important;}\n    .preview-toolbar{display:none !important;}\n    .preview-wrap{border:none;border-radius:0;}\n    #documento{padding:0;}\n  }\n\n  @media (max-width:980px){\n    .app{grid-template-columns:1fr;}\n  }\n<\/style>\n<\/head>\n<body>\n\n<div class=\"app\">\n\n  <\u0021-- ============ FORMULARIO ============ -->\n  <div class=\"form-col\">\n    <h1>Generador de Acuerdo de Pago<\/h1>\n    <p class=\"subtitle\">CORREPLUS Corredores de Seguros — completa los datos y genera el documento listo para imprimir o enviar.<\/p>\n\n    <div class=\"tabs\">\n      <button class=\"tab-btn active\" id=\"tabBtnGenerador\" onclick=\"switchTab('generador')\">Generador<\/button>\n      <button class=\"tab-btn\" id=\"tabBtnConfig\" onclick=\"switchTab('config')\">Configuración<\/button>\n    <\/div>\n\n    <div id=\"tabGenerador\" class=\"tab-panel active\">\n\n    <div class=\"panel\">\n      <h2>Datos del acuerdo<\/h2>\n      <div class=\"field\">\n        <label>Fecha<\/label>\n        <input type=\"date\" id=\"fechaAcuerdo\">\n      <\/div>\n      <div class=\"field\">\n        <label>Gestor / Asesor<\/label>\n        <input type=\"text\" id=\"gestor\" placeholder=\"Nombre del gestor\">\n      <\/div>\n    <\/div>\n\n    <div class=\"panel\">\n      <h2>Datos del cliente<\/h2>\n      <div class=\"row2\">\n        <div class=\"field\">\n          <label>Código de cliente<\/label>\n          <input type=\"text\" id=\"clienteCodigo\" placeholder=\"06843\">\n        <\/div>\n        <div class=\"field\">\n          <label>Nombre completo<\/label>\n          <input type=\"text\" id=\"clienteNombre\" placeholder=\"Nombre del cliente\">\n        <\/div>\n      <\/div>\n      <div class=\"field\">\n        <label>Teléfono<\/label>\n        <input type=\"text\" id=\"clienteTelefono\" placeholder=\"809-000-0000\">\n      <\/div>\n      <div class=\"field\">\n        <label>Email<\/label>\n        <input type=\"email\" id=\"clienteEmail\" placeholder=\"cliente@correo.com\">\n      <\/div>\n    <\/div>\n\n    <div class=\"panel\">\n      <h2>Pólizas<\/h2>\n      <div id=\"polizaBody\"><\/div>\n      <button class=\"btn btn-sm btn-ghost\" onclick=\"addPolizaRow()\">+ Agregar póliza<\/button>\n    <\/div>\n\n    <div class=\"panel\">\n      <h2>Moneda<\/h2>\n      <div class=\"field\">\n        <div class=\"choice-group\">\n          <div class=\"choice\">\n            <input type=\"radio\" name=\"moneda\" id=\"monRD\" value=\"RD$\" checked onchange=\"generarDocumento()\">\n            <label for=\"monRD\">RD$<\/label>\n          <\/div>\n          <div class=\"choice\">\n            <input type=\"radio\" name=\"moneda\" id=\"monUS\" value=\"US$\" onchange=\"generarDocumento()\">\n            <label for=\"monUS\">US$<\/label>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"panel\" id=\"planPagoPanel\">\n      <h2>Acuerdo de pago<\/h2>\n      <div class=\"field\">\n        <label>Selecciona el tipo de acuerdo<\/label>\n        <div class=\"choice-group\" style=\"flex-direction:column;\">\n          <div class=\"choice\" style=\"min-width:auto;\">\n            <input type=\"radio\" name=\"planTipo\" id=\"planUnico\" value=\"unico\" checked onchange=\"onPlanTipoChange()\">\n            <label for=\"planUnico\" style=\"text-align:left;\">Pago único<\/label>\n          <\/div>\n          <div class=\"choice\" style=\"min-width:auto;\">\n            <input type=\"radio\" name=\"planTipo\" id=\"plan4Iguales\" value=\"4iguales\" onchange=\"onPlanTipoChange()\">\n            <label for=\"plan4Iguales\" style=\"text-align:left;\">4 cuotas iguales<\/label>\n          <\/div>\n          <div class=\"choice\" style=\"min-width:auto;\">\n            <input type=\"radio\" name=\"planTipo\" id=\"plan25\" value=\"25mas4\" onchange=\"onPlanTipoChange()\">\n            <label for=\"plan25\" style=\"text-align:left;\">25% inicial + resto en 4 cuotas iguales<\/label>\n          <\/div>\n          <div class=\"choice\" style=\"min-width:auto;\">\n            <input type=\"radio\" name=\"planTipo\" id=\"plan30\" value=\"30mas4\" onchange=\"onPlanTipoChange()\">\n            <label for=\"plan30\" style=\"text-align:left;\">30% inicial + resto en 4 cuotas mensuales<\/label>\n          <\/div>\n          <div class=\"choice\" style=\"min-width:auto;\">\n            <input type=\"radio\" name=\"planTipo\" id=\"planPersonalizado\" value=\"personalizado\" onchange=\"onPlanTipoChange()\">\n            <label for=\"planPersonalizado\" style=\"text-align:left;\">Personalizado<\/label>\n          <\/div>\n        <\/div>\n      <\/div>\n      <p class=\"hint-text\" id=\"hintAutoFechas\">Las fechas de las cuotas se calculan a partir de la \"Vigencia desde\" de la primera póliza.<\/p>\n\n      <div class=\"subblock\" id=\"personalizadoBlock\">\n        <div id=\"cuotaBody\"><\/div>\n        <button class=\"btn btn-sm btn-ghost\" onclick=\"addCuotaRow()\">+ Agregar cuota<\/button>\n        <p class=\"hint-text\">Define cada pago con su descripción, monto y fecha. El total de las cuotas debe coincidir con el monto total de las pólizas.<\/p>\n      <\/div>\n    <\/div>\n\n    <div class=\"panel\">\n      <h2>Observaciones y notas<\/h2>\n      <div class=\"field\">\n        <label>Observaciones<\/label>\n        <textarea id=\"observaciones\" placeholder=\"Opcional\"><\/textarea>\n      <\/div>\n      <div class=\"field\">\n        <label>Notas importantes<\/label>\n        <textarea id=\"notasImportantes\">Máximo 10 días a partir del inicio de vigencia de las pólizas para el pago inicial (Art. 75, Ley 146-02).\nMáximo 120 días a partir del inicio de vigencia de la(s) póliza(s) para el
