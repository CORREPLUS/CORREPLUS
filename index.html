 pago total (Art. 73, Ley 146-02).<\/textarea>\n      <\/div>\n    <\/div>\n\n    <div class=\"actions actions-sticky\">\n      <button class=\"btn btn-primary\" onclick=\"window.print()\">Imprimir / Guardar PDF<\/button>\n      <button class=\"btn btn-ghost\" onclick=\"limpiarFormulario()\">Limpiar<\/button>\n    <\/div>\n\n    <\/div>\n\n    <div id=\"tabConfig\" class=\"tab-panel\">\n      <div class=\"panel\">\n        <h2>Aseguradoras<\/h2>\n        <p class=\"hint-text\" style=\"margin:0 0 12px 2px;\">Estas son las opciones que aparecerán en el desplegable de Aseguradora. \"Otra (especificar)\" siempre queda disponible.<\/p>\n        <div id=\"aseguradorasList\" class=\"tag-list\"><\/div>\n        <div class=\"field-inline-add\">\n          <input type=\"text\" id=\"nuevaAseguradora\" placeholder=\"Nombre de la aseguradora\">\n          <button class=\"btn btn-sm\" onclick=\"addAseguradora()\">+ Agregar<\/button>\n        <\/div>\n      <\/div>\n\n      <div class=\"panel\">\n        <h2>Tipos de seguro (Ramos)<\/h2>\n        <p class=\"hint-text\" style=\"margin:0 0 12px 2px;\">Estas son las opciones que aparecerán en el desplegable de Ramo. \"Otro (especificar)\" siempre queda disponible.<\/p>\n        <div id=\"ramosList\" class=\"tag-list\"><\/div>\n        <div class=\"field-inline-add\">\n          <input type=\"text\" id=\"nuevoRamo\" placeholder=\"Tipo de seguro\">\n          <button class=\"btn btn-sm\" onclick=\"addRamo()\">+ Agregar<\/button>\n        <\/div>\n      <\/div>\n    <\/div>\n\n  <\/div>\n\n  <\u0021-- ============ VISTA PREVIA ============ -->\n  <div class=\"preview-col\">\n    <div class=\"preview-wrap\">\n      <div class=\"preview-toolbar\">\n        <span>Vista previa del acuerdo<\/span>\n        <span id=\"totalPreviewLabel\"><\/span>\n      <\/div>\n      <div id=\"documento\"><\/div>\n    <\/div>\n  <\/div>\n\n<\/div>\n\n<script>\nconst LOGO_B64 = \"@@IMG0@@\";\nlet polizaRowCount = 0;\n\nfunction buildOptions(list, selected){\n  return list.map(opt => `<option value=\"${opt}\" ${opt===selected?'selected':''}>${opt}<\/option>`).join('');\n}\n\nconst ASEGURADORAS_DEFAULT = [\n  'Seguros Universal','Seguros Sura','La Colonial de Seguros','MAPFRE BHD',\n  'Seguros Reservas','Banreservas Seguros','Proseguros','Seguros Pepín',\n  'Atlántica Seguros','Seguros Constitución','General de Seguros','Vimenca Seguros',\n  'Humano Seguros'\n];\n\nconst RAMOS_DEFAULT = [\n  'Automóviles','Auto Exceso','Vida','Salud / Médico','Incendio y Líneas Aliadas',\n  'Fianzas','Responsabilidad Civil','Transporte / Carga','Multiriesgo Hogar',\n  'Naves y Embarcaciones','Todo Riesgo Construcción / Ingeniería','Fidelidad',\n  'Agrícola y Pecuario'\n];\n\nlet ASEGURADORAS = ASEGURADORAS_DEFAULT.slice();\nlet RAMOS = RAMOS_DEFAULT.slice();\n\nconst LS_KEY_ASEGURADORAS = 'correplus_aseguradoras';\nconst LS_KEY_RAMOS = 'correplus_ramos';\n\nfunction loadConfig(){\n  try{\n    const a = localStorage.getItem(LS_KEY_ASEGURADORAS);\n    if(a) ASEGURADORAS = JSON.parse(a);\n    const r = localStorage.getItem(LS_KEY_RAMOS);\n    if(r) RAMOS = JSON.parse(r);\n  }catch(e){ /* localStorage no disponible, se usan los valores por defecto */ }\n}\n\nfunction saveConfig(){\n  try{\n    localStorage.setItem(LS_KEY_ASEGURADORAS, JSON.stringify(ASEGURADORAS));\n    localStorage.setItem(LS_KEY_RAMOS, JSON.stringify(RAMOS));\n  }catch(e){ /* no se pudo guardar, la configuración solo dura esta sesión */ }\n}\n\nfunction switchTab(tab){\n  document.getElementById('tabGenerador').classList.toggle('active', tab==='generador');\n  document.getElementById('tabConfig').classList.toggle('active', tab==='config');\n  document.getElementById('tabBtnGenerador').classList.toggle('active', tab==='generador');\n  document.getElementById('tabBtnConfig').classList.toggle('active', tab==='config');\n}\n\nfunction renderConfigLists(){\n  const aList = document.getElementById('aseguradorasList');\n  aList.innerHTML = ASEGURADORAS.length\n    ? ASEGURADORAS.map((a,i)=>`<div class=\"tag-item\"><span>${a}<\/span><button class=\"tag-remove\" onclick=\"removeAseguradora(${i})\" title=\"Quitar\">&times;<\/button><\/div>`).join('')\n    : '<span class=\"tag-empty\">No hay aseguradoras configuradas<\/span>';\n\n  const rList = document.getElementById('ramosList');\n  rList.innerHTML = RAMOS.length\n    ? RAMOS.map((r,i)=>`<div class=\"tag-item\"><span>${r}<\/span><button class=\"tag-remove\" onclick=\"removeRamo(${i})\" title=\"Quitar\">&times;<\/button><\/div>`).join('')\n    : '<span class=\"tag-empty\">No hay tipos de seguro configurados<\/span>';\n}\n\nfunction addAseguradora(){\n  const input = document.getElementById('nuevaAseguradora');\n  const val = input.value.trim();\n  if(val && !ASEGURADORAS.includes(val)){\n    ASEGURADORAS.push(val);\n    input.value = '';\n    saveConfig();\n    renderConfigLists();\n    refreshAllPolizaSelects();\n  }\n}\n\nfunction removeAseguradora(i){\n  ASEGURADORAS.splice(i,1);\n  saveConfig();\n  renderConfigLists();\n  refreshAllPolizaSelects();\n}\n\nfunction addRamo(){\n  const input = document.getElementById('nuevoRamo');\n  const val = input.value.trim();\n  if(val && !RAMOS.includes(val)){\n    RAMOS.push(val);\n    input.value = '';\n    saveConfig();\n    renderConfigLists();\n    refreshAllPolizaSelects();\n  }\n}\n\nfunction removeRamo(i){\n  RAMOS.splice(i,1);\n  saveConfig();\n  renderConfigLists();\n  refreshAllPolizaSelects();\n}\n\nfunction refreshAllPolizaSelects(){\n  document.querySelectorAll('#polizaBody .poliza-card').forEach(card=>{\n    const id = card.id.replace('polizaRow','');\n    const aseguradoraSelect = document.getElementById('p_aseguradora_'+id);\n    const currentAseguradora = aseguradoraSelect.value;\n    aseguradoraSelect.innerHTML = '<option value=\"\">Selecciona...<\/option>' + buildOptions(ASEGURADORAS.concat('Otra (especificar)'), currentAseguradora);\n\n    const ramoSelect = document.getElementById('p_ramo_'+id);\n    const currentRamo = ramoSelect.value;\n    ramoSelect.innerHTML = '<option value=\"\">Selecciona...<\/option>' + buildOptions(RAMOS.concat('Otro (especificar)'), currentRamo);\n  });\n}\n\nfunction addPolizaRow(data){\n  polizaRowCount++;\n  const id = polizaRowCount;\n  const container = document.getElementById('polizaBody');\n  const card = document.createElement('div');\n  card.className = 'poliza-card';\n  card.id = 'polizaRow'+id;\n\n  const aseguradoraVal = data?.aseguradora || '';\n  const aseguradoraEsOtra = aseguradoraVal && !ASEGURADORAS.includes(aseguradoraVal);\n  const ramoVal = data?.ramo || '';\n  const ramoEsOtro = ramoVal && !RAMOS.includes(ramoVal);\n\n  card.innerHTML = `\n    <div class=\"poliza-card-header\">\n      <span>Póliza ${id}<\/span>\n      <button class=\"row-remove\" onclick=\"removePolizaRow(${id})\" title=\"Eliminar\">&times;<\/button>\n    <\/div>\n    <div class=\"row2\">\n      <div class=\"field\">\n        <label>No. de Póliza<\/label>\n        <input type=\"text\" id=\"p_poliza_${id}\" placeholder=\"AU-250221\" value=\"${data?.poliza||''}\">\n      <\/div>\n      <div class=\"field\">\n        <label>Aseguradora<\/label>\n        <select id=\"p_aseguradora_${id}\" onchange=\"onAseguradoraChange(${id})\">\n          <option value=\"\">Selecciona...<\/option>\n          ${buildOptions(ASEGURADORAS.concat('Otra (especificar)'), aseguradoraEsOtra ? 'Otra (especificar)' : aseguradoraVal)}\n        <\/select>\n        <input type=\"text\" id=\"p_aseguradora_otra_${id}\" placeholder=\"Nombre de la aseguradora\" value=\"${aseguradoraEsOtra ? aseguradoraVal : ''}\" style=\"margin-top:6px;${aseguradoraEsOtra?'':'display:none;'}\">\n      <\/div>\n    <\/div>\n    <div class=\"row2\">\n      <div class=\"field\">\n        <label>Ramo<\/label>\n        <select id=\"p_ramo_${id}\" onchange=\"onRamoChange(${id})\">\n          <option value=\"\">Selecciona...<\/option>\n          ${buildOptions(RAMOS.concat('Otro (especificar)'), ramoEsOtro ? 'Otro (especificar)' : ramoVal)}\n        <\/select>\n        <input type=\"text\" id=\"p_ramo_otro_${id}\" placeholder=\"Especifica el ramo\" value=\"${ramoEsOtro ? ramoVal : ''}\" style=\"margin-top:6px;${ramoEsOtro?'':'display:none;'}\">\n      <\/div>\n      <div class=\"field\">\n        <label>Factura<\/label>\n        <input type=\"text\" id=\"p_factura_${id}\" placeholder=\"3875475\" value=\"${data?.factura||''}\">\n      <\/div>\n    <\/div>\n    <div class=\"row2\">\n      <div class=\"field\">\n        <label>Vigencia desde<\/label>\n        <input type=\"date\" id=\"p_vigDesde_${id}\" value=\"${data?.vigDesde||''}\" onchange=\"onVigDesdeChange(${id})\">\n      <\/div>\n      <div class=\"field\">\n        <label>Vigencia hasta<\/label>\n        <input type=\"date\" id=\"p_vigHasta_${id}\" value=\"${data?.vigHasta||''}\" onchange=\"generarDocumento()\">\n      <\/div>\n    <\/div>\n    <div class=\"field field-monto\">\n      <label>Monto<\/label>\n      <input type=\"number\" step=\"0.01\" id=\"p_monto_${id}\" placeholder=\"0.00\" value=\"${data?.monto||''}\" onchange=\"generarDocumento()\">\n    <\/div>\n  `;\n  container.appendChild(card);\n}\n\nfunction removePolizaRow(id){\n  const row = document.getElementById('polizaRow'+id);\n  if(row) row.remove();\n  generarDocumento();\n}\n\n// ===== Plan de pago personalizado =====\nlet cuotaRowCount = 0;\n\nfunction onPlanTipoChange(){\n  const esPersonalizado = document.getElementById('planPersonalizado').checked;\n  document.getElementById('personalizadoBlock').classList.toggle('show', esPersonalizado);\n  document.getElementById('hintAutoFechas').style.display = esPersonalizado ? 'none' : '';\n  if(esPersonalizado && document.querySelectorAll('#cuotaBody .poliza-card').length === 0){\n    addCuotaRow();\n  }\n  generarDocumento();\n}\n\nfunction addCuotaRow(data){\n  cuotaRowCount++;\n  const id = cuotaRowCount;\n  const container = document.getElementById('cuotaBody');\n  const card = document.createElement('div');\n  card.className = 'poliza-card';\n  card.id = 'cuotaRow'+id;\n\n  card.innerHTML = `\n    <div class=\"poliza-card-header\">\n      <span>Cuota ${id}<\/span>\n      <button class=\"row-remove\" onclick=\"removeCuotaRow(${id})\" title=\"Eliminar\">&times;<\/button>\n    <\/div>\n    <div class=\"row2\">\n      <div class=\"field\">\n        <label>Descripción<\/label>\n        <input type=\"text\" id=\"c_desc_${id}\" placeholder=\"Ej. 1ER PAGO\" value=\"${data?.desc||''}\" onchange=\"generarDocumento()\">\n      <\/div>\n      <div class=\"field\">\n        <label>Fecha<\/label>\n        <input type=\"date\" id=\"c_fecha_${id}\" value=\"${data?.fecha||''}\" onchange=\"generarDocumento()\">\n      <\/div>\n    <\/div>\n    <div class=\"field field-monto\">\n      <label>Monto<\/label>\n      <input type=\"number\" step=\"0.01\" id=\"c_monto_${id}\" placeholder=\"0.00\" value=\"${data?.monto||''}\" onchange=\"generarDocumento()\">\n    <\/div>\n  `;\n  container.appendChild(card);\n  generarDocumento();\n}\n\nfunction removeCuotaRow(id){\n  const row = document.getElementById('cuotaRow'+id);\n  if(row) row.remove();\n  generarDocumento();\n}\n\nfunction getCuotasPersonalizadas(){\n  const rows = document.querySelectorAll('#cuotaBody .poliza-card');\n  const list = [];\n  rows.forEach(row=>{\n    const id = row.id.replace('cuotaRow','');\n    const desc = document.getElementById('c_desc_'+id).value.trim();\n    const monto = parseFloat(document.getElementById('c_monto_'+id).value) || 0;\n    const fechaVal = document.getElementById('c_fecha_'+id).value;\n    const fecha = fechaVal ? fmtDate(parseDateInput(fechaVal)) : '';\n    list.push({label: desc || ('PAGO '+id), monto, fecha});\n  });\n  return list;\n}\n\nfunction onAseguradoraChange(id){\n  const select = document.getElementById('p_aseguradora_'+id);\n  const otra = document.getElementById('p_aseguradora_otra_'+id);\n  const esOtra = select.value === 'Otra (especificar)';\n  otra.style.display = esOtra ? 'block' : 'none';\n  if(!esOtra) otra.value = '';\n  generarDocumento();\n}\n\nfunction onRamoChange(id){\n  const select = document.getElementById('p_ramo_'+id);\n  const otro = document.getElementById('p_ramo_otro_'+id);\n  const esOtro = select.value === 'Otro (especificar)';\n  otro.style.display = esOtro ? 'block' : 'none';\n  if(!esOtro) otro.value = '';\n  generarDocumento();\n}\n\nfunction addYears(date, n){\n  const d = new Date(date);\n  d.setFullYear(d.getFullYear()+n);\n  return d;\n}\n\nfunction toDateInputValue(d){\n  const y = d.getFullYear();\n  const m = String(d.getMonth()+1).padStart(2,'0');\n  const day = String(d.getDate()).padStart(2,'0');\n  return `${y}-${m}-${day}`;\n}\n\nfunction onVigDesdeChange(id){\n  const desdeVal = document.getElementById('p_vigDesde_'+id).value;\n  if(desdeVal){\n    const desde = parseDateInput(desdeVal);\n    const hasta = addYears(desde, 1);\n    document.getElementById('p_vigHasta_'+id).value = toDateInputValue(hasta);\n  }\n  generarDocumento();\n}\n\nfunction fmtMoney(n){\n  return n.toLocaleString('es-DO', {minimumFractionDigits:2, maximumFractionDigits:2});\n}\n\nfunction fmtDate(d){\n  return d.toLocaleDateString('es-DO', {day:'numeric', month:'numeric', year:'numeric'});\n}\n\nfunction parseDateInput(val){\n  return val ? new Date(val+'T00:00:00') : null;\n}\n\nfunction addMonths(date, n){\n  const d = new Date(date);\n  d.setMonth(d.getMonth()+n);\n  return d;\n}\nfunction addDays(date, n){\n  const d = new Date(date);\n  d.setDate(d.getDate()+n);\n  return d;\n}\n\nfunction getPolizas(){\n  const rows = document.querySelectorAll('#polizaBody .poliza-card');\n  const list = [];\n  rows.forEach(row=>{\n    const id = row.id.replace('polizaRow','');\n    const poliza = document.getElementById('p_poliza_'+id).value;\n    let aseguradora = document.getElementById('p_aseguradora_'+id).value;\n    if(aseguradora === 'Otra (especificar)'){\n      aseguradora = document.getElementById('p_aseguradora_otra_'+id).value;\n    }\n    let ramo = document.getElementById('p_ramo_'+id).value;\n    if(ramo === 'Otro (especificar)'){\n      ramo = document.getElementById('p_ramo_otro_'+id).value;\n    }\n    const factura = document.getElementById('p_factura_'+id).value;\n    const vigDesdeVal = document.getElementById('p_vigDesde_'+id).value;\n    const vigHastaVal = document.getElementById('p_vigHasta_'+id).value;\n    const monto = parseFloat(document.getElementById('p_monto_'+id).value) || 0;\n    let vigencia = '';\n    if(vigDesdeVal || vigHastaVal){\n      const desde = vigDesdeVal ? fmtDate(parseDateInput(vigDesdeVal)) : '—';\n      const hasta = vigHastaVal ? fmtDate(parseDateInput(vigHastaVal)) : '—';\n      vigencia = `${desde} - ${hasta}`;\n    }\n    if(poliza || aseguradora || monto){\n      list.push({poliza, aseguradora, ramo, factura, vigencia, vigDesdeVal, monto});\n    }\n  });\n  return list;\n}\n\nfunction getBaseVigenciaDate(polizas){\n  let earliest = null;\n  polizas.forEach(p=>{\n    if(p.vigDesdeVal){\n      const d = parseDateInput(p.vigDesdeVal);\n      if(!earliest || d < earliest) earliest = d;\n    }\n  });\n  if(earliest) return earliest;\n  const fa = document.getElementById('fechaAcuerdo').value;\n  return fa ? parseDateInput(fa) : new Date();\n}\n\nfunction calcularDistribucion(total, baseDate){\n  const moneda = document.querySelector('input[name=moneda]:checked').value;\n  const planTipo = document.querySelector('input[name=planTipo]:checked').value;\n\n  if(planTipo === 'unico'){\n    return {\n      moneda,\n      planLabel: 'Pago único',\n      cuotas: [{label:'PAGO ÚNICO', monto: total, fecha: fmtDate(baseDate)}]\n    };\n  }\n\n  if(planTipo === 'personalizado'){\n    return {\n      moneda,\n      planLabel: 'Personalizado',\n      cuotas: getCuotasPersonalizadas()\n    };\n  }\n\n  let pct = 0;\n  let planLabel = '';\n  if(planTipo === '4iguales'){ pct = 0; planLabel = '4 cuotas iguales'; }\n  if(planTipo === '25mas4'){ pct = 25; planLabel = '25% inicial + 4 cuotas iguales'; }\n  if(planTipo === '30mas4'){ pct = 30; planLabel = '30% inicial + 4 cuotas mensuales'; }\n\n  const nCuotas = 4;\n  const inicial = Math.round((total * pct / 100) * 100) / 100;\n  const restante = Math.round((total - inicial) * 100) / 100;\n  const cuotaBase = Math.floor((restante / nCuotas) * 100) / 100;\n\n  const cuotas = [];\n  if(pct > 0){\n    cuotas.push({label:pct+'% INICIAL', monto: inicial, fecha: fmtDate(baseDate)});\n  }\n\n  let acumulado = inicial;\n  for(let i=1;i<=nCuotas;i++){\n    let montoCuota = cuotaBase;\n    if(i === nCuotas){\n      montoCuota = Math.round((total - acumulado) * 100) / 100;\n    } else {\n      acumulado = Math.round((acumulado + cuotaBase) * 100) / 100;\n    }\n    const mesesOffset = pct > 0 ? i : (i - 1);\n    const fecha = addMonths(baseDate, mesesOffset);\n    cuotas.push({label:'CUOTA '+i, monto: montoCuota, fecha: fmtDate(fecha)});\n  }\n\n  return {moneda, planLabel, cuotas};\n}\n\nfunction generarDocumento(){\n  const polizas = getPolizas();\n  const total = polizas.reduce((s,p)=>s+p.monto, 0);\n  const baseDate = getBaseVigenciaDate(polizas);\n  const dist = calcularDistribucion(total, baseDate);\n  const moneda = dist.moneda;\n\n  const fechaAcuerdo = document.getElementById('fechaAcuerdo').value\n    ? fmtDate(new Date(document.getElementById('fechaAcuerdo').value+'T00:00:00'))\n    : fmtDate(new Date());\n  const gestor = document.getElementById('gestor').value;\n\n  const cliCodigo = document.getElementById('clienteCodigo').value;\n  const cliNombre = document.getElementById('clienteNombre').value || 'Nombre del cliente';\n  const cliTelefono = document.getElementById('clienteTelefono').value;\n  const cliEmail = document.getElementById('clienteEmail').value;\n\n  const observaciones = document.getElementById('observaciones').value;\n  const notas = document.getElementById('notasImportantes').value;\n\n  let polizasRows = polizas.map(p=>`\n    <tr>\n      <td>${p.poliza}<\/td>\n      <td>${p.aseguradora}<\/td>\n      <td>${p.ramo}<\/td>\n      <td>${p.factura}<\/td>\n      <td>${p.vigencia}<\/td>\n      <td class=\"num\">${fmtMoney(p.monto)}<\/td>\n    <\/tr>`).join('');\n\n  if(polizas.length === 0){\n    polizasRows = `<tr><td colspan=\"6\" class=\"empty-hint\">Agrega al menos una póliza en el formulario<\/td><\/tr>`;\n  }\n\n  let cuotasRows = dist.cuotas.map(c=>`\n    <tr>\n      <td>${c.label}<\/td>\n      <td class=\"dist-monto\">${moneda} ${fmtMoney(c.monto)}<\/td>\n      <td class=\"dist-center\">${c.fecha}<\/td>\n    <\/tr>`).join('');\n\n  const html = `\n    <div class=\"doc-header\">\n      <div class=\"doc-brand\">\n        <img class=\"doc-logo\" src=\"data:image/png;base64,${LOGO_B64}\" alt=\"CORREPLUS Corredores de Seguros\">\n      <\/div>\n      <div class=\"doc-meta-right\">\n        <div>RNC 133-421003<\/div>\n        <div>Ave. De Las Hortensias No. 24, Bonao<\/div>\n        <div>Tel. (809) 296-6500 · info@correplus.com.do<\/div>\n        <div class=\"doc-meta-fecha\">FECHA: <b>${fechaAcuerdo}<\/b><\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"doc-title\">ACUERDO DE PAGO<\/div>\n\n    <div class=\"doc-clientbox\">\n      <div class=\"kv\"><span class=\"k\">Cliente<\/span><span class=\"v client-name\">${cliCodigo ? cliCodigo+' — ' : ''}${cliNombre}<\/span><\/div>\n      <div class=\"kv\"><span class=\"k\">Gestor<\/span><span class=\"v\">${gestor || '—'}<\/span><\/div>\n      <div class=\"kv\"><span class=\"k\">Teléfono<\/span><span class=\"v\">${cliTelefono || '—'}<\/span><\/div>\n      <div class=\"kv\"><span class=\"k\">Email<\/span><span class=\"v\">${cliEmail || '—'}<\/span><\/div>\n    <\/div>\n\n    <div class=\"doc-options\">\n      <div class=\"opt\">Tipo de acuerdo: <b>${dist.planLabel}<\/b><\/div>\n      <div class=\"opt\">Moneda: <b>${moneda}<\/b><\/div>\n    <\/div>\n\n    <table class=\"doc-table\">\n      <thead>\n        <tr><th>Póliza<\/th><th>Aseguradora<\/th><th>Ramo<\/th><th>Factura<\/th><th>Vigencia<\/th><th class=\"num\">Monto<\/th><\/tr>\n      <\/thead>\n      <tbody>${polizasRows}<\/tbody>\n      <tfoot>\n        <tr><td colspan=\"5\">TOTAL<\/td><td class=\"num\">${moneda} ${fmtMoney(total)}<\/td><\/tr>\n      <\/tfoot>\n    <\/table>\n\n    <div class=\"doc-dist-title\">DISTRIBUCIÓN DE PAGOS<\/div>\n    <table class=\"doc-dist\">\n      <thead><tr><th>Cuota<\/th><th class=\"dist-center\">Monto<\/th><th class=\"dist-center\">Fecha<\/th><\/tr><\/thead>\n      <tbody>${cuotasRows}<\/tbody>\n      <tfoot><tr><td>TOTAL A PAGAR<\/td><td class=\"dist-monto\">${moneda} ${fmtMoney(total)}<\/td><td class=\"dist-center\">—<\/td><\/tr><\/tfoot>\n    <\/table>\n    <div class=\"doc-legal\">** Los plazos de pago están sujetos a los artículos 73 y 75 de la Ley 146-02 sobre Seguros y Fianzas de la República Dominicana.<\/div>\n\n    ${observaciones ? `\n    <div class=\"doc-obs\">\n      <span class=\"lbl\">Observaciones<\/span>\n      ${observaciones}\n    <\/div>` : ''}\n\n    <div class=\"doc-notas\"><b>Notas importantes:<\/b><br>${notas.replace(/\\n/g,'<br>')}<\/div>\n\n    <div class=\"doc-signatures\">\n      <div class=\"sig-line\">POR EL CLIENTE<\/div>\n      <div class=\"sig-line\">POR EL CORREDOR / ASESOR<\/div>\n    <\/div>\n  `;\n\n  document.getElementById('documento').innerHTML = html;\n  document.getElementById('totalPreviewLabel').textContent = 'Total: ' + moneda + ' ' + fmtMoney(total);\n}\n\nfunction limpiarFormulario(){\n  document.querySelectorAll('.panel input[type=text], .panel input[type=email], .panel input[type=number]').forEach(i=>i.value='');\n  document.getElementById('polizaBody').innerHTML='';\n  polizaRowCount = 0;\n  addPolizaRow();\n  document.getElementById('cuotaBody').innerHTML='';\n  cuotaRowCount = 0;\n  document.getElementById('monRD').checked = true;\n  document.getElementById('planUnico').checked = true;\n  onPlanTipoChange();\n  document.getElementById('notasImportantes').value = \"Máximo 10 días a partir del inicio de vigencia de las pólizas para el pago inicial (Art. 75, Ley 146-02).\\nMáximo 120 días a partir del inicio de vigencia de la(s) póliza(s) para el pago total (Art. 73, Ley 146-02).\";\n  document.getElementById('observaciones').value='';\n  document.getElementById('fechaAcuerdo').valueAsDate = new Date();\n  generarDocumento();\n}\n\n// Nombre de archivo al Imprimir / Guardar PDF\nconst TITULO_ORIGINAL = document.title;\nwindow.addEventListener('beforeprint', function(){\n  document.title = 'ACUERDO DE PAGO CORREPLUS';\n});\nwindow.addEventListener('afterprint', function(){\n  document.title = TITULO_ORIGINAL;\n});\n\n// Inicialización\nwindow.onload = function(){\n  loadConfig();\n  renderConfigLists();\n  document.getElementById('fechaAcuerdo').valueAsDate = new Date();\n  addPolizaRow();\n\n  // Vista previa en vivo: cualquier tecla o cambio en el formulario actualiza el documento\n  const formTab = document.getElementById('tabGenerador');\n  formTab.addEventListener('input', generarDocumento);\n  formTab.addEventListener('change', generarDocumento);\n\n  generarDocumento();\n};\n<\/script>\n\n<\/body>\n<\/html>\n", "recibo": "<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"UTF-8\">\n<title>Recibo de Pago - CORREPLUS<\/title>\n<style>\n  @import url('https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap');\n\n  :root{\n    --teal-dark:#0C6970;\n    --teal-light:#37B8C2;\n    --ink-stamp:#1a3d8f;\n    --ink:#1c2b2c;\n    --paper:#ffffff;\n    --line:#dbe7e8;\n  }\n\n  *{box-sizing:border-box;}\n  body{\n    font-family:'Barlow',Arial,sans-serif;\n    background:#eef3f3;\n    margin:0;\n    padding:20px;\n    color:var(--ink);\n  }\n\n  .toolbar{\n    max-width:650px;\n    margin:0 auto 12px auto;\n    display:flex;\n    justify-content:flex-end;\n    gap:8px;\n  }\n  .toolbar button{\n    font-family:'Barlow',Arial,sans-serif;\n    font-weight:600;\n    font-size:14px;\n    padding:9px 16px;\n    border-radius:8px;\n    border:none;\n    cursor:pointer;\n  }\n  #printBtn{background:var(--teal-dark);color:#fff;}\n  #resetBtn{background:#fff;color:var(--teal-dark);border:1.5px solid var(--teal-dark) !important;}\n\n  .receipt{\n    max-width:650px;\n    margin:0 auto;\n    background:var(--paper);\n    border-radius:14px;\n    box-shadow:0 4px 18px rgba(12,105,112,0.12);\n    overflow:hidden;\n    border:1px solid var(--line);\n  }\n\n  .head{\n    background:#ffffff;\n    padding:22px 28px 0 28px;\n  }\n  .head-top{\n    display:flex;\n    justify-content:space-between;\n    align-items:flex-start;\n    padding-bottom:18px;\n  }\n  .head-top .contact{\n    text-align:right;\n    font-size:11px;\n    line-height:1.6;\n    color:#5b7677;\n  }\n  .head-bar{\n    background:var(--teal-dark);\n    color:#fff;\n    padding:10px 28px;\n    display:flex;\n    justify-content:space-between;\n    align-items:center;\n  }\n  .head-bar .title{\n    font-size:15px;\n    font-weight:700;\n    letter-spacing:1px;\n    text-transform:uppercase;\n  }\n  .head-bar .rnc{\n    font-size:11px;\n    opacity:.85;\n  }\n\n  .body{padding:26px 28px 10px 28px;}\n\n  .row{\n    display:flex;\n    gap:16px;\n    margin-bottom:16px;\n  }\n  .field{flex:1;}\n  label{\n    display:block;\n    font-size:11.5px;\n    font-weight:600;\n    text-transform:uppercase;\n    letter-spacing:.4px;\n    color:var(--teal-dark);\n    margin-bottom:5px;\n  }\n  input, select{\n    width:100%;\n    font-family:'Barlow',Arial,sans-serif;\n    font-size:15px;\n    padding:9px 10px;\n    border:1.5px solid var(--line);\n    border-radius:8px;\n    color:var(--ink);\n    background:#fbfdfd;\n  }\n  select{\n    -webkit-appearance:none;\n    -moz-appearance:none;\n    appearance:none;\n    padding-right:32px;\n    background-image:url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9' viewBox='0 0 14 9'><path d='M1 1l6 6 6-6' fill='none' stroke='%230C6970' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/><\/svg>\");\n    background-repeat:no-repeat;\n    background-position:right 12px center;\n  }\n  input:focus, select:focus{\n    outline:none;\n    border-color:var(--teal-light);\n  }\n\n  .currency-input{\n    position:relative;\n  }\n  .currency-input .prefix{\n    position:absolute;\n    left:11px;\n    top:50%;\n    transform:translateY(-50%);\n    font-weight:700;\n    color:var(--teal-dark);\n    pointer-events:none;\n    font-size:15px;\n  }\n  .currency-input input{\n    padding-left:46px;\n  }\n\n  .amount-box{\n    background:#f3fafa;\n    border:1.5px dashed var(--teal-light);\n    border-radius:10px;\n    padding:16px 18px;\n    margin:6px 0 20px 0;\n  }\n  .amount-box .amount-title{\n    font-size:11.5px;\n    font-weight:700;\n    text-transform:uppercase;\n    letter-spacing:.4px;\n    color:var(--teal-dark);\n    margin-bottom:12px;\n  }\n  .amount-box .field{\n    margin-bottom:14px;\n    padding-bottom:14px;\n    border-bottom:1px dashed var(--line);\n  }\n  .amount-box .letras{\n    font-size:14px;\n    font-weight:600;\n    color:var(--teal-dark);\n    text-transform:capitalize;\n    min-height:20px;\n    margin-top:6px;\n  }\n\n  .signature{\n    margin-top:26px;\n    display:flex;\n    justify-content:space-between;\n    align-items:flex-end;\n    padding-bottom:10px;\n  }\n  .signature .line{\n    border-top:1.5px solid var(--ink);\n    width:220px;\n    text-align:center;\n    font-size:12px;\n    padding-top:6px;\n    color:#555;\n  }\n  .signature .stamp{\n    font-size:11px;\n    color:#888;\n    text-align:right;\n  }\n\n  .footer{\n    background:#f6f9f9;\n    padding:12px 28px;\n    font-size:11px;\n    color:#7a8a8b;\n    text-align:center;\n    border-top:1px solid var(--line);\n  }\n\n  .logo{\n    height:46px;\n    display:block;\n  }\n\n  .seal-wrap{\n    position:relative;\n    height:0;\n  }\n  .seal{\n    position:absolute;\n    right:28px;\n    top:-118px;\n    width:138px;\n    height:138px;\n    border-radius:50%;\n    border:3px solid var(--ink-stamp);\n    display:flex;\n    align-items:center;\n    justify-content:center;\n    transform:rotate(-14deg);\n    opacity:0;\n    pointer-events:none;\n    mix-blend-mode:multiply;\n    transition:opacity .2s;\n  }\n  .seal.show{opacity:.82;}\n  .seal::before{\n    content:'';\n    position:absolute;\n    inset:7px;\n    border:1.5px solid var(--ink-stamp);\n    border-radius:50%;\n  }\n  .seal-inner{\n    text-align:center;\n    color:var(--ink-stamp);\n    line-height:1.2;\n  }\n  .seal-inner .brand{\n    font-size:8px;\n    font-weight:700;\n    letter-spacing:.8px;\n    text-transform:uppercase;\n  }\n  .seal-inner .status{\n    font-size:17px;\n    font-weight:800;\n    letter-spacing:2px;\n    margin:3px 0;\n  }\n  .seal-inner .rnc{\n    font-size:7.5px;\n    font-weight:600;\n    letter-spacing:.3px;\n  }\n  .seal-inner .date{\n    font-size:8px;\n    font-weight:600;\n    margin-top:2px;\n  }\n  .seal-toggle{\n    display:flex;\n    align-items:center;\n    gap:6px;\n    font-size:13px;\n    font-weight:600;\n    color:var(--teal-dark);\n    margin-right:auto;\n    user-select:none;\n  }\n  .seal-toggle input{width:auto;padding:0;}\n\n  @media print{\n    html, body{\n      background:#fff;\n      padding:0;\n      -webkit-print-color-adjust:exact;\n      print-color-adjust:exact;\n      color-adjust:exact;\n    }\n    .toolbar{display:none;}\n    .receipt{box-shadow:none;border:none;max-width:100%;}\n    .head{\n      -webkit-print-color-adjust:exact;\n      print-color-adjust:exact;\n      color-adjust:exact;\n    }\n    input, select{\n      border:none;\n      border-bottom:1px solid var(--line);\n      padding:2px 0;\n      background:transparent;\n      background-image:none;\n      color:var(--ink);\n      font-weight:600;\n      -webkit-appearance:none;\n      -moz-appearance:none;\n      appearance:none;\n    }\n    .currency-input input{padding-left:32px;}\n    .currency-input .prefix{left:0;}\n    label{color:var(--teal-dark);}\n    input[type=\"date\"]::-webkit-calendar-picker-indicator{\n      display:none;\n      -webkit-appearance:none;\n    }\n    input[type=\"date\"]{\n      -webkit-appearance:none;\n      appearance:none;\n    }\n  }\n<\/style>\n<\/head>\n<body>\n\n<div class=\"toolbar\">\n  <label class=\"seal-toggle\">\n    <input type=\"checkbox\" id=\"selloCheck\" checked onchange=\"actualizarSello()\">\n    Incluir sello digital\n  <\/label>\n  <button id=\"resetBtn\" onclick=\"resetForm()\">Limpiar<\/button>\n  <button id=\"printBtn\" onclick=\"window.print()\">Imprimir / Guardar PDF<\/button>\n<\/div>\n\n<div class=\"receipt\">\n  <div class=\"head\">\n    <div class=\"head-top\">\n      <img class=\"logo\" src=\"data:image/png;base64,@@IMG0@@\" alt=\"CORREPLUS\">\n      <div class=\"contact\">\n        Ave. De Las Hortensias No. 24, Bonao<br>\n        Tel: (809) 296-6500<br>\n        info@correplus.com.do\n      <\/div>\n    <\/div>\n  <\/div>\n  <div class=\"head-bar\">\n    <span class=\"title\">Recibo de pago<\/span>\n    <span class=\"rnc\">RNC 133-421003<\/span>\n  <\/div>\n\n  <div class=\"body\">\n    <div class=\"row\">\n      <div class=\"field\">\n        <label>Fecha<\/label>\n        <input type=\"date\" id=\"fecha\" onchange=\"actualizarSello()\">\n      <\/div>\n      <div class=\"field\">\n        <label>Número de póliza<\/label>\n        <input type=\"text\" id=\"poliza\" placeholder=\"Ej. 000-000000\">\n      <\/div>\n    <\/div>\n\n    <div class=\"row\">\n      <div class=\"field\">\n        <label>Recibí de:<\/label>\n        <input type=\"text\" id=\"cliente\" placeholder=\"Nombre completo\">\n      <\/div>\n    <\/div>\n\n    <div class=\"row\">\n      <div class=\"field\">\n        <label>Aseguradora<\/label>\n        <select id=\"aseguradora\">\n          <option value=\"\">Seleccionar...<\/option>\n          <option>Seguros Universal<\/option>\n          <option>Mapfre BHD<\/option>\n          <option>Seguros Reservas<\/option>\n          <option>Seguros Sura<\/option>\n          <option>Seguros Banreservas<\/option>\n          <option>La Colonial de Seguros<\/option>\n          <option>Seguros Pepín<\/option>\n          <option>Seguros Constitución<\/option>\n          <option>Atlántica Seguros<\/option>\n          <option>Seguros Ademi<\/option>\n          <option>Humano Seguros<\/option>\n          <option>Otra<\/option>\n        <\/select>\n      <\/div>\n      <div class=\"field\">\n        <label>Método de pago<\/label>\n        <select id=\"metodo\" onchange=\"toggleBanco()\">\n          <option value=\"\">Seleccionar...<\/option>\n          <option>Transferencia bancaria<\/option>\n          <option>Depósito bancario<\/option>\n          <option>Efectivo<\/option>\n        <\/select>\n      <\/div>\n    <\/div>\n\n    <div class=\"amount-box\">\n      <div class=\"amount-title\">Monto cobrado<\/div>\n      <div class=\"field\">\n        <div class=\"currency-input\">\n          <span class=\"prefix\">RD$<\/span>\n          <input type=\"text\" inputmode=\"decimal\" id=\"monto\" placeholder=\"0.00\"\n                 oninput=\"actualizarLetras()\" onfocus=\"desformatearMonto()\" onblur=\"formatearMonto()\">\n        <\/div>\n      <\/div>\n      <label style=\"margin-bottom:4px;\">Monto en letras<\/label>\n      <div class=\"letras\" id=\"montoLetras\">—<\/div>\n    <\/div>\n\n    <div class=\"row\" id=\"bancoRow\" style=\"display:none;\">\n      <div class=\"field\">\n        <label>Banco<\/label>\n        <input type=\"text\" id=\"banco\" placeholder=\"Nombre del banco\">\n      <\/div>\n      <div class=\"field\">\n        <label>No. de cuenta<\/label>\n        <input type=\"text\" id=\"cuenta\" placeholder=\"Número de cuenta\">\n      <\/div>\n    <\/div>\n\n    <div class=\"seal-wrap\">\n      <div class=\"seal show\" id=\"sello\">\n        <div class=\"seal-inner\">\n          <div class=\"brand\">CORREPLUS SRL<\/div>\n          <div class=\"status\">PAGADO<\/div>\n          <div class=\"rnc\">RNC 133-421003<\/div>\n          <div class=\"date\" id=\"selloFecha\">—<\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"signature\">\n      <div class=\"line\">Recibido por (CORREPLUS)<\/div>\n      <div class=\"stamp\">Este recibo confirma la recepción<br>del pago indicado arriba.<\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"footer\">\n    CORREPLUS Corredores de Seguros SRL &nbsp;•&nbsp; Ave. De Las Hortensias No. 24, Bonao<br>\n    Tel: (809) 296-6500 &nbsp;•&nbsp; info@correplus.com.do\n  <\/div>\n<\/div>\n\n<script>\nfunction resetForm(){\n  document.querySelectorAll('input').forEach(i=>i.value='');\n  document.getElementById('aseguradora').value='';\n  document.getElementById('metodo').value='';\n  document.getElementById('montoLetras').textContent='—';\n  toggleBanco();\n  document.getElementById('fecha').valueAsDate = new Date();\n  actualizarSello();\n}\n\nfunction toggleBanco(){\n  const val = document.getElementById('metodo').value;\n  const row = document.getElementById('bancoRow');\n  if(val === 'Transferencia bancaria' || val === 'Depósito bancario'){\n    row.style.display = 'flex';\n  } else {\n    row.style.display = 'none';\n    document.getElementById('banco').value = '';\n    document.getElementById('cuenta').value = '';\n  }\n}\n\nfunction actualizarSello(){\n  const sello = document.getElementById('sello');\n  const incluir = document.getElementById('selloCheck').checked;\n  const fechaVal = document.getElementById('fecha').value;\n  if(fechaVal){\n    const [y, m, d] = fechaVal.split('-');\n    document.getElementById('selloFecha').textContent = `${d}/${m}/${y}`;\n  } else {\n    document.getElementById('selloFecha').textContent = '—';\n  }\n  sello.classList.toggle('show', incluir);\n}\n\nconst UNIDADES = ['', 'un', 'dos', 'tres', 'cuatro', 'cinco', 'seis', 'siete', 'ocho', 'nueve'];\nconst DECENAS = ['diez', 'once', 'doce', 'trece', 'catorce', 'quince', 'dieciséis', 'diecisiete', 'dieciocho', 'diecinueve'];\nconst DECENAS2 = ['', '', 'veinte', 'treinta', 'cuarenta', 'cincuenta', 'sesenta', 'setenta', 'ochenta', 'noventa'];\nconst CENTENAS = ['', 'ciento', 'doscientos', 'trescientos', 'cuatrocientos', 'quinientos', 'seiscientos', 'setecientos', 'ochocientos', 'novecientos'];\n\nfunction tresDigitos(n){\n  n = parseInt(n);\n  if(n === 0) return '';\n  if(n === 100) return 'cien';\n  let c = Math.floor(n/100), r = n%100, out = '';\n  if(c>0) out += CENTENAS[c] + ' ';\n  if(r>0){\n    if(r<10) out += UNIDADES[r];\n    else if(r<20) out += DECENAS[r-10];\n    else{\n      let d = Math.floor(r/10), u = r%10;\n      out += DECENAS2[d];\n      if(u>0) out += ' y ' + UNIDADES[u];\n    }\n  }\n  return out.trim();\n}\n\nfunction numeroALetras(num){\n  num = Math.floor(num);\n  if(num === 0) return 'cero';\n  let partes = [];\n  let millones = Math.floor(num/1000000);\n  let miles = Math.floor((num%1000000)/1000);\n  let resto = num%1000;\n\n  if(millones>0){\n    partes.push(millones===1 ? 'un millón' : tresDigitos(millones)+' millones');\n  }\n  if(miles>0){\n    partes.push(miles===1 ? 'mil' : tresDigitos(miles)+' mil');\n  }\n  if(resto>0){\n    partes.push(tresDigitos(resto));\n  }\n  return partes.join(' ').trim();\n}\n\nfunction leerMonto(){\n  const raw = document.getElementById('monto').value.replace(/,/g, '');\n  return parseFloat(raw);\n}\n\nfunction leerNumero(id){\n  const raw = document.getElementById(id).value.replace(/,/g, '');\n  return parseFloat(raw);\n}\n\nfunction formatearCampo(id){\n  const campo = document.getElementById(id);\n  const val = leerNumero(id);\n  if(!isNaN(val) && val>=0){\n    campo.value = val.toLocaleString('es-DO', {minimumFractionDigits:2, maximumFractionDigits:2});\n  }\n}\n\nfunction desformatearCampo(id){\n  const campo = document.getElementById(id);\n  const val = leerNumero(id);\n  if(!isNaN(val)){\n    campo.value = val;\n  }\n}\n\nfunction formatearMonto(){ formatearCampo('monto'); }\nfunction desformatearMonto(){ desformatearCampo('monto'); }\n\nfunction actualizarLetras(){\n  const val = leerMonto();\n  const el = document.getElementById('montoLetras');\n  if(isNaN(val) || val<0){ el.textContent = '—'; return; }\n  const entero = Math.floor(val);\n  const centavos = Math.round((val - entero)*100);\n  let texto = numeroALetras(entero) + ' pesos dominicanos';\n  if(centavos>0) texto += ' con ' + centavos + '/100';\n  el.textContent = texto.charAt(0).toUpperCase() + texto.slice(1);\n}\n\n// fecha por defecto: hoy\ndocument.getElementById('fecha').valueAsDate = new Date();\nactualizarSello();\n<\/script>\n\n<\/body>\n<\/html>\n", "matriz-riesgo": "<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"UTF-8\">\n<title>Matriz de Riesgo de Clientes — CORREPLUS<\/title>\n<style>\n  :root{\n    --navy:#173b5e;\n    --navy-2:#2c5a86;\n    --steel:#5b7a99;\n    --paper:#f6f7f9;\n    --card:#ffffff;\n    --line:#d9e0e7;\n    --ink:#1c2733;\n    --muted:#6b7885;\n    --bajo:#3a8f5b;\n    --bajo-bg:#e3f3e9;\n    --medio:#b8860b;\n    --medio-bg:#fbf0d6;\n    --alto:#b23a3a;\n    --alto-bg:#fbe3e3;\n    --amber:#fff6df;\n  }\n  *{\n    box-sizing:border-box;\n    -webkit-print-color-adjust:exact;\n    print-color-adjust:exact;\n    color-adjust:exact;\n  }\n  body{\n    margin:0;\n    font-family:\"Segoe UI\",\"Helvetica Neue\",Arial,sans-serif;\n    background:var(--paper);\n    color:var(--ink);\n  }\n  header.top{\n    background:linear-gradient(135deg,var(--navy),var(--navy-2));\n    color:#fff;\n    padding:22px 32px;\n  }\n  header.top .brand{\n    font-size:13px;\n    letter-spacing:.04em;\n    opacity:.85;\n    margin-bottom:4px;\n  }\n  header.top h1{\n    margin:0;\n    font-size:22px;\n    font-weight:600;\n  }\n  header.top p{\n    margin:6px 0 0;\n    font-size:13px;\n    opacity:.85;\n    max-width:640px;\n    line-height:1.5;\n  }\n  main{\n    max-width:1180px;\n    margin:0 auto;\n    padding:28px 32px 60px;\n    display:grid;\n    grid-template-columns:1.4fr 1fr;\n    gap:22px;\n  }\n  @media (max-width:900px){\n    main{grid-template-columns:1fr;}\n  }\n  .card{\n    background:var(--card);\n    border:1px solid var(--line);\n    border-radius:6px;\n    padding:20px 22px;\n    margin-bottom:20px;\n  }\n  .card h2{\n    font-size:14px;\n    text-transform:none;\n    letter-spacing:.01em;\n    color:var(--navy);\n    margin:0 0 14px;\n    padding-bottom:10px;\n    border-bottom:2px solid var(--navy);\n    display:flex;\n    align-items:baseline;\n    justify-content:space-between;\n  }\n  .card h2 span.tag{\n    font-size:11px;\n    font-weight:400;\n    color:var(--muted);\n  }\n  .grid2{\n    display:grid;\n    grid-template-columns:1fr 1fr;\n    gap:14px 18px;\n  }\n  .grid3{\n    display:grid;\n    grid-template-columns:1fr 1fr 1fr;\n    gap:14px 18px;\n  }\n  .field{display:flex; flex-direction:column; gap:5px;}\n  .field label{\n    font-size:11.5px;\n    color:var(--muted);\n    font-weight:600;\n  }\n  .field .hint{\n    font-size:10.5px;\n    color:var(--steel);\n    font-weight:400;\n    margin-top:-2px;\n  }\n  input,select{\n    font-family:inherit;\n    font-size:13.5px;\n    padding:8px 9px;\n    border:1px solid var(--line);\n    border-radius:4px;\n    background:#fcfdfe;\n    color:var(--ink);\n  }\n  input:focus,select:focus{\n    outline:2px solid var(--navy-2);\n    outline-offset:1px;\n    border-color:var(--navy-2);\n  }\n  .factor-row{\n    display:grid;\n    grid-template-columns:1fr 130px 60px;\n    gap:10px;\n    align-items:end;\n    padding:11px 0;\n    border-bottom:1px dashed var(--line);\n  }\n  .factor-row:last-of-type{border-bottom:none;}\n  .factor-row .weight{\n    font-size:11px;\n    color:var(--steel);\n    text-align:right;\n    padding-bottom:9px;\n  }\n  .factor-row .score-pill{\n    text-align:center;\n    font-weight:700;\n    font-size:13px;\n    padding:7px 0;\n    border-radius:4px;\n    background:#eef1f4;\n    color:var(--navy);\n  }\n  aside .card{position:sticky; top:20px;}\n  .result-level{\n    display:flex;\n    align-items:center;\n    justify-content:space-between;\n    padding:11px 14px;\n    border-radius:6px;\n    margin-bottom:12px;\n  }\n  .result-level .lvl-label{\n    font-size:12px;\n    letter-spacing:.03em;\n    color:var(--muted);\n  }\n  .result-level .lvl-value{\n    font-size:19px;\n    font-weight:700;\n  }\n  .result-level.bajo{background:var(--bajo-bg);}\n  .result-level.bajo .lvl-value{color:var(--bajo);}\n  .result-level.medio{background:var(--medio-bg);}\n  .result-level.medio .lvl-value{color:var(--medio);}\n  .result-level.alto{background:var(--alto-bg);}\n  .result-level.alto .lvl-value{color:var(--alto);}\n  .result-meta{\n    display:grid;\n    grid-template-columns:1fr 1fr;\n    gap:10px;\n    font-size:12px;\n    margin-bottom:16px;\n  }\n  .result-meta div{\n    background:#f2f4f6;\n    border-radius:4px;\n    padding:9px 10px;\n  }\n  .result-meta .k{color:var(--muted); font-size:10.5px; display:block; margin-bottom:2px;}\n  .result-meta .v{font-weight:600;}\n  .bars{display:flex; flex-direction:column; gap:8px; margin-top:4px;}\n  .bar-row{display:grid; grid-template-columns:120px 1fr 26px; align-items:center; gap:8px; font-size:11px;}\n  .bar-row .name{color:var(--muted);}\n  .bar-track{background:#eef1f4; border-radius:3px; height:9px; overflow:hidden;}\n  .bar-fill{height:100%; border-radius:3px; background:var(--navy-2);}\n  .bar-row .val{text-align:right; color:var(--ink); font-weight:600;}\n  .actions{\n    display:flex;\n    gap:10px;\n    margin-top:6px;\n  }\n  button{\n    font-family:inherit;\n    font-size:13px;\n    font-weight:600;\n    padding:11px 16px;\n    border-radius:5px;\n    border:1px solid transparent;\n    cursor:pointer;\n  }\n  button.primary{background:var(--navy); color:#fff;}\n  button.primary:hover{background:var(--navy-2);}\n  button.ghost{background:#fff; border-color:var(--line); color:var(--ink);}\n  button.ghost:hover{border-color:var(--steel);}\n  .note{\n    font-size:11px;\n    color:var(--muted);\n    line-height:1.5;\n    margin-top:10px;\n  }\n  footer.foot{\n    text-align:center;\n    font-size:11px;\n    color:var(--muted);\n    padding:0 32px 40px;\n  }\n\n  /* ---------------- HOJA IMPRIMIBLE ---------------- */\n  #printSheet{display:none;}\n  @media print{\n    header.top, main, footer.foot{display:none !important;}\n    #printSheet{display:block;}\n    @page{ size:letter portrait; margin:14mm; }\n    body{background:#fff;}\n  }\n  .ps-header{\n    display:flex;\n    justify-content:space-between;\n    align-items:flex-end;\n    border-bottom:3px solid var(--navy);\n    padding-bottom:10px;\n    margin-bottom:16px;\n  }\n  .ps-header h1{font-size:17px; margin:0; color:var(--navy);}\n  .ps-header .sub{font-size:11px; color:var(--muted); margin-top:3px;}\n  .ps-header .date{font-size:11px; color:var(--muted); text-align:right;}\n  .ps-section{margin-bottom:14px;}\n  .ps-section h3{\n    font-size:11px;\n    text-transform:uppercase;\n    letter-spacing:.05em;\n    color:#fff;\n    background:var(--navy-2);\n    margin:0 0 8px;\n    padding:5px 9px;\n    border-radius:3px;\n  }\n  .ps-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px 16px;}\n  .ps-grid.cols3{grid-template-columns:1fr 1fr 1fr;}\n  .ps-item .k{font-size:9.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em;}\n  .ps-item .v{font-size:12.5px; border-bottom:1px solid var(--line); padding:3px 2px 5px;}\n  .ps-section h3.ps-result-title{\n    font-size:14px;\n    text-transform:none;\n    letter-spacing:normal;\n    color:var(--navy);\n    background:none;\n    margin:0 0 14px;\n    padding:0 0 8px;\n    border-radius:0;\n    border-bottom:2px solid var(--navy);\n    font-weight:600;\n  }\n  .ps-sign{\n    display:grid;\n    grid-template-columns:1fr 1fr;\n    gap:30px;\n    margin-top:34px;\n  }\n  .ps-sign div{border-top:1px solid var(--ink); padding-top:6px; font-size:11px; text-align:center; color:var(--muted);}\n  .ps-foot{margin-top:20px; font-size:9.5px; color:var(--muted); text-align:center;}\n<\/style>\n<\/head>\n<body>\n\n<header class=\"top\">\n  <div class=\"brand\">CORREPLUS CORREDORES DE SEGUROS SRL<\/div>\n  <h1>Matriz de riesgo de clientes — Prevención de Lavado de Activos (Ley 155-17)<\/h1>\n  <p>Complete los campos del cliente. El nivel de riesgo se calcula al instante; nada se guarda —\n  al terminar, use \"Imprimir / Guardar como PDF\" para generar la ficha del expediente.<\/p>\n<\/header>\n\n<main>\n  <div>\n    <div class=\"card\">\n      <h2>Datos del cliente<\/h2>\n      <div class=\"grid2\">\n        <div class=\"field\">\n          <label for=\"nombre\">Nombre / Razón social<\/label>\n          <input id=\"nombre\" type=\"text\" placeholder=\"Nombre completo o razón social\">\n        <\/div>\n        <div class=\"field\">\n          <label for=\"tipoDoc\">Tipo de documento<\/label>\n          <select id=\"tipoDoc\">\n            <option>Cédula<\/option>\n            <option>RNC<\/option>\n            <option>Pasaporte<\/option>\n          <\/select>\n        <\/div>\n        <div class=\"field\">\n          <label for=\"numDoc\">Número de documento<\/label>\n          <input id=\"numDoc\" type=\"text\" placeholder=\"000-0000000-0\">\n        <\/div>\n        <div class=\"field\">\n          <label for=\"fechaEval\">Fecha de evaluación<\/label>\n          <input id=\"fechaEval\" type=\"date\">\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"card\">\n      <h2>Factores de riesgo PLA/FT <span class=\"tag\">determinan el puntaje<\/span><\/h2>\n\n      <div class=\"factor-row\">\n        <div class=\"field\">\n          <label>1. Tipo de cliente<\/label>\n          <select data-factor=\"tipo_cliente\">\n            <option value=\"1\">Persona física dominicana<\/option>\n            <option value=\"1\">Persona jurídica nacional<\/option>\n            <option value=\"1\">Entidad gubernamental dominicana<\/option>\n            <option value=\"2\">Persona física extranjera residente en RD<\/option>\n            <option value=\"2\">Persona jurídica con capital extranjero<\/option>\n            <option value=\"3\">Persona física extranjera no residente<\/option>\n          <\/select>\n        <\/div>\n        <div class=\"weight\">peso 10%<\/div>\n        <div class=\"score-pill\" data-pill=\"tipo_cliente\">1<\/div>\n      <\/div>\n\n      <div class=\"factor-row\">\n        <div class=\"field\">\n          <label>2. Actividad económica / ocupación<\/label>\n          <select data-factor=\"actividad\">\n            <option value=\"1\">Empleado asalariado / profesional formal<\/option>\n            <option value=\"2\">Comerciante o negocio propio formalizado<\/option>\n            <option value=\"3\" data-min=\"Medio\">Actividad de alto riesgo (casinos, casas de cambio, joyerías, ONG, remesadoras)<\/option>\n          <\/select>\n        <\/div>\n        <div class=\"weight\">peso 20%<\/div>\n        <div class=\"score-pill\" data-pill=\"actividad\">1<\/div>\n      <\/div>\n\n      <div class=\"factor-row\">\n        <div class=\"field\">\n          <label>3. Condición PEP<\/label>\n          <select data-factor=\"pep\">\n            <option value=\"1\">No es PEP<\/option>\n            <option value=\"2\" data-min=\"Medio\">Familiar o allegado cercano de un PEP<\/option>\n            <option value=\"3\" data-min=\"Alto\">Es PEP (nacional o extranjero)<\/option>\n          <\/select>\n        <\/div>\n        <div class=\"weight\">peso 20%<\/div>\n        <div class=\"score-pill\" data-pill=\"pep\">1<\/div>\n      <\/div>\n\n      <div class=\"factor-row\">\n        <div class=\"field\">\n          <label>4. Origen de los fondos<\/label>\n          <select data-factor=\"origen\">\n            <option value=\"1\">Verificable y documentado<\/option>\n            <option value=\"2\">Parcialmente verificable<\/option>\n            <option value=\"3\" data-min=\"Alto\">No verificable / sin soporte<\/option>\n          <\/select>\n        <\/div>\n        <div class=\"weight\">peso 15%<\/div>\n        <div class=\"score-pill\" data-pill=\"origen\">1<\/div>\n      <\/div>\n\n      <div class=\"factor-row\">\n        <div class=\"field\">\n          <label>5. Zona geográfica de residencia<\/label>\n          <select data-factor=\"zona\">\n            <option value=\"1\">República Dominicana<\/option>\n            <option value=\"2\">País de riesgo medio (GAFILAT)<\/option>\n            <option value=\"3\" data-min=\"Alto\">País de alto riesgo o no cooperante (lista GAFI)<\/option>\n          <\/select>\n        <\/div>\n        <div class=\"weight\">peso 15%<\/div>\n        <div class=\"score-pill\" data-pill=\"zona\">1<\/div>\n      <\/div>\n\n      <div class=\"factor-row\">\n        <div class=\"field\">\n          <label>6. Canal de vinculación<\/label>\n          <select data-factor=\"canal\">\n            <option value=\"1\">Presencial (entrevista directa)<\/option>\n            <option value=\"2\">No presencial (remoto / digital)<\/option>\n            <option value=\"3\">A través de intermediario o tercero<\/option>\n          <\/select>\n        <\/div>\n        <div class=\"weight\">peso 5%<\/div>\n        <div class=\"score-pill\" data-pill=\"canal\">1<\/div>\n      <\/div>\n\n      <div class=\"factor-row\">\n        <div class=\"field\">\n          <label>7. Monto de prima anual (RD$)<\/label>\n          <input type=\"number\" min=\"0\" step=\"1000\" id=\"montoPrima\" placeholder=\"0\">\n        <\/div>\n        <div class=\"weight\">peso 10%<\/div>\n        <div class=\"score-pill\" data-pill=\"monto\">1<\/div>\n      <\/div>\n\n      <div class=\"factor-row\">\n        <div class=\"field\">\n          <label>8. Tipo de producto de seguro<\/label>\n          <select data-factor=\"producto_tipo\">\n            <option value=\"1\">Daños (auto, incendio, salud, fianzas)<\/option>\n            <option value=\"2\">Vida temporal (sin valor de rescate)<\/option>\n            <option value=\"3\">Vida con valor de rescate, ahorro o inversión<\/option>\n          <\/select>\n        <\/div>\n        <div class=\"weight\">peso 5%<\/div>\n        <div class=\"score-pill\" data-pill=\"producto_tipo\">1<\/div>\n      <\/div>\n\n      <p class=\"note\">Puntaje por opción: 1 = riesgo bajo · 2 = riesgo medio · 3 = riesgo alto. Umbral de RD$100,000 y RD$500,000 para el monto de prima.<\/p>\n    <\/div>\n\n    <div class=\"card\">\n      <h2>Información adicional <span class=\"tag\">para la ficha impresa<\/span><\/h2>\n      <div class=\"grid2\">\n        <div class=\"field\">\n          <label for=\"ramo\">Producto contratado (ramo)<\/label>\n          <input id=\"ramo\" type=\"text\" placeholder=\"Ej. Auto, Vida, Salud\">\n        <\/div>\n        <div class=\"field\">\n          <label for=\"canalDist\">Canal de distribución<\/label>\n          <select id=\"canalDist\">\n            <option>Directo en sucursal<\/option>\n            <option>Corredor / Agente<\/option>\n            <option>Digital / Online<\/option>\n            <option>Call center<\/option>\n          <\/select>\n        <\/div>\n        <div class=\"field\">\n          <label for=\"canalPago\">Canal de pago<\/label>\n          <select id=\"canalPago\">\n            <option>Efectivo directo en caja<\/option>\n            <option>Transferencia bancaria<\/option>\n            <option>Tarjeta de crédito/débito<\/option>\n            <option>Débito automático<\/option>\n            <option>Cheque<\/option>\n          <\/select>\n        <\/div>\n        <div class=\"field\">\n          <label for=\"frecPago\">Frecuencia de pago<\/label>\n          <select id=\"frecPago\">\n            <option>Anual<\/option>\n            <option>Semestral<\/option>\n            <option>Trimestral<\/option>\n            <option>Mensual<\/option>\n          <\/select>\n        <\/div>\n        <div class=\"field\">\n          <label for=\"fechaNac\">Fecha de nacimiento / constitución<\/label>\n          <input id=\"fechaNac\" type=\"date\">\n        <\/div>\n        <div class=\"field\">\n          <label for=\"ingresos\">Ingresos económicos<\/label>\n          <select id=\"ingresos\">\n            <option>Menor de RD$30,000<\/option>\n            <option>RD$30,001 - RD$50,000<\/option>\n            <option>RD$50,001 - RD$100,000<\/option>\n            <option>RD$100,001 - RD$300,000<\/option>\n            <option>Mayor de RD$300,000<\/option>\n          <\/select>\n        <\/div>\n        <div class=\"field\">\n          <label for=\"paisNac\">País de nacimiento / constitución<\/label>\n          <input id=\"paisNac\" type=\"text\" value=\"República Dominicana\">\n        <\/div>\n        <div class=\"field\">\n          <label for=\"paisNal\">País de nacionalidad<\/label>\n          <input id=\"paisNal\" type=\"text\" value=\"República Dominicana\">\n        <\/div>\n        <div class=\"field\">\n          <label for=\"paisRes\">País de residencia<\/label>\n          <input id=\"paisRes\" type=\"text\" value=\"República Dominicana\">\n        <\/div>\n        <div class=\"field\">\n          <label for=\"provincia\">Provincia o estado de residencia<\/label>\n          <input id=\"provincia\" type=\"text\" placeholder=\"Ej. Monseñor Nouel\">\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <aside>\n    <div class=\"card\">\n      <h2>Resultado<\/h2>\n      <div class=\"result-level bajo\" id=\"resultLevel\">\n        <div class=\"lvl-label\">Nivel de riesgo<\/div>\n        <div class=\"lvl-value\" id=\"lvlValue\">Bajo<\/div>\n      <\/div>\n      <div class=\"note\" id=\"motivoExcedencia\" style=\"display:none; background:#fbf0d6; border-radius:4px; padding:7px 9px; margin:-8px 0 12px; color:#7a5c00;\"><\/div>\n      <div class=\"result-meta\">\n        <div><span class=\"k\">Puntaje ponderado<\/span><span class=\"v\" id=\"scoreValue\">1.00<\/span><\/div>\n        <div><span class=\"k\">Frecuencia de revisión<\/span><span class=\"v\" id=\"freqValue\">Cada 3 años<\/span><\/div>\n        <div><span class=\"k\">Próxima revisión<\/span><span class=\"v\" id=\"nextValue\">—<\/span><\/div>\n        <div><span class=\"k\">Tipo de diligencia<\/span><span class=\"v\" id=\"diligValue\">Debida diligencia<\/span><\/div>\n      <\/div>\n\n      <h2 style=\"font-size:12px; border-bottom:none; margin-bottom:6px;\">Aporte de cada factor<\/h2>\n      <div class=\"bars\" id=\"bars\"><\/div>\n\n      <div class=\"actions\" style=\"margin-top:18px;\">\n        <button class=\"primary\" onclick=\"window.print()\">Imprimir / Guardar como PDF<\/button>\n        <button class=\"ghost\" onclick=\"resetForm()\">Limpiar formulario<\/button>\n      <\/div>\n      <p class=\"note\">Esta herramienta no guarda información: al cerrar o recargar la página, los datos se pierden. Genere el PDF antes de salir si necesita conservar el registro.<\/p>\n    <\/div>\n  <\/aside>\n<\/main>\n\n<footer class=\"foot\">Uso interno de CORREPLUS Corredores de Seguros SRL — metodología de evaluación de riesgo PLA/FT conforme a la Ley 155-17.<\/footer>\n\n<\u0021-- ================= HOJA IMPRIMIBLE ================= -->\n<div id=\"printSheet\">\n  <div class=\"ps-header\">\n    <div>\n      <h1>Ficha de evaluación de riesgo del cliente<\/h1>\n      <div class=\"sub\">CORREPLUS Corredores de Seguros SRL — Cumplimiento PLA/FT (Ley 155-17)<\/div>\n    <\/div>\n    <div class=\"date\">\n      Fecha de evaluación<br>\n      <strong id=\"psFecha\">—<\/strong>\n    <\/div>\n  <\/div>\n\n  <div class=\"ps-section\">\n    <h3>Datos del cliente<\/h3>\n    <div class=\"ps-grid\">\n      <div class=\"ps-item\"><div class=\"k\">Nombre / Razón social<\/div><div class=\"v\" id=\"psNombre\">—<\/div><\/div>\n      <div class=\"ps-item\"><div class=\"k\">Documento<\/div><div class=\"v\" id=\"psDoc\">—<\/div><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"ps-section\">\n    <h3 class=\"ps-result-title\">Resultado<\/h3>\n    <div class=\"result-level bajo\" id=\"psRisk\">\n      <div class=\"lvl-label\">Nivel de riesgo<\/div>\n      <div class=\"lvl-value\" id=\"psLvl\">Bajo<\/div>\n    <\/div>\n    <div class=\"note\" id=\"psMotivo\" style=\"display:none; background:#fbf0d6; border-radius:4px; padding:7px 9px; margin:8px 0 0; color:#7a5c00;\"><\/div>\n    <div class=\"result-meta\" style=\"margin-top:14px;\">\n      <div><span class=\"k\">Puntaje ponderado<\/span><span class=\"v\" id=\"psScore\">1.00<\/span><\/div>\n      <div><span class=\"k\">Frecuencia de revisión<\/span><span class=\"v\" id=\"psFreq\">Cada 3 años<\/span><\/div>\n      <div><span class=\"k\">Próxima revisión<\/span><span class=\"v\" id=\"psNext\">—<\/span><\/div>\n      <div><span class=\"k\">Tipo de diligencia<\/span><span class=\"v\" id=\"psDilig\">Debida diligencia<\/span><\/div>\n    <\/div>\n    <h3 class=\"ps-result-title\" style=\"margin-top:16px;\">Aporte de cada factor<\/h3>\n    <div class=\"bars\" id=\"psBars\"><\/div>\n  <\/div>\n\n  <div class=\"ps-section\">\n    <h3>Producto y canal<\/h3>\n    <div class=\"ps-grid cols3\">\n      <div class=\"ps-item\"><div class=\"k\">Producto contratado<\/div><div class=\"v\" id=\"psRamo\">—<\/div><\/div>\n      <div class=\"ps-item\"><div class=\"k\">Canal de distribución<\/div><div class=\"v\" id=\"psCanalDist\">—<\/div><\/div>\n      <div class=\"ps-item\"><div class=\"k\">Canal de pago<\/div><div class=\"v\" id=\"psCanalPago\">—<\/div><\/div>\n      <div class=\"ps-item\"><div class=\"k\">Frecuencia de pago<\/div><div class=\"v\" id=\"psFrecPago\">—<\/div><\/div>\n      <div class=\"ps-item\"><div class=\"k\">Monto prima anual<\/div><div class=\"v\" id=\"psMonto\">—<\/div><\/div>\n      <div class=\"ps-item\"><div class=\"k\">Ingresos económicos<\/div><div class=\"v\" id=\"psIngresos\">—<\/div><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"ps-section\">\n    <h3>Cliente y jurisdicción<\/h3>\n    <div class=\"ps-grid cols3\">\n      <div class=\"ps-item\"><div class=\"k\">Fecha de nacimiento / constitución<\/div><div class=\"v\" id=\"psFechaNac\">—<\/div><\/div>\n      <div class=\"ps-item\"><div class=\"k\">País de nacimiento / constitución<\/div><div class=\"v\" id=\"psPaisNac\">—<\/div><\/div>\n      <div class=\"ps-item\"><div class=\"k\">País de nacionalidad<\/div><div class=\"v\" id=\"psPaisNal\">—<\/div><\/div>\n      <div class=\"ps-item\"><div class=\"k\">País de residencia<\/div><div class=\"v\" id=\"psPaisRes\">—<\/div><\/div>\n      <div class=\"ps-item\"><div class=\"k\">Provincia / estado de residencia<\/div><div class=\"v\" id=\"psProvincia\">—<\/div><\/div>\n      <div class=\"ps-item\"><div class=\"k\">Condición PEP<\/div><div class=\"v\" id=\"psPep\">—<\/div><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"ps-sign\">\n    <div>Oficial de Cumplimiento / Ejecutivo de Cuentas<\/div>\n    <div>Firma del cliente (si aplica)<\/div>\n  <\/div>\n  <div class=\"ps-foot\">Documento generado el <span id=\"psGenDate\"><\/span> — Uso exclusivo de CORREPLUS Corredores de Seguros SRL.<\/div>\n<\/div>\n\n<script>\nconst WEIGHTS = {\n  tipo_cliente: 0.10, actividad: 0.20, pep: 0.20, origen: 0.15,\n  zona: 0.15, canal: 0.05, monto: 0.10, producto_tipo: 0.05\n};\nconst FACTOR_LABELS = {\n  tipo_cliente: \"Tipo de cliente\", actividad: \"Actividad económica\",\n  pep: \"Condición PEP\", origen: \"Origen de fondos\", zona: \"Zona geográfica\",\n  canal: \"Canal de vinculación\", monto: \"Monto de prima\", producto_tipo: \"Tipo de producto\"\n};\nconst UMBRAL1 = 100000, UMBRAL2 = 500000;\nconst NIVEL_BAJO_MAX = 1.5, NIVEL_MEDIO_MAX = 2.2;\nconst ORDEN = { \"Bajo\": 1, \"Medio\": 2, \"Alto\": 3 };\n\nfunction montoScore(v){\n  v = Number(v) || 0;\n  if (v < UMBRAL1) return 1;\n  if (v <= UMBRAL2) return 2;\n  return 3;\n}\n\nfunction fmtDate(d){\n  if(!d) return \"—\";\n  const dt = new Date(d + \"T00:00:00\");\n  if (isNaN(dt)) return \"—\";\n  return dt.toLocaleDateString(\"es-DO\", {day:\"2-digit\", month:\"2-digit\", year:\"numeric\"});\n}\nfunction addMonths(dateStr, months){\n  if(!dateStr) return null;\n  const dt = new Date(dateStr + \"T00:00:00\");\n  dt.setMonth(dt.getMonth() + months);\n  return dt;\n}\n\nfunction calcular(){\n  const scores = {};\n  const overrides = []; // {nivel, motivo}\n  document.querySelectorAll('[data-factor]').forEach(sel=>{\n    const key = sel.dataset.factor;\n    scores[key] = Number(sel.value);\n    document.querySelector(`[data-pill=\"${key}\"]`).textContent = scores[key];\n    const opt = sel.selectedOptions[0];\n    if (opt && opt.dataset.min){\n      overrides.push({ nivel: opt.dataset.min, motivo: `${FACTOR_LABELS[key]}: ${opt.textContent}` });\n    }\n  });\n  const montoVal = document.getElementById('montoPrima').value;\n  scores.monto = montoScore(montoVal);\n  document.querySelector('[data-pill=\"monto\"]').textContent = scores.monto;\n\n  let total = 0;\n  const contrib = {};\n  Object.keys(WEIGHTS).forEach(k=>{\n    const c = scores[k] * WEIGHTS[k];\n    contrib[k] = c;\n    total += c;\n  });\n\n  // Nivel según el puntaje ponderado\n  let nivel;\n  if (total <= NIVEL_BAJO_MAX) nivel = \"Bajo\";\n  else if (total <= NIVEL_MEDIO_MAX) nivel = \"Medio\";\n  else nivel = \"Alto\";\n\n  // Reglas de excedencia: ciertos factores críticos (PEP, país de alto riesgo,\n  // origen de fondos no verificable, actividad de alto riesgo) imponen un piso\n  // mínimo de riesgo sin importar el promedio ponderado.\n  let motivosAplicados = [];\n  overrides.forEach(o=>{\n    if (ORDEN[o.nivel] > ORDEN[nivel]){\n      nivel = o.nivel;\n    }\n  });\n  const nivelFinal = nivel;\n  motivosAplicados = overrides.filter(o => ORDEN[o.nivel] === ORDEN[nivelFinal]);\n  // Si el nivel final coincide con el que arrojaría solo el puntaje (sin necesitar\n  // excedencia), no mostramos motivo de excedencia.\n  const nivelPorPuntaje = total <= NIVEL_BAJO_MAX ? \"Bajo\" : (total <= NIVEL_MEDIO_MAX ? \"Medio\" : \"Alto\");\n  const huboExcedencia = ORDEN[nivelFinal] > ORDEN[nivelPorPuntaje];\n\n  let freq, meses, tipoDilig;\n  if (nivel === \"Bajo\"){ freq=\"Cada 3 años\"; meses=36; tipoDilig=\"Debida diligencia simplificada\"; }\n  else if (nivel === \"Medio\"){ freq=\"Cada 2 años\"; meses=24; tipoDilig=\"Debida diligencia estándar\"; }\n  else { freq=\"Anual\"; meses=12; tipoDilig=\"Debida diligencia reforzada\"; }\n\n  const fechaEval = document.getElementById('fechaEval').value;\n  const next = addMonths(fechaEval, meses);\n  const cls = nivel.toLowerCase();\n\n  // panel resultado\n  const rl = document.getElementById('resultLevel');\n  rl.className = \"result-level \" + cls;\n  document.getElementById('lvlValue').textContent = nivel;\n  document.getElementById('scoreValue').textContent = total.toFixed(2);\n  document.getElementById('freqValue').textContent = freq;\n  document.getElementById('nextValue').textContent = next ? fmtDate(next.toISOString().slice(0,10)) : \"—\";\n  document.getElementById('diligValue').textContent = tipoDilig;\n\n  const motivoEl = document.getElementById('motivoExcedencia');\n  if (huboExcedencia && motivosAplicados.length){\n    motivoEl.style.display = \"block\";\n    motivoEl.textContent = \"Nivel elevado automáticamente por: \" + motivosAplicados.map(m=>m.motivo).join(\" · \");\n  } else {\n    motivoEl.style.display = \"none\";\n    motivoEl.textContent = \"\";\n  }\n\n  // barras (pantalla y ficha imprimible comparten el mismo dibujo)\n  pintarBarras('bars', contrib);\n  pintarBarras('psBars', contrib);\n\n  actualizarHojaImprimible(nivel, total, freq, next, tipoDilig, huboExcedencia, motivosAplicados);\n}\n\nfunction pintarBarras(containerId, contrib){\n  const barsEl = document.getElementById(containerId);\n  if (!barsEl) return;\n  barsEl.innerHTML = \"\";\n  const maxContrib = Math.max(...Object.values(contrib), 0.01);\n  Object.keys(WEIGHTS).forEach(k=>{\n    const pct = Math.round((contrib[k] / maxContrib) * 100);\n    const row = document.createElement('div');\n    row.className = \"bar-row\";\n    row.innerHTML = `<div class=\"name\">${FACTOR_LABELS[k]}<\/div>\n      <div class=\"bar-track\"><div class=\"bar-fill\" style=\"width:${pct}%\"><\/div><\/div>\n      <div class=\"val\">${contrib[k].toFixed(2)}<\/div>`;\n    barsEl.appendChild(row);\n  });\n}\n\nfunction val(id){ return document.getElementById(id).value || \"—\"; }\n\nfunction actualizarHojaImprimible(nivel, total, freq, next, tipoDilig, huboExcedencia, motivosAplicados){\n  const cls = nivel.toLowerCase();\n  document.getElementById('psFecha').textContent = fmtDate(document.getElementById('fechaEval').value);\n  document.getElementById('psNombre').textContent = val('nombre');\n  document.getElementById('psDoc').textContent = `${document.getElementById('tipoDoc').value} ${val('numDoc')}`;\n\n  const riskBox = document.getElementById('psRisk');\n  riskBox.className = \"result-level \" + cls;\n  document.getElementById('psLvl').textContent = nivel;\n  document.getElementById('psScore').textContent = total.toFixed(2);\n  document.getElementById('psFreq').textContent = freq;\n  document.getElementById('psNext').textContent = next ? fmtDate(next.toISOString().slice(0,10)) : \"—\";\n  document.getElementById('psDilig').textContent = tipoDilig;\n  const psMotivo = document.getElementById('psMotivo');\n  if (huboExcedencia && motivosAplicados.length){\n    psMotivo.style.display = \"block\";\n    psMotivo.textContent = \"Nivel elevado automáticamente por: \" + motivosAplicados.map(m=>m.motivo).join(\" · \");\n  } else {\n    psMotivo.style.display = \"none\";\n    psMotivo.textContent = \"\";\n  }\n\n  document.getElementById('psRamo').textContent = val('ramo');\n  document.getElementById('psCanalDist').textContent = val('canalDist');\n  document.getElementById('psCanalPago').textContent = val('canalPago');\n  document.getElementById('psFrecPago').textContent = val('frecPago');\n  const monto = document.getElementById('montoPrima').value;\n  document.getElementById('psMonto').textContent = monto ? \"RD$\" + Number(monto).toLocaleString(\"es-DO\") : \"—\";\n  document.getElementById('psIngresos').textContent = val('ingresos');\n\n  document.getElementById('psFechaNac').textContent = fmtDate(document.getElementById('fechaNac').value);\n  document.getElementById('psPaisNac').textContent = val('paisNac');\n  document.getElementById('psPaisNal').textContent = val('paisNal');\n  document.getElementById('psPaisRes').textContent = val('paisRes');\n  document.getElementById('psProvincia').textContent = val('provincia');\n  document.getElementById('psPep').textContent = document.querySelector('[data-factor=\"pep\"]').selectedOptions[0].textContent;\n\n  document.getElementById('psGenDate').textContent = new Date().toLocaleDateString(\"es-DO\");\n}\n\nfunction fijarFechaHoy(){\n  const hoy = new Date();\n  const yyyy = hoy.getFullYear();\n  const mm = String(hoy.getMonth() + 1).padStart(2, '0');\n  const dd = String(hoy.getDate()).padStart(2, '0');\n  document.getElementById('fechaEval').value = `${yyyy}-${mm}-${dd}`;\n}\n\nfunction resetForm(){\n  document.querySelectorAll('input').forEach(i=>{\n    if (i.type === 'text' && (i.id === 'paisNac' || i.id === 'paisNal' || i.id === 'paisRes')){\n      i.value = \"República Dominicana\";\n    } else if (i.id === 'fechaEval'){\n      // se restablece a la fecha de hoy más abajo\n    } else {\n      i.value = \"\";\n    }\n  });\n  document.querySelectorAll('select').forEach(s=> s.selectedIndex = 0);\n  fijarFechaHoy();\n  calcular();\n}\n\ndocument.querySelectorAll('input, select').forEach(el=>{\n  el.addEventListener('input', calcular);\n  el.addEventListener('change', calcular);\n});\n\nfijarFechaHoy();\ncalcular();\n<\/script>\n<\/body>\n<\/html>\n"}, "assets": {"@@IMG0@@": "iVBORw0KGgoAAAANSUhEUgAAB04AAAI4CAYAAADtdcprAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAALiMAAC4jAXilP3YAALujSURBVHhe7N15nJ1lff//9+c+M9kzk7Apm6AiWsQFQTKBTBYrZBLXVgJkIQnQHy7V2la72NrGtN+2ttpvXb4upUVmgMwAoe4mA6ghDMsMguKGGy7ILlvOJGSdc39+f0QtfghkMnOW65zzej4eeajv6544zLnOcO77fV/XLQEAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA function save(){
  if (typeof YO !== 'undefined' && YO && !puedeEditar()) {  // usuario con permiso de solo ver: se deshace el cambio
    try { db = JSON.parse(localStorage.getItem(KEY)); } catch(e) {}
    toast('Su usuario solo puede ver este módulo'); setTimeout(() => { try { dlg.close(); } catch(e) {} render(); }, 50); return;
  }
  try { localStorage.setItem(KEY, JSON.stringify(db)); } catch(e) {} nbProgramar();
}
function load(){
  try { const r = localStorage.getItem(KEY); if (r) return JSON.parse(r); } catch(e) {}
  return seed();
}
// el sistema arranca en blanco (sin datos de ejemplo)
function seed(){ return {clientes:[], polizas:[], cobros:[], tareas:[], siniestros:[], liquidaciones:[], config:{itbis:true, itbisTasa:16, sinEjemplos:true}}; }
db = load();
// recibos para pagos antiguos que no tienen número
db.cobros.filter(c => c.estado === 'Pagado' && !c.recibo).sort((a,b) => (a.fechaPago||'').localeCompare(b.fechaPago||'')).forEach(c => c.recibo = nextRecibo());
// lugar de pago para pagos antiguos (oficina → hay que remitir a la aseguradora)
db.cobros.filter(c => c.estado === 'Pagado' && !c.lugar).forEach((c, i) => {
  if (i % 3 === 2) { c.lugar = 'Aseguradora'; c.remesa = ''; return; }
  c.lugar = 'Oficina';
  if (daysBetween(c.fechaPago, today()) <= 45) c.remesa = 'Pendiente';
  else Object.assign(c, {remesa:'Remitido', fechaRemesa:addDays(c.fechaPago, 5), refRemesa:'TRF-' + (5000 + i)});
});
// dirección vieja (solo ciudad) → país / provincia / ciudad
const PROV_DE = {'Santo Domingo':'Distrito Nacional','Santiago':'Santiago','La Romana':'La Romana','Punta Cana':'La Altagracia'};
db.clientes.forEach(c => { if (c.pais === undefined) { if (PROV_DE[c.direccion]) { c.ciudad = c.direccion; c.provincia = PROV_DE[c.direccion]; c.direccion = ''; } c.pais = 'República Dominicana'; } });
// comisiones: tasa por póliza, liquidaciones y comisiones viejas ya liquidadas
function migrarComisiones(){
db.config = db.config || {itbis:true, itbisTasa:16};
Object.assign(COM_DEF, db.config.comDefExtra || {});
db.polizas.forEach(p => { if (p.comision === undefined || p.comision === '') p.comision = COM_DEF[p.ramo] ?? 10; });
if (!db.liquidaciones) {
  db.liquidaciones = [];
  const viejas = db.cobros.filter(c => c.estado === 'Pagado' && daysBetween(c.fechaPago, today()) > 50);
  const grupos = {};
  viejas.forEach(c => { const k = (byId('polizas', c.polizaId)?.aseguradora || '—') + '|' + c.fechaPago.slice(0,7); (grupos[k] = grupos[k] || []).push(c); });
  Object.entries(grupos).sort().forEach(([k, arr], i) => {
    const [aseg, mes] = k.split('|'), id = uid(), bruto = arr.reduce((s,c) => s + comMonto(c), 0);
    db.liquidaciones.push({id, numero:'LIQ-' + (101 + i), aseguradora:aseg, fecha:addDays(mes + '-15', 30), referencia:'TRF-' + (7000 + i), retencion:0, bruto:+bruto.toFixed(2), neto:+bruto.toFixed(2), items:arr.map(c => c.id)});
    arr.forEach(c => { c.comEstado = 'Liquidada'; c.liqId = id; });
  });
}
}
// montos de la póliza (las viejas sin prima neta la sacan de la prima con ISC 16%)
const vacio = v => v === '' || v === undefined || v === null;
const polNeta = p => vacio(p.primaNeta) ? r2(+p.prima / 1.16 || 0) : +p.primaNeta || 0;
// mes de emisión: fecha de expedición (las viejas usan el inicio de vigencia)
const polEmision = p => p.expedicion || p.inicio || '';
const mesNombre = ym => { const [y, m] = ym.split('-'); return ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'][+m - 1] + ' ' + y; };
const mesEmision = p => polEmision(p) ? mesNombre(polEmision(p).slice(0,7)) : '';
const polBruta = p => +(p.total ?? p.prima) || 0;
const polCom = p => vacio(p.comisionMonto) || (!+p.comisionMonto && vacio(p.primaNeta)) ? r2(polNeta(p) * (vacio(p.participacion) ? 100 : +p.participacion) / 100 * comRate(p) / 100) : +p.comisionMonto || 0;
const polMon = (p, v) => p.moneda === 'USD' ? 'US$' + (+v || 0).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}) : DOP(v);
// riesgo asegurado: los ramos de vehículos llevan los datos completos del vehículo
const VEH_CAMPOS = [['tipo','Tipo de vehículo'],['marca','Marca'],['modelo','Modelo'],['anio','Año'],['color','Color'],['placa','Placa'],['chasis','Chasis (VIN)'],['motor','No. de motor'],
  ['uso','Uso'],['condicion','Condición'],['cilindraje','Cilindraje'],['pasajeros','Pasajeros']];
const VEH_OPC = {tipo:['','Automóvil','Jeep / SUV','Camioneta','Motocicleta','Camión','Autobús / Minibús','Otro'], uso:['','Privado','Público','Comercial / Carga','Alquiler'],
  condicion:['','Nuevo','Usado']};
const esVehiculo = ramo => /veh[ií]c|auto|motor|flotilla/i.test(ramo + ' ' + (ramoObj(ramo)?.principal || ''));
const vehTexto = v => v ? [[v.marca, v.modelo, v.anio].filter(Boolean).join(' '), v.placa && 'Placa ' + v.placa, v.chasis && 'Chasis ' + v.chasis].filter(Boolean).join(' · ') : '';
function comRate(p){ return +(p?.comision ?? COM_DEF[p?.ramo] ?? 10); }
function comBase(c){ return db.config.itbis ? +c.monto / (1 + db.config.itbisTasa / 100) : +c.monto; }
function comMonto(c){
  const p = byId('polizas', c.polizaId);
  // pólizas con prima neta: la comisión es proporcional a lo cobrado de esa póliza
  if (p && +p.total > 0 && p.primaNeta !== undefined) {
    const share = +c.monto / +p.total;
    return Math.round((p.comMontoEdit ? +p.comisionMonto : +p.primaNeta * (+p.participacion || 0) / 100 * comRate(p) / 100) * share * 100) / 100;
  }
  return Math.round(comBase(c) * comRate(p)) / 100;
}
function cobNeta(c){
  const p = byId('polizas', c.polizaId), b = p ? polBruta(p) : 0;
  return b > 0 ? r2(polNeta(p) * +c.monto / b) : r2(comBase(c));
}
const sumNeta = a => a.reduce((s,c) => s + cobNeta(c), 0);
function nextRecibo(){
  const n = Math.max(1000, ...db.cobros.map(c => +String(c.recibo||'').replace(/\D/g,'') || 0));
  return 'REC-' + (n + 1);
}

  const mk = (o) => ({id:uid(), estado:'Activo', ...o});

  if (!db.ramos) {
    const tipo = {'Salud':'Salud','Vida':'Personas','Accidentes Personales':'Personas','Fianzas':'Fianzas'};
    const ej = {'Vehículos':'Placa, marca, modelo y año','Incendio y Líneas Aliadas':'Dirección del inmueble','Hogar':'Dirección de la vivienda','Salud':'Plan y dependientes','Vida':'Asegurado principal','Fianzas':'Contrato u obra garantizada','Transporte':'Mercancía y ruta'};
    db.ramos = [...new Set([...RAMOS, ...(db.config.ramosExtra || []), ...db.polizas.map(p => p.ramo)])].filter(Boolean).map(n => mk({nombre:n, pct:COM_DEF[n] ?? 10, tipo:tipo[n] || 'Generales', riesgoEj:ej[n] || ''}));
  }
  if (!db.vendedores) db.vendedores = [...new Set(db.polizas.flatMap(p => (p.vendedores || []).map(v => v.nombre)))].filter(Boolean).map(n => mk({nombre:n, pct:''}));
  if (!db.categorias) { const cols = ['#1f5fbf','#1fa463','#e0a100','#e0475b','#13a8a8','#ef6a3a']; db.categorias = [...new Set(['VIP','Flotilla','Banco / acreedor', ...db.polizas.flatMap(p => p.categorias || [])])].map((n, i) => mk({nombre:n, color:cols[i % cols.length], descripcion:''})); }
  // ramo principal (agrupa subramos)
  const PRIN = {'Vehículos':'Vehículos de motor','Salud':'Salud','Vida':'Personas','Accidentes Personales':'Personas','Fianzas':'Fianzas','Incendio y Líneas Aliadas':'Propiedad','Hogar':'Propiedad','Responsabilidad Civil':'Responsabilidad civil','Transporte':'Transporte'};
  db.ramos.forEach(r => { if (!r.principal) r.principal = PRIN[r.nombre] || r.tipo || 'Generales'; if (r.iscGastos === undefined) r.iscGastos = false; });
  db.aseguradoras.forEach(a => { a.isc = a.isc || {}; a.gastos = a.gastos || {}; });
  // ramos de cada aseguradora: los de sus pólizas; si no tiene pólizas, todos
  db.aseguradoras.forEach(a => { if (!a.ramos) { const usados = [...new Set(db.polizas.filter(p => p.aseguradora === a.nombre).map(p => p.ramo))].filter(Boolean); a.ramos = usados.length ? usados : db.ramos.map(r => r.nombre); } });
  if (!db.usuarios) db.usuarios = [mk({nombre:'Joely', email:'', rol:'Administrador', sede:'Principal'})];
  syncCatalogos();
}

function syncCatalogos(){

  RAMOS = db.ramos.filter(r => r.estado !== 'Inactivo').map(r => r.nombre);
  db.ramos.forEach(r => { if (r.pct !== '' && r.pct !== undefined) COM_DEF[r.nombre] = +r.pct; });
}
function defaultCom(aseg, ramo){
  const a = db.aseguradoras.find(x => x.nombre === aseg);

}

function proxCumples(n){
  const t = today(), y = +t.slice(0,4);
  return db.clientes.filter(c => c.nacimiento && c.estado === 'Activo').map(c => {

  }).filter(x => x.d <= n).sort((a,b) => a.d - b.d);

function chartCobros(){

  const vals = months.map(m => db.cobros.filter(c => c.estado === 'Pendiente' && c.vencimiento.slice(0,7) === m).reduce((s,c) => s + +c.monto, 0));
  const W = 600, H = 200, pad = 28, max = Math.max(...vals, 1);
  const X = i => pad + i * (W - pad*2) / (months.length - 1), Y = v => H - pad - v / max * (H - pad*2);
  const pts = vals.map((v,i) => `${X(i)},${Y(v)}`).join(' ');
  const lbl = m => new Date(m + '-15').toLocaleDateString('es-DO', {month:'short'});
  const nowI = 3;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Cobros pendientes por mes">
    <line x1="${X(nowI)}" x2="${X(nowI)}" y1="${pad-10}" y2="${H-pad}" stroke="var(--line)" stroke-dasharray="4 4"/>
    <text x="${X(nowI)+4}" y="${pad-2}" font-size="11" fill="var(--muted)">hoy</text>
    <polygon points="${X(0)},${H-pad} ${pts} ${X(vals.length-1)},${H-pad}" fill="var(--orange)" opacity=".25"/>
    <polyline points="${pts}" fill="none" stroke="var(--orange)" stroke-width="2"/>
    ${vals.map((v,i) => `<circle cx="${X(i)}" cy="${Y(v)}" r="3.5" fill="var(--orange)"><title>${lbl(months[i])}: ${DOP(v)}</title></circle>`).join('')}
    ${months.map((m,i) => `<text x="${X(i)}" y="${H-8}" font-size="11" text-anchor="middle" fill="var(--muted)">${lbl(m)}</text>`).join('')}
  </svg>`;
}
function donut(p){
  const r = 54, c = 2 * Math.PI * r;

    <circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--line)" stroke-width="12"/>
