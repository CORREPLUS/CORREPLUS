  const M = MODS[mod], st = state[mod] || {q:'', f:M.filter.def || ''};

  if (st.f) { const g = M.filter.grupos && M.filter.grupos[st.f], val = r => M.filter.get ? M.filter.get(r) : r[M.filter.k];
    rows = rows.filter(r => g ? g(val(r)) : val(r) === st.f); }
  if (st.q) { const q = st.q.toLowerCase(); rows = rows.filter(r => M.search(r).toLowerCase().includes(q)); }
  (M.more || []).forEach(x => { const v = st.m && st.m[x.k]; if (v) rows = rows.filter(r => x.match ? x.match(r, v) : x.get(r) === v); });
  if (M.fecha && st.desde) rows = rows.filter(r => (r[M.fecha.k]||'') >= st.desde);

function pregunta(msg, o = {}){

    $('#cfmF').innerHTML = `<button class="btn" id="cfmNo">Cancelar</button><button class="btn ${o.peligro ? 'danger' : 'primary'}" id="cfmSi">${esc(o.ok || 'Aceptar')}</button>`;

    $('#cfmSi').onclick = () => fin(o.input ? $('#cfmIn').value : true);

async function del(mod, id){
  if (mod === 'clientes' && db.polizas.some(p => p.clienteId === id)) return toast('Este cliente tiene pólizas; bórralas primero');
  if (mod === 'polizas' && (db.cobros.some(c => c.polizaId === id) || db.siniestros.some(s => s.polizaId === id))) return toast('La póliza tiene cobros o siniestros asociados');
  if (CFG.includes(mod)) {
    const r = byId(mod, id), usos = {aseguradoras:p => p.aseguradora === r.nombre, ramos:p => p.ramo === r.nombre, categorias:p => (p.categorias||[]).includes(r.nombre), vendedores:p => (p.vendedores||[]).some(v => v.nombre === r.nombre)}[mod];
    const n = usos ? db.polizas.filter(usos).length : 0;
    if (n) return toast(`Lo usan ${n} póliza(s). Márcalo como Inactivo en vez de borrarlo.`);
    if (mod === 'usuarios' && r.rol === 'Administrador' && db.usuarios.filter(u => u.rol === 'Administrador').length === 1) return toast('Debe quedar al menos un administrador');
  }
  if (!(await pregunta('¿Borrar este registro?', {ok:'Borrar', peligro:true}))) return;
  if (mod === 'ramos') { const n = byId('ramos', id).nombre; db.aseguradoras.forEach(a => { a.ramos = (a.ramos || []).filter(r => r !== n); }); }
  if (mod === 'polizas') (byId('polizas', id)?.archivos || []).forEach(a => idbDel(a.id).catch(() => {}));
  db[mod] = db[mod].filter(r => r.id !== id); if (CFG.includes(mod)) syncCatalogos(); save(); toast('Borrado'); render();
}

function cobrosFiltrados(tipo){
  const f = cst[tipo], q = f.q.toLowerCase();
  const fecha = c => tipo === 'pend' ? c.vencimiento : c.fechaPago;
  const est = tipo === 'remesa' ? (f.estado || 'Por remitir') : '';
  return db.cobros.filter(c => tipo === 'pend' ? c.estado !== 'Pagado' : tipo === 'rec' ? c.estado === 'Pagado'
      : c.estado === 'Pagado' && c.lugar === 'Oficina' && (est === 'Todos' || (est === 'Por remitir') === (c.remesa !== 'Remitido'))).filter(c => {
    const {p, cli} = cobroInfo(c);
    if (q && !(cli + (p.numero||'') + (c.recibo||'')).toLowerCase().includes(q)) return false;
    if (f.aseg && p.aseguradora !== f.aseg) return false;
    if (f.desde && (fecha(c)||'') < f.desde) return false;
    if (f.hasta && (fecha(c)||'') > f.hasta) return false;
    if (tipo === 'pend' && f.estado) {
      const d = daysBetween(today(), c.vencimiento);

    }
    if (tipo === 'rec' && f.metodo && c.metodo !== f.metodo) return false;
    if (tipo === 'rec' && f.lugar && (c.lugar || 'Oficina') !== f.lugar) return false;
    return true;

function edoDatos(){
  const cli = byId('clientes', ecst.cli); if (!cli) return null;
  const pols = db.polizas.filter(p => p.clienteId === cli.id && (!ecst.pol || p.id === ecst.pol)).sort((a,b) => (b.inicio||'').localeCompare(a.inicio||''));
  const pids = new Set(pols.map(p => p.id));
  const cuotas = db.cobros.filter(c => pids.has(c.polizaId)).filter(c => {
    if (ecst.estado === 'Pendientes' && c.estado === 'Pagado') return false;
    if (ecst.estado === 'Pagados' && c.estado !== 'Pagado') return false;
    if (ecst.estado === 'Atrasados' && cobroEstado(c) !== 'Atrasado') return false;
    if (ecst.desde && (c.vencimiento||'') < ecst.desde) return false;
    if (ecst.hasta && (c.vencimiento||'') > ecst.hasta) return false;
    return true; }).sort((a,b) => (a.vencimiento||'').localeCompare(b.vencimiento||''));
  const sum = a => a.reduce((s,c) => s + +c.monto, 0);
  const pag = cuotas.filter(c => c.estado === 'Pagado'), pend = cuotas.filter(c => c.estado !== 'Pagado'), atr = pend.filter(c => cobroEstado(c) === 'Atrasado');
  const porPol = pols.map(p => { const cs = cuotas.filter(c => c.polizaId === p.id), pg = cs.filter(c => c.estado === 'Pagado');
    return {p, n:cs.length, neta:polNeta(p), bruta:polBruta(p), pagado:sum(pg), balance:sum(cs) - sum(pg)}; });
  return {cli, pols, cuotas, porPol, pagado:sum(pag), pendiente:sum(pend), atrasado:sum(atr), nAtr:atr.length, prox:pend.find(c => c.vencimiento >= today()),
    neta:pols.reduce((s,p) => s + polNeta(p), 0), bruta:pols.reduce((s,p) => s + polBruta(p), 0)};
}

  const clis = db.clientes.slice().sort((a,b) => a.nombre.localeCompare(b.nombre)), d = edoDatos();

  $('#view').innerHTML = `<div class="card" style="margin-bottom:14px"><div class="toolbar" style="margin:0">

function guardarCorredor(){
  const d = Object.fromEntries(new FormData($('#frmEmp')));

  db.config.empresa = emp;
  db.config.ciudadOficina = (d.ciudadOficina || '').trim();
  db.config.itbis = d.itbis === 'on'; db.config.itbisTasa = +d.itbisTasa || 0;
  save(); toast('Datos del corredor guardados'); renderCorredor();
}

}

function limpiarCobros(tipo){ Object.keys(cst[tipo]).forEach(k => cst[tipo][k] = ''); remSel.clear(); renderCobros(); }
function exportCobros(tipo, fmt){
  const rows = cobrosFiltrados(tipo), f = cst[tipo];
  const filtros = filtrosTexto([['Buscar', f.q], ['Estado', tipo === 'remesa' ? (f.estado || 'Por remitir') : f.estado], ['Método', f.metodo], ['Lugar', f.lugar], ['Aseguradora', f.aseg],
    ['Desde', f.desde && fmtCell(f.desde, 'date')], ['Hasta', f.hasta && fmtCell(f.hasta, 'date')]]);
  const total = rows.reduce((s, c) => s + +c.monto, 0), neta = sumNeta(rows), nc = {l:'Prima neta', t:'money'};
  let cols, data, tot;
  if (tipo === 'pend') {
    cols = [{l:'Cliente'}, {l:'Póliza'}, {l:'Aseguradora'}, {l:'Vence', t:'date'}, {l:'Días', t:'num'}, {l:'Monto', t:'money'}, nc];
    data = rows.map(c => { const i = cobroInfo(c); return [i.cli, i.p.numero, i.p.aseguradora, c.vencimiento, daysBetween(today(), c.vencimiento), +c.monto, cobNeta(c)]; });
    tot = ['TOTAL', '', '', '', '', total, neta];
  } else if (tipo === 'rec') {
    cols = [{l:'Recibo'}, {l:'Cliente'}, {l:'Póliza'}, {l:'Aseguradora'}, {l:'Pagado el', t:'date'}, {l:'Método'}, {l:'Dónde pagó'}, {l:'Remesa'}, {l:'Monto', t:'money'}, nc];
    data = rows.map(c => { const i = cobroInfo(c); return [c.recibo, i.cli, i.p.numero, i.p.aseguradora, c.fechaPago, c.metodo, c.lugar === 'Aseguradora' ? 'Aseguradora' : 'Oficina', c.lugar === 'Aseguradora' ? '—' : c.remesa === 'Remitido' ? 'Remitido ' + fmtCell(c.fechaRemesa, 'date') : 'Por remitir', +c.monto, cobNeta(c)]; });
    tot = ['TOTAL', '', '', '', '', '', '', '', total, neta];
  } else {
    cols = [{l:'Recibo'}, {l:'Cliente'}, {l:'Póliza'}, {l:'Aseguradora'}, {l:'Cobrado el', t:'date'}, {l:'Días en oficina', t:'num'}, {l:'Estado'}, {l:'Referencia'}, {l:'Monto', t:'money'}, nc];
    data = rows.map(c => { const i = cobroInfo(c); return [c.recibo, i.cli, i.p.numero, i.p.aseguradora, c.fechaPago, daysBetween(c.fechaPago, today()), c.remesa === 'Remitido' ? 'Remitido ' + fmtCell(c.fechaRemesa, 'date') : 'Por remitir', c.refRemesa || '', +c.monto, cobNeta(c)]; });
    tot = ['TOTAL', '', '', '', '', '', '', '', total, neta];
  }
  exportar({archivo:{pend:'pagos-pendientes', rec:'pagos-recibidos', remesa:'por-pagar-aseguradora'}[tipo], titulo:COB_TITLES[tipo], filtros,
    secciones:[{titulo:COB_TITLES[tipo], cols, rows:data, totales:tot}]}, fmt);
}
function cobrar(id){
  const c = byId('cobros', id), i = cobroInfo(c);
  $('#dlgT').textContent = 'Registrar pago';
  $('#dlgB').innerHTML = `<p class="sub" style="font-size:14px">${esc(i.cli)} · ${esc(i.p.numero||'')} · vence ${fmtD(c.vencimiento)}</p><form class="form" id="frm">
    <label>Monto recibido (DOP) *<input name="monto" type="number" step="0.01" min="0" required value="${c.monto}"></label>
    <label>Fecha de pago *<input name="fechaPago" type="date" required value="${today()}"></label>
    <label>Método<select name="metodo">${METODOS.map(m => `<option ${m===c.metodo?'selected':''}>${m}</option>`).join('')}</select></label>
    <label>No. de recibo *<input name="recibo" required value="${nextRecibo()}"></label>
    <label class="full">¿Dónde pagó el cliente? *<select name="lugar"><option value="Oficina">En la oficina de CorrePlus (hay que pagarlo luego a la aseguradora)</option><option value="Aseguradora">Directo en la aseguradora</option></select></label></form>`;
  $('#dlgF').innerHTML = `<button class="btn" onclick="dlg.close()">Cancelar</button><button class="btn primary" onclick="confirmarPago('${id}')">Guardar pago</button>`;
  dlg.showModal();
}
function confirmarPago(id){
  const frm = $('#frm'); if (!frm.reportValidity()) return;
  const d = Object.fromEntries(new FormData(frm)), c = byId('cobros', id);
  Object.assign(c, d, {monto:+d.monto, estado:'Pagado', remesa: d.lugar === 'Oficina' ? 'Pendiente' : '', fechaRemesa:'', refRemesa:''});
  save(); dlg.close(); toast(d.lugar === 'Oficina' ? 'Pago registrado · pasa a "Por pagar a aseguradora"' : 'Pago registrado · ' + c.recibo); render();
}
async function anularPago(id){
  const c = byId('cobros', id);
  if (c.comEstado === 'Liquidada') return toast('Su comisión ya está en una liquidación; anula esa liquidación primero');
  if (!(await pregunta(`¿Anular el recibo ${c.recibo}? El cobro vuelve a pendientes.` + (c.remesa === 'Remitido' ? ' OJO: este pago ya se registró como pagado a la aseguradora.' : ''), {ok:'Anular recibo', peligro:true}))) return;
  Object.assign(c, {estado:'Pendiente', fechaPago:'', recibo:'', lugar:'', remesa:'', fechaRemesa:'', refRemesa:''}); save(); toast('Pago anulado'); pf ? render() : renderCobros();
}

// ---------- comisiones ----------
const kst = {cob:{q:'', aseg:'', ramo:'', estado:'', lugar:'', metodo:'', desde:today().slice(0,7) + '-01', hasta:today()}, pend:{q:'', aseg:'', ramo:'', estado:'', desde:'', hasta:''}, liq:{aseg:'', desde:'', hasta:''}, rep:{aseg:'', desde:today().slice(0,4) + '-01-01', hasta:today()}};
const liqSel = new Set();
// estado de la comisión de un pago cobrado
function comEstado(c){
  if (c.comEstado === 'Liquidada') return 'Liquidada';
  if (c.lugar === 'Oficina' && c.remesa !== 'Remitido') return 'Esperando remesa';
  return 'Por cobrar';
}
const comPill = e => e === 'Liquidada' ? '<span class="pill p-green">Liquidada</span>' : e === 'Esperando remesa' ? '<span class="pill p-gray" title="La prima aún no se ha pagado a la aseguradora">Esperando remesa</span>' : '<span class="pill p-amber">Por cobrar</span>';
const comPagos = () => db.cobros.filter(c => c.estado === 'Pagado');
function comFiltrados(f, soloPend){
  const q = (f.q || '').toLowerCase();
  return comPagos().filter(c => {
    const {p, cli} = cobroInfo(c), e = comEstado(c);
    if (soloPend && e === 'Liquidada') return false;
    if (q && !(cli + (p.numero||'') + (c.recibo||'')).toLowerCase().includes(q)) return false;
    if (f.aseg && p.aseguradora !== f.aseg) return false;
    if (f.ramo && p.ramo !== f.ramo) return false;
    if (f.estado && e !== f.estado) return false;
    if (f.lugar && (c.lugar || 'Oficina') !== f.lugar) return false;
    if (f.metodo && c.metodo !== f.metodo) return false;
    if (f.desde && c.fechaPago < f.desde) return false;
    if (f.hasta && c.fechaPago > f.hasta) return false;
    return true;
  }).sort((a,b) => a.fechaPago.localeCompare(b.fechaPago));
}
const sumCom = a => a.reduce((s,c) => s + comMonto(c), 0);
function renderComisiones(){
  $('#title').textContent = 'Comisiones · ' + COM_TITLES[comView];
  $('#actions').innerHTML = `<select class="btn" onchange="verCom(this.value)" aria-label="Ver">${Object.entries(COM_TITLES).map(([k,l]) => `<option value="${k}" ${comView===k?'selected':''}>${l}</option>`).join('')}</select>`;
  ({rep:renderComRep, cob:renderComCob, pend:renderComPend, liq:renderComLiq})[comView]();
}
const asegList = () => [...new Set(db.polizas.map(p => p.aseguradora))].sort();
const ksel = (g, k, label, arr, redraw) => `<select onchange="kst.${g}.${k}=this.value;${redraw}"><option value="">${label}</option>${arr.map(o => `<option ${kst[g][k]===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
const kfechas = (g, redraw, lbl) => `<label class="sub" style="display:flex;align-items:center;gap:6px;margin:0">${lbl||'Cobrado'} desde <input type="date" style="min-width:0;flex:none" value="${kst[g].desde}" onchange="kst.${g}.desde=this.value;${redraw}"></label>
  <label class="sub" style="display:flex;align-items:center;gap:6px;margin:0">hasta <input type="date" style="min-width:0;flex:none" value="${kst[g].hasta}" onchange="kst.${g}.hasta=this.value;${redraw}"></label>`;
const kbox = (cls, l, v, n, click) => `<div class="card" ${click?`style="cursor:pointer" onclick="${click}"`:''}><div class="sub" style="margin:0">${l}</div><div style="font-size:20px;font-weight:700;color:var(--${cls})">${DOP(v)}</div><div class="sub" style="margin:0">${n}</div></div>`;
const baseNota = () => `<div class="sub">La comisión se calcula sobre lo cobrado ${db.config.itbis ? `sin ITBIS (${db.config.itbisTasa}%)` : 'con impuestos incluidos'} × el % de cada póliza. <span class="link" onclick="configCom()">Cambiar</span></div>`;
function configCom(){
  $('#dlgT').textContent = 'Cálculo de comisiones';
  $('#dlgB').innerHTML = `<form class="form" id="frm"><label class="full" style="flex-direction:row;align-items:center;gap:8px;color:var(--text)"><input type="checkbox" name="itbis" ${db.config.itbis?'checked':''}> Calcular la comisión sobre la prima sin ITBIS</label>
    <label>Tasa de ITBIS (%)<input name="itbisTasa" type="number" step="0.01" value="${db.config.itbisTasa}"></label>
    <p class="sub full">El % de comisión se cambia en cada póliza. Al crear una póliza se sugiere uno según el ramo.</p></form>`;
  $('#dlgF').innerHTML = `<button class="btn" onclick="dlg.close()">Cancelar</button><button class="btn primary" onclick="const d=new FormData($('#frm'));Object.assign(db.config,{itbis:d.get('itbis')==='on',itbisTasa:+d.get('itbisTasa')||0});save();dlg.close();render()">Guardar</button>`;
  dlg.showModal();
}

    <div class="tbl-wrap"><table><thead><tr><th>Recibo</th><th>Cobrado el</th><th>Cliente / póliza / ramo</th><th>Dónde pagó</th><th class="num">Prima cobrada</th><th class="num">Prima neta</th><th class="num">%</th><th class="num">Comisión</th><th>Comisión</th></tr></thead><tbody id="kcRows"></tbody></table></div></div>`;

function drawComCob(){
  const rows = comFiltrados(kst.cob, false).reverse(), liq = rows.filter(c => comEstado(c) === 'Liquidada'), pend = rows.filter(c => comEstado(c) !== 'Liquidada');

    + kbox('brand','Comisión generada', sumCom(rows), neta ? 'promedio ' + (sumCom(rows) / neta * 100).toFixed(1) + '% de la neta' : '—')
    + kbox('green','Comisión liquidada', sumCom(liq), liq.length + ' pago(s)') + kbox('amber','Comisión pendiente', sumCom(pend), pend.length + ' pago(s)', "verCom('pend')");
  $('#kcTot').innerHTML = `${rows.length} pago(s) · cobrado <b>${DOP(prima)}</b> · prima neta <b>${DOP(neta)}</b> · comisión <b>${DOP(sumCom(rows))}</b>`;
  $('#kcRows').innerHTML = rows.map(c => { const i = cobroInfo(c), l = c.liqId && db.liquidaciones.find(x => x.id === c.liqId);

    <td>${lugarPill(c)}</td>
    <td class="num">${DOP(c.monto)}</td><td class="num">${DOP(cobNeta(c))}</td><td class="num">${comRate(i.p)}%</td><td class="num"><b>${DOP(comMonto(c))}</b></td>
    <td>${comPill(comEstado(c))}${l ? `<div class="sub" style="margin:0"><span class="link" onclick="verLiq('${l.id}')">${esc(l.numero)}</span></div>` : ''}</td></tr>`; }).join('')

// --- liquidar comisiones
function renderComLiq(){
  $('#view').innerHTML = `<div class="card" style="margin-bottom:14px"><h3>Pendientes por aseguradora</h3><div class="sub">Elige una aseguradora, marca las comisiones que te está pagando y registra la liquidación.</div>
    <div class="grid" id="liqAseg" style="grid-template-columns:repeat(auto-fit,minmax(190px,1fr))"></div></div>
  <div class="card" style="margin-bottom:14px"><h3>Comisiones por liquidar</h3>${baseNota()}
    <div class="toolbar">${ksel('liq','aseg','Todas las aseguradoras',asegList(),'liqSel.clear();renderComLiq()')}${kfechas('liq','liqSel.clear();drawComLiq()')}
    <button class="btn sm" onclick="liqTodo()">Marcar todas</button><button class="btn sm" onclick="liqSel.clear();drawComLiq()">Quitar selección</button>${expBtns(`exportCom(comFiltrados(kst.liq,true),'comisiones-por-liquidar','Comisiones por liquidar',kfiltros('liq'),FMT)`)}</div>
    <div id="liqBar" style="margin-bottom:10px"></div>
    <div class="tbl-wrap"><table><thead><tr><th></th><th>Recibo</th><th>Cliente / póliza</th><th>Cobrado el</th><th class="num">Prima cobrada</th><th class="num">Prima neta</th><th class="num">%</th><th class="num">Comisión</th><th>Estado</th></tr></thead><tbody id="liqRows"></tbody></table></div></div>
  <div class="card"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px"><h3 style="flex:1;margin:0">Historial de liquidaciones</h3>${expBtns(`exportLiqs(FMT)`)}</div><div class="tbl-wrap"><table><thead><tr><th>No.</th><th>Fecha</th><th>Aseguradora</th><th class="num">Pagos</th><th class="num">Bruto</th><th class="num">Retención</th><th class="num">Neto recibido</th><th>Referencia</th><th></th></tr></thead><tbody id="liqHist"></tbody></table></div></div>`;
  drawComLiq();
}
function drawComLiq(){
  const m = {};
  comPagos().filter(c => comEstado(c) !== 'Liquidada').forEach(c => { const a = cobroInfo(c).p.aseguradora || '—'; m[a] = m[a] || {n:0, t:0}; m[a].n++; m[a].t += comMonto(c); });
  $('#liqAseg').innerHTML = Object.entries(m).sort((a,b) => b[1].t - a[1].t).map(([a,v]) => `<div class="card" style="cursor:pointer;padding:12px;${kst.liq.aseg===a?'border-color:var(--brand);background:var(--brand-soft)':''}" onclick="kst.liq.aseg=kst.liq.aseg==='${esc(a)}'?'':'${esc(a)}';liqSel.clear();renderComLiq()">
    <div style="font-weight:600">${esc(a)}</div><div style="font-size:18px;font-weight:700;color:var(--amber)">${DOP(v.t)}</div><div class="sub" style="margin:0">${v.n} comisión(es)</div></div>`).join('') || '<div class="sub">No hay comisiones pendientes. 🎉</div>';
  const rows = comFiltrados(kst.liq, true);
  $('#liqRows').innerHTML = rows.map(c => { const i = cobroInfo(c);
    return `<tr><td><input type="checkbox" ${liqSel.has(c.id)?'checked':''} onchange="this.checked?liqSel.add('${c.id}'):liqSel.delete('${c.id}');drawLiqBar()"></td>
    <td>${esc(c.recibo||'—')}</td><td>${esc(i.cli)}<div class="sub" style="margin:0">${esc(i.p.numero||'')} · ${esc(i.p.aseguradora||'')}</div></td><td>${fmtD(c.fechaPago)}</td>
    <td class="num">${DOP(c.monto)}</td><td class="num">${DOP(cobNeta(c))}</td><td class="num">${comRate(i.p)}%</td><td class="num"><b>${DOP(comMonto(c))}</b></td><td>${comPill(comEstado(c))}</td></tr>`; }).join('')
    || '<tr><td colspan="9" class="empty">Nada por liquidar con estos filtros</td></tr>';
  drawLiqBar();
  $('#liqHist').innerHTML = db.liquidaciones.slice().sort((a,b) => b.fecha.localeCompare(a.fecha)).map(l => `<tr><td><span class="link" onclick="verLiq('${l.id}')">${esc(l.numero)}</span></td><td>${fmtD(l.fecha)}</td><td>${esc(l.aseguradora)}</td><td class="num">${l.items.length}</td>
    <td class="num">${DOP(l.bruto)}</td><td class="num">${DOP(l.retencion)}</td><td class="num"><b>${DOP(l.neto)}</b></td><td>${esc(l.referencia)}</td>
    <td style="text-align:right"><button class="btn sm" onclick="verLiq('${l.id}')">Ver</button> <button class="btn sm danger" onclick="anularLiq('${l.id}')">Anular</button></td></tr>`).join('')
    || '<tr><td colspan="9" class="empty">Todavía no hay liquidaciones</td></tr>';
}
function liqTodo(){ comFiltrados(kst.liq, true).forEach(c => liqSel.add(c.id)); drawComLiq(); }
function drawLiqBar(){
  const sel = [...liqSel].map(id => byId('cobros', id)).filter(Boolean);
  const esp = sel.filter(c => comEstado(c) === 'Esperando remesa').length;
  $('#liqBar').innerHTML = sel.length ? `<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--brand-soft);padding:10px 12px;border-radius:8px">
    <b>${sel.length} seleccionada(s) · prima neta ${DOP(sumNeta(sel))} · comisión ${DOP(sumCom(sel))}</b><button class="btn sm primary" onclick="liquidar()">Liquidar comisiones</button>
    ${esp ? `<span class="sub" style="margin:0">⚠ ${esp} todavía tienen la prima en oficina</span>` : ''}</div>`
    : '<div class="sub" style="margin:0">Marca las comisiones de una misma aseguradora para registrar su pago.</div>';
}
function liquidar(){
  const sel = [...liqSel].map(id => byId('cobros', id)).filter(Boolean);
  const asegs = [...new Set(sel.map(c => cobroInfo(c).p.aseguradora))];
  if (asegs.length > 1) return toast('Selecciona comisiones de una sola aseguradora');
  const bruto = +sumCom(sel).toFixed(2);
  $('#dlgT').textContent = 'Liquidación de ' + asegs[0];
  $('#dlgB').innerHTML = `<p class="sub" style="font-size:14px">${sel.length} comisión(es) · bruto <b>${DOP(bruto)}</b></p>
    <form class="form" id="frm"><label>Fecha en que pagó la aseguradora *<input name="fecha" type="date" required value="${today()}"></label>
    <label>Referencia (transferencia, cheque) *<input name="referencia" required></label>
    <label>Retención aplicada (DOP)<input name="retencion" type="number" step="0.01" min="0" value="0" oninput="$('#liqNeto').textContent=DOP(${bruto}-(+this.value||0))"></label>
    <label>Neto recibido<div id="liqNeto" style="font-size:20px;font-weight:700;color:var(--green);padding-top:6px">${DOP(bruto)}</div></label>
    <label class="full">Notas<textarea name="notas" rows="2"></textarea></label></form>`;
  $('#dlgF').innerHTML = `<button class="btn" onclick="dlg.close()">Cancelar</button><button class="btn primary" onclick="confirmarLiq(${bruto})">Guardar liquidación</button>`;
  dlg.showModal();
}
function confirmarLiq(bruto){
  const frm = $('#frm'); if (!frm.reportValidity()) return;
  const d = Object.fromEntries(new FormData(frm)), sel = [...liqSel].map(id => byId('cobros', id)).filter(Boolean);
  const n = Math.max(100, ...db.liquidaciones.map(l => +String(l.numero).replace(/\D/g,'') || 0)) + 1, id = uid();
  const retencion = +d.retencion || 0;
  db.liquidaciones.push({id, numero:'LIQ-' + n, aseguradora:cobroInfo(sel[0]).p.aseguradora, fecha:d.fecha, referencia:d.referencia, notas:d.notas, retencion, bruto, neto:+(bruto - retencion).toFixed(2), items:sel.map(c => c.id)});
  sel.forEach(c => { c.comEstado = 'Liquidada'; c.liqId = id; });

      if (k === 'comEdit' && el.checked) { pf.d.comEdit = false; pf.d.comision = pfCalc().pct; pf.d.comEdit = true; }

      <label><span>Anexo / endoso</span><input name="anexo" placeholder="Si el pago es de un anexo"></label><label><span>No. de remisión</span><input name="remision"></label>

  $('#dlgF').innerHTML = `<button class="btn" onclick="dlg.close()">Cancelar</button><button class="btn primary" onclick="crearPagos('${id}')">Crear pagos</button>`;

function npPlan(id){
  const d = Object.fromEntries(new FormData($('#frm'))), total = r2(d.valor), n = npModo === 'uno' ? 1 : Math.max(1, Math.min(60, +d.n || 1)), cada = +d.cada || 1;
  if (!(total > 0) || !d.fecha) return {d, q:[]};
  const q = []; let acc = 0;
  for (let i = 0; i < n; i++) { const m = i === n - 1 ? r2(total - acc) : r2(total / n); acc = r2(acc + m); q.push({vence:addMonths(d.fecha, i * cada), monto:m}); }
  return {d, q};
}
function npPrev(id){
  const {q} = npPlan(id);
  $('#npPrev').innerHTML = q.length > 1 ? `<div class="tbl-wrap"><table class="ftbl"><thead><tr><th>#</th><th>Fecha límite</th><th class="num">Valor</th></tr></thead><tbody>${q.map((x, i) => `<tr><td>${i + 1}</td><td>${fmtD(x.vence)}</td><td class="num">${DOP(x.monto)}</td></tr>`).join('')}</tbody></table></div>` : '';
}
function crearPagos(id){
  const frm = $('#frm'); if (!frm.reportValidity()) return;
  const p = byId('polizas', id), {d, q} = npPlan(id); if (!q.length) return;
  const ya = db.cobros.filter(c => c.polizaId === id).reduce((s, c) => s + +c.monto, 0), falta = r2(polBruta(p) - ya), nuevo = r2(q.reduce((s, x) => s + x.monto, 0));
  if (nuevo > falta + 0.009) return toast(falta > 0 ? `Solo quedan ${DOP(falta)} de la prima por programar; los pagos no pueden pasar de ${DOP(polBruta(p))}` : `La prima de ${DOP(polBruta(p))} ya está programada completa`);
  q.forEach(x => db.cobros.push({id:uid(), polizaId:id, monto:x.monto, vencimiento:x.vence, estado:'Pendiente', fechaPago:'', metodo:p.medioPago || 'Transferencia', anexo:d.anexo || '', remision:d.remision || '', cuota:''}));
  // renumerar n/N por fecha
  const mias = db.cobros.filter(c => c.polizaId === id).sort((a, b) => a.vencimiento.localeCompare(b.vencimiento));
  mias.forEach((c, i) => c.cuota = (i + 1) + '/' + mias.length);
  p.historial = [...(p.historial || []), {fecha:new Date().toISOString(), accion:'Pagos agregados', cambios:[['Pagos', '', q.length + ' por ' + DOP(q.reduce((s, x) => s + x.monto, 0))]]}];
  save(); dlg.close(); toast(q.length + ' pago(s) creados en Cobros'); render();
}

function guardarPago(cid){
  const frm = $('#frm'); if (!frm.reportValidity()) return;
  const d = Object.fromEntries(new FormData(frm)), c = byId('cobros', cid);
  if (d.monto !== undefined) {
    const p = byId('polizas', c.polizaId), otros = db.cobros.filter(x => x.polizaId === c.polizaId && x.id !== cid).reduce((s, x) => s + +x.monto, 0), max = r2(polBruta(p) - otros);

async function borrarPago(cid){
  const c = byId('cobros', cid); if (!(await pregunta(`¿Borrar el pago ${c.cuota || ''} de ${DOP(c.monto)}?`, {ok:'Borrar', peligro:true}))) return;

// spec = {archivo, titulo, filtros, secciones:[{titulo, cols:[{l, t:'text'|'money'|'num'|'pct'|'date'}], rows:[[...]], totales?:[...]}]}
const expBtns = call => `<button class="btn sm" onclick="${call.replace('FMT', "'xlsx'")}" title="Exportar lo filtrado a Excel">⬇ Excel</button><button class="btn sm" onclick="${call.replace('FMT', "'pdf'")}" title="Exportar lo filtrado a PDF">⬇ PDF</button>`;

function fmtCell(v, t){

  if (t === 'pct') return (+v).toLocaleString('es-DO', {maximumFractionDigits:2}) + '%';

async function exportar(spec, fmt){
  if (!spec.secciones.some(s => s.rows.length)) return toast('No hay datos para exportar con estos filtros');
  const name = spec.archivo + '-' + today() + '.' + fmt;
  const blob = fmt === 'pdf' ? new Blob([pdfBytes(spec)], {type:'application/pdf'})
    : new Blob([xlsxBytes(spec)], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});

}
async function saveFile(name, blob){
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch(e) {}
  if (dl) {
    try { await dl.save({filename:name, data:blob}); toast('Archivo listo: ' + name); }
    catch(e) { if (e && e.code !== 'declined') toast('No se pudo descargar (' + (e.code || 'error') + ')'); }
    return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

      ws = ws.map((w, i) => base(w, i) + (w - base(w, i)) * k); sum = ws.reduce((a, b) => a + b, 0); }

    header();

      if (y < M + 24) { newPage(); header(); }
      if (idx % 2) rect(M, y - RH + 3, avail, RH, '0.965 0.973 0.984');
      let x = M; r.forEach((v, i) => { const s = fitTxt(v, ws[i] - 8, fs, bold); text(s, right[i] ? x + ws[i] - 4 - txtW(s, fs, bold) : x + 4, y - 8, fs, bold); x += ws[i]; });

    cells.forEach((r, i) => row(r, false, i));

    if (tot) { ops.push(`${azul} RG 0.8 w ${M} ${(y + 3).toFixed(2)} m ${M + avail} ${(y + 3).toFixed(2)} l S`); row(tot, true, 0); }
    text(`${sec.rows.length} registro(s)`, M, y - 8, 7, false, gris); y -= 22;
  });
  pages.push(ops);

  const f1 = add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
  const f2 = add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
  const pagesId = objs.length + 1 + pages.length * 2; const kids = [];
  pages.forEach((p, i) => {

  });
  add(`<< /Type /Pages /Kids [${kids.map(k => k + ' 0 R').join(' ')}] /Count ${kids.length} >>`);
  const cat = add(`<< /Type /Catalog /Pages ${pagesId} 0 R >>`);
  const info = add(`<< /Title ${pdfStr(spec.titulo)} /Producer (CorrePlus CRM) >>`);
  let out = '%PDF-1.4\n%\xE2\xE3\xCF\xD3\n'; const offs = [];
  objs.forEach((o, i) => { offs.push(out.length); out += `${i + 1} 0 obj\n${o}\nendobj\n`; });
  const xref = out.length;
  out += `xref\n0 ${objs.length + 1}\n0000000000 65535 f \n` + offs.map(o => String(o).padStart(10, '0') + ' 00000 n \n').join('');
  out += `trailer\n<< /Size ${objs.length + 1} /Root ${cat} 0 R /Info ${info} 0 R >>\nstartxref\n${xref}\n%%EOF`;
  const bytes = new Uint8Array(out.length); for (let i = 0; i < out.length; i++) bytes[i] = out.charCodeAt(i) & 255;

}

const PDF_LIBS = ['https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'];

function canvasPdf(w, cv){

function artBackend(){
  return {

  for (let i = 0; ; i += 1000) {
    const r = await SB.from('registros').select('coleccion,id,data').order('coleccion').order('id').range(i, i + 999);
    if (r.error) throw r.error;
    r.data.forEach(x => { (nuevo[x.coleccion] = nuevo[x.coleccion] || []).push(x.data); (f[x.coleccion] = f[x.coleccion] || {})[x.id] = JSON.stringify(x.data); });
    if (r.data.length < 1000) break;
  }
  const m = await SB.from('meta').select('clave,valor'); if (m.error) throw m.error;
  m.data.forEach(x => meta[x.clave] = x.valor);
  Object.values(nuevo).forEach(a => a.sort(nbOrden));
  return {f, nuevo, meta};
}
function sbEscuchar(){
  let cola = false;
  const listo = () => { if (cola) return; cola = true; setTimeout(() => { cola = false; nbRefrescar(); }, 300); };
  SB.channel('crm').on('postgres_changes', {event:'*', schema:'public', table:'registros'}, p => {
    const r = p.eventType === 'DELETE' ? p.old : p.new; if (!r || !r.coleccion) return;
    if (nbAplicarItems(r.coleccion, {[r.id]: p.eventType === 'DELETE' ? null : JSON.stringify(r.data)})) listo();
  }).on('postgres_changes', {event:'*', schema:'public', table:'meta'}, p => {
    const r = p.new; if (!r || !r.clave) return;
    if (nbAplicarMeta([{id:r.clave, data:() => ({v:r.valor})}])) listo();
  }).subscribe();
}
// el primero que entra a un sistema vacío queda como administrador
function asegurarAdmin(){
  if (!YO) return;
  db.usuarios = db.usuarios || [];
  if (!db.usuarios.some(u => (u.email || '').trim())) {
    let u = db.usuarios.find(u => u.rol === 'Administrador');
    if (!u) { u = {id:uid(), nombre:YO.email.split('@')[0].toUpperCase(), rol:'Administrador', estado:'Activo', sede:'Principal'}; db.usuarios.push(u); }
    u.email = YO.email; u.estado = 'Activo';
  }
  YO.usuario = db.usuarios.find(u => (u.email || '').toLowerCase() === YO.email.toLowerCase()) || null;
}
async function sbIniciar(){
  document.body.classList.add('bloqueado');
  try { await sbCargarLib(); } catch (e) { return pantallaLogin('No se pudo cargar el sistema. Revise su conexión a internet.'); }
  SB = window.supabase.createClient(CRM_SUPABASE.url, CRM_SUPABASE.key);
  SB.auth.onAuthStateChange((ev) => { if (ev === 'PASSWORD_RECOVERY') pantallaLogin('', 'nueva'); });
  const {data} = await SB.auth.getSession();
  if (location.hash.includes('type=recovery')) return;  // lo maneja PASSWORD_RECOVERY
  if (!data.session) return pantallaLogin();
  await sbEntrar(data.session.user);
}
async function sbEntrar(user){
  YO = {email:(user.email || '').toLowerCase(), usuario:null};
  pantallaLogin('', 'cargando');
  try {
    const ok = await SB.rpc('crm_acceso'); if (ok.error) throw ok.error;
    if (!ok.data) return pantallaLogin('Su correo ' + YO.email + ' no está activo en el sistema. Pida al administrador que le agregue en Configuración › Usuarios.', 'sinacceso');
    const {f, nuevo, meta} = await sbCargarTodo();
    const vacio = !Object.keys(nuevo).length && !Object.keys(meta).length;
    if (vacio) { db = seed(); migrarCatalogos(); NUBE.synced = {f:{}, meta:{}}; }
    else {
      Object.keys(meta).forEach(k => { if (k[0] !== '_') nuevo[k] = JSON.parse(meta[k]); });
      ['clientes','polizas','cobros','tareas','siniestros','liquidaciones'].forEach(k => nuevo[k] = nuevo[k] || []);
      nuevo.config = nuevo.config || {itbis:true, itbisTasa:16, sinEjemplos:true};
      db = nuevo; NUBE.synced = {f, meta};
      migrarCatalogos();
    }
    asegurarAdmin();
    if (!YO.usuario || YO.usuario.estado === 'Inactivo') return pantallaLogin('Su usuario no está activo. Pida al administrador que le active.', 'sinacceso');
    NUBE.be = sbBackend(); NUBE.db = true; NUBE.listo = true; NUBE.seq = Date.now();
    try { localStorage.setItem(KEY, JSON.stringify(db)); } catch(e) {}
    sbEscuchar();
    $('#login')?.remove(); document.body.classList.remove('bloqueado');
    current = 'inicio'; pintarYo(); renderNav(); render(); nbMarca('ok'); nbProgramar();
  } catch (e) { console.warn(e); pantallaLogin('No se pudieron cargar los datos: ' + (e.message || e), 'sinacceso'); }
}
function pintarYo(){
  const el = $('#yo'); if (!el) return;
  el.innerHTML = YO && YO.usuario ? `<span>${esc(YO.usuario.nombre)}</span><button class="btn" onclick="cambiarClave()">Mi contraseña</button><button class="btn" onclick="salir()">Salir</button>` : '';
}
async function salir(){ try { await SB.auth.signOut(); } catch(e) {} try { localStorage.removeItem(KEY); } catch(e) {} location.reload(); }
function cambiarClave(){
  $('#dlgT').textContent = 'Cambiar mi contraseña';
  $('#dlgB').innerHTML = `<div class="form"><label class="full">Nueva contraseña (mínimo 8)<input type="password" id="nClave"></label><label class="full">Repetirla<input type="password" id="nClave2"></label></div>`;
  $('#dlgF').innerHTML = `<button class="btn" onclick="dlg.close()">Cancelar</button><button class="btn primary" onclick="guardarClave()">Guardar</button>`;
  dlg.showModal();
}
async function guardarClave(){
  const a = $('#nClave').value, b = $('#nClave2').value;
  if (a.length < 8) return toast('Mínimo 8 caracteres'); if (a !== b) return toast('Las contraseñas no coinciden');
  const r = await SB.auth.updateUser({password:a}); if (r.error) return toast(sbError(r.error));
  dlg.close(); toast('Contraseña cambiada');
}
const sbError = e => {
  const m = (e && (e.message || e.error_description)) || String(e);
  if (/Invalid login/i.test(m)) return 'Correo o contraseña incorrectos.';
  if (/Email not confirmed/i.test(m)) return 'Falta confirmar el correo: abra el enlace que le llegó por email.';
  if (/already registered/i.test(m)) return 'Ese correo ya tiene contraseña. Use "Entrar" u "Olvidé mi contraseña".';
  if (/Password should be/i.test(m)) return 'La contraseña debe tener al menos 8 caracteres.';
  if (/rate limit/i.test(m)) return 'Demasiados intentos. Espere unos minutos.';
  return m;
};
function pantallaLogin(msg, modo){
  modo = modo || 'entrar';
  let el = $('#login'); if (!el) { el = document.createElement('div'); el.id = 'login'; document.body.appendChild(el); }
  const titulo = {entrar:'Entrar al sistema', crear:'Crear mi contraseña', olvide:'Recuperar contraseña', nueva:'Nueva contraseña', cargando:'Cargando datos…', sinacceso:'Sin acceso'}[modo];
  const campos = {
    entrar:`<label>Correo<input type="email" id="lgEmail" autocomplete="username"></label><label>Contraseña<input type="password" id="lgClave" autocomplete="current-password"></label>
      <button class="btn primary" onclick="lgEntrar()">Entrar</button>
      <div class="lg-links"><span class="link" onclick="pantallaLogin('','crear')">Primera vez: crear mi contraseña</span><span class="link" onclick="pantallaLogin('','olvide')">Olvidé mi contraseña</span></div>`,
    crear:`<div class="sub">Use el correo con que el administrador le registró en Usuarios.</div><label>Correo<input type="email" id="lgEmail" autocomplete="username"></label><label>Contraseña (mínimo 8)<input type="password" id="lgClave" autocomplete="new-password"></label><label>Repetir contraseña<input type="password" id="lgClave2" autocomplete="new-password"></label>
      <button class="btn primary" onclick="lgCrear()">Crear contraseña</button><div class="lg-links"><span class="link" onclick="pantallaLogin()">Volver</span></div>`,
    olvide:`<label>Correo<input type="email" id="lgEmail" autocomplete="username"></label><button class="btn primary" onclick="lgOlvide()">Enviarme el enlace</button><div class="lg-links"><span class="link" onclick="pantallaLogin()">Volver</span></div>`,
    nueva:`<label>Nueva contraseña (mínimo 8)<input type="password" id="lgClave" autocomplete="new-password"></label><button class="btn primary" onclick="lgNueva()">Guardar y entrar</button>`,
    cargando:'', sinacceso:`<button class="btn" onclick="salir()">Salir</button>`,
  }[modo];
  el.innerHTML = `<div class="lg-card"><img src="${LOGO_COLOR}" alt="Correplus" class="lg-logo"><h2>${titulo}</h2>${msg ? `<div class="lg-msg">${esc(msg)}</div>` : ''}<div class="lg-form" onkeydown="if(event.key==='Enter'){const b=this.querySelector('.btn.primary');b&&b.click()}">${campos}</div></div>`;
  setTimeout(() => el.querySelector('input')?.focus(), 30);
}
const lgVal = id => ($('#' + id)?.value || '').trim();
async function lgEntrar(){
  const r = await SB.auth.signInWithPassword({email:lgVal('lgEmail'), password:$('#lgClave').value});
  if (r.error) return pantallaLogin(sbError(r.error));
  sbEntrar(r.data.user);
}
async function lgCrear(){
  const e = lgVal('lgEmail'), a = $('#lgClave').value;
  if (a.length < 8) return toast('Mínimo 8 caracteres'); if (a !== $('#lgClave2').value) return toast('Las contraseñas no coinciden');
  const r = await SB.auth.signUp({email:e, password:a, options:{emailRedirectTo:location.origin + location.pathname}});
  if (r.error) return pantallaLogin(sbError(r.error), 'crear');
  if (r.data.session) return sbEntrar(r.data.user);
  pantallaLogin('Le enviamos un correo a ' + e + '. Abra el enlace para confirmar y luego entre con su contraseña.');
}
async function lgOlvide(){
  const r = await SB.auth.resetPasswordForEmail(lgVal('lgEmail'), {redirectTo:location.origin + location.pathname});
  pantallaLogin(r.error ? sbError(r.error) : 'Si el correo está registrado, le llegará un enlace para poner una contraseña nueva.');
}
async function lgNueva(){
  const a = $('#lgClave').value; if (a.length < 8) return toast('Mínimo 8 caracteres');
  const r = await SB.auth.updateUser({password:a}); if (r.error) return pantallaLogin(sbError(r.error), 'nueva');
  history.replaceState(null, '', location.pathname); sbEntrar(r.data.user);
}
const _renderBase = render;
render = function(){ if (NUBE.pendiente) { NUBE.pendiente = false; nbMarca(NUBE.estado); }
  document.body.classList.toggle('ro', !puedeEditar()); return _renderBase.apply(this, arguments); };
if (window.CRM_SUPABASE && CRM_SUPABASE.url) { sbIniciar(); }
else { renderNav(); render(); save(); nbMarca('local'); nbIniciar(); }
</script>
